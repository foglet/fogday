<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tone Pairs | fogday</title>
<meta name="description" content="Practice Mandarin tones, one two-character word at a time, with recorded voices.">
<meta name="theme-color" content="#fbf8f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&family=Noto+Serif+SC:wght@500&family=Noto+Sans+SC:wght@500&family=Noto+Serif+TC:wght@500&family=Noto+Sans+TC:wght@500&family=Zhi+Mang+Xing&family=Liu+Jian+Mao+Cao&display=swap" rel="stylesheet">
<style>
/* ---- From zhcy/_build/template.html (copied in at build time) ---- */
/*ZHCY_STYLE*/
/* ---- Tone Pairs ---- */
/* The footer row stays on screen in every view, so 發財 can always bring back the single word. */
main>.wrap>.actions{position:sticky;bottom:0;z-index:4;background:var(--paper)}
.tp{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--s5) 0;touch-action:pan-y}
.tp-progress{margin:0 0 var(--s4);color:var(--ink-2);font-size:var(--fs-sm)}
.tp-word{display:flex;justify-content:center;gap:.04em;border:0;background:transparent;color:var(--ink);padding:var(--s3);cursor:pointer;
  font-size:clamp(5rem,23vw,8rem);line-height:1.2;border-radius:var(--r-md);-webkit-tap-highlight-color:transparent}
.tp-col{display:flex;flex-direction:column;align-items:center;min-width:1em}
.tp-g{display:inline-block}
.tp-zy{color:var(--ink-2);font:1.125rem/1.5 system-ui,sans-serif;margin-top:var(--s1)}
.tp-py{color:var(--ink-2);font:1.125rem/1.5 var(--font);margin-top:var(--s1)}
.tp-def{margin:var(--s5) 0 0;color:var(--ink-2);text-align:center;min-height:1.5em}
.tp-sandhi{margin:var(--s2) 0 0;color:var(--accent);text-align:center;font-size:var(--fs-lg)}
.tp-sandhi[hidden]{display:none}
@keyframes tpNext{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes tpPrev{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tp-g{animation:none!important}}
.tp-grid{list-style:none;margin:0;padding:var(--s2) 0 var(--s5);display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.tp-tile{width:100%;min-height:112px;padding:var(--s3) var(--s2);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform 80ms var(--ease),border-color var(--dur) var(--ease)}
.tp-tile:active{transform:scale(.97)}
.tp-tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tp-tile .hz{font-family:var(--song);font-weight:500;font-size:2.4rem;line-height:1.1}
.tp-tile .py{color:var(--primary);font-weight:600}
@media (prefers-reduced-motion:reduce){.tp-tile{transition:none}}
/* Meaning language menu (from /zh20), opened by the translate button, bottom left. */
.lang{display:flex;align-items:center;gap:2px;width:auto;min-width:var(--tap);padding:0 var(--s1)}
.tp-code{font:600 var(--fs-cap)/1 var(--font);color:var(--ink-2)}
.tp-langs{position:absolute;bottom:100%;left:4px;display:flex;flex-direction:column;z-index:3;background:var(--paper);border-radius:var(--r-sm)}
.tp-langs[hidden]{display:none}
.tp-langs button{min-width:var(--tap);min-height:var(--tap);border:0;background:none;color:var(--ink-2);font:600 var(--fs-sm) var(--font);cursor:pointer;text-align:left;padding:0 var(--s2)}
.tp-langs button:hover{color:var(--ink)}
.tp-langs button[aria-checked="true"]{color:var(--primary)}
</style>
</head>
<body>
<!--ZHCY_HEADER-->

<main id="main">
  <div class="wrap">
  <div class="view" id="vHome">
    <h1 class="vh">Tone Pairs</h1>
    <section class="tp" id="tp" aria-label="Tone pair practice">
      <p class="tp-progress" id="prog"></p>
      <button class="tp-word" id="word" type="button"></button>
      <p class="tp-def" id="def"></p>
      <div class="tp-sandhi" id="sandhi" hidden></div>
    </section>
  </div>

  <div class="view" id="vBooks" hidden>
    <section aria-labelledby="bH">
      <h2 class="vh" id="bH">Word grid</h2>
      <ul class="tp-grid" id="list"></ul>
    </section>
  </div>

<!--ZHCY_ACTIONS-->
  </div>
</main>

<script>
(() => {
const W = /*WORDS*/[];
const CLIPS = /*CLIPS*/{};
const BASE = '/assets/echo/zh/';
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
/* Meaning language, as on /zh20 (tonepairs:lang): EN, DE, ES, FR, ZH. Tapping ZH again switches Simplified and Traditional. */
const LANGS = ['en', 'de', 'es', 'fr', 'zh', 'zht'];
let LANG = store.get('tonepairs:lang', 'en'); if(!LANGS.includes(LANG)) LANG = 'en';
let cur = Math.min(Math.max(+store.get('tone:cur', 0) || 0, 0), W.length - 1);
let stars = new Set(store.get('tone:stars', []));
let clipPos = store.get('tone:pos', {}) || {};

const FONTS = ["var(--song)", "var(--hei)", "var(--kai)", "var(--ou)", "var(--xing)", "var(--cao)"];
let lastFont = -1;
function font(){ let i; do { i = Math.floor(Math.random() * FONTS.length); } while(i === lastFont); lastFont = i; return FONTS[i]; }

let noteTimer;
function note(msg){ const n = $('#note'); n.textContent = msg; clearTimeout(noteTimer); if(msg) noteTimer = setTimeout(() => n.textContent = '', 2500); }

const form = w => LANG === 'zh' ? w.hs : LANG === 'zht' ? w.ht : w.w;
const mean = w => w[LANG] || w.en;
const isZh = () => LANG === 'zh' || LANG === 'zht';
const LT = () => LANG === 'zht' ? 'zh-Hant' : 'zh-Hans';

/* ---------- audio: recorded MP3s, cycling voices; speech synthesis if a word has none ---------- */
const audio = new Audio(); audio.preload = 'none';
function speakTTS(text){
  const SS = window.speechSynthesis; if(!SS){ note('Pronunciation is not available in this browser.'); return; }
  SS.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; u.rate = .8; SS.speak(u);
}
function play(k){
  const w = W[k == null ? cur : k], list = CLIPS[w.w] || [];
  if(!list.length){ speakTTS(w.w); return; }
  const i = (clipPos[w.w] || 0) % list.length; clipPos[w.w] = i + 1; store.set('tone:pos', clipPos);
  audio.pause(); audio.src = BASE + encodeURIComponent(list[i]);
  audio.play().catch(() => note('Could not play the recording.'));
}

/* ---------- word ---------- */
function render(dir){
  const w = W[cur], b = $('#word');
  b.lang = LT(); b.style.fontFamily = font();
  b.setAttribute('aria-label', 'Play ' + form(w) + ', ' + w.p);
  const cols = Array.from(form(w)).map((ch, i) => {
    const col = document.createElement('span'); col.className = 'tp-col';
    const g = document.createElement('span'); g.className = 'tp-g'; g.textContent = ch;
    const z = document.createElement('span'); z.className = 'tp-zy'; z.lang = 'zh-Bopo'; z.textContent = w.z[i] || '';
    const p = document.createElement('span'); p.className = 'tp-py'; p.lang = 'zh-Latn-pinyin'; p.textContent = w.s[i] || '';
    if(dir && !matchMedia('(prefers-reduced-motion: reduce)').matches)
      g.style.animation = (dir > 0 ? 'tpNext' : 'tpPrev') + ' 520ms var(--spring) ' + (i * 75) + 'ms both';
    col.append(g, z, p); return col;
  });
  b.replaceChildren(...cols);
  const d = $('#def'); d.textContent = mean(w); d.lang = isZh() ? LT() : LANG;
  const s = $('#sandhi'); s.hidden = !w.sandhi;
  s.replaceChildren(...(w.sandhi || []).map(t => { const x = document.createElement('div'); x.textContent = t; return x; }));
  $('#prog').textContent = (cur + 1) + ' / ' + W.length;
  const st = $('#star'); st.setAttribute('aria-pressed', String(stars.has(w.w)));
  store.set('tone:cur', cur);
}
function move(delta){
  const n = cur + delta; if(n < 0 || n >= W.length) return;
  cur = n; render(delta); play();
}

/* ---------- views: home, word list (books), info ---------- */
/* Word grid (game controller): 2 x 20 tiles, as in the first version. Tap plays; tap again for the next voice. */
let lit = null;
function list(){
  $('#list').replaceChildren(...W.map((w, i) => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; b.className = 'tp-tile'; b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', form(w) + ', ' + w.p + ', play');
    const h = document.createElement('span'); h.className = 'hz'; h.lang = LT(); h.textContent = form(w);
    const p = document.createElement('span'); p.className = 'py'; p.lang = 'zh-Latn-pinyin'; p.textContent = w.p;
    b.append(h, p);
    b.addEventListener('click', () => {
      if(lit && lit !== b) lit.setAttribute('aria-pressed', 'false');
      lit = b; b.setAttribute('aria-pressed', 'true'); cur = i; store.set('tone:cur', cur); play(i);
    });
    li.append(b); return li;
  }));
  lit = null;
}
audio.addEventListener('ended', () => { if(lit){ lit.setAttribute('aria-pressed', 'false'); lit = null; } });
let VIEW = 'home';
const GAME_SVG = $('#bfc').innerHTML;
function view(v){
  VIEW = v;
  $('#vHome').hidden = v !== 'home'; $('#vBooks').hidden = v !== 'books';
  const el = $(v === 'home' ? '#vHome' : '#vBooks');
  el.classList.remove('in'); void el.offsetWidth; el.classList.add('in');
  /* The 發財 slot toggles: game controller on the single word, 發財 on the grid. */
  const f = $('#bfc');
  if(v === 'books'){ f.innerHTML = '發財'; f.lang = 'zh-Hant'; f.setAttribute('aria-label', 'Single word'); list(); }
  else { f.innerHTML = GAME_SVG; f.removeAttribute('lang'); f.setAttribute('aria-label', 'Word grid'); render(0); }
  f.setAttribute('aria-expanded', String(v === 'books'));
}
$('#bfc').addEventListener('click', () => { view(VIEW === 'books' ? 'home' : 'books'); $('#bfc').focus(); });
/* The header is the /zhcy header: its section icons open those sections on the chengyu page. */
document.querySelectorAll('.top .tab').forEach(t => t.addEventListener('click', () => { location.href = '../#' + t.dataset.view; }));

/* ---------- language: the /zh20 menu, opened from the translate button ---------- */
const lb = $('#lang');
const menu = document.createElement('div');
menu.className = 'tp-langs'; menu.id = 'langMenu'; menu.setAttribute('role', 'radiogroup'); menu.setAttribute('aria-label', 'Meaning language'); menu.hidden = true;
[['en', 'EN'], ['de', 'DE'], ['es', 'ES'], ['fr', 'FR'], ['zh', 'ZH']].forEach(([k, t]) => {
  const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'radio'); b.dataset.lang = k; b.textContent = t; menu.append(b);
});
$('.actions').append(menu);
lb.setAttribute('aria-controls', 'langMenu'); lb.setAttribute('aria-expanded', 'false'); lb.setAttribute('aria-haspopup', 'true');
lb.removeAttribute('lang');
const code = document.createElement('span'); code.className = 'tp-code'; code.setAttribute('aria-hidden', 'true'); lb.append(code);
function openMenu(o){ menu.hidden = !o; lb.setAttribute('aria-expanded', String(o)); if(o) (menu.querySelector('[aria-checked="true"]') || menu.firstChild).focus(); }
lb.addEventListener('click', () => openMenu(menu.hidden));
menu.addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if(!b) return;
  const k = b.dataset.lang;
  LANG = k === 'zh' ? (LANG === 'zh' ? 'zht' : LANG === 'zht' ? 'zh' : 'zh') : k;   // second tap on ZH: Traditional
  store.set('tonepairs:lang', LANG); applyLang();
  if(k !== 'zh'){ openMenu(false); lb.focus(); }   // ZH stays open so a second tap can switch script
});
menu.addEventListener('keydown', e => {
  const items = [...menu.children], i = items.indexOf(document.activeElement);
  if(e.key === 'ArrowUp' || e.key === 'ArrowLeft'){ e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  if(e.key === 'ArrowDown' || e.key === 'ArrowRight'){ e.preventDefault(); items[(i + 1) % items.length].focus(); }
});
document.addEventListener('click', e => { if(!menu.hidden && !e.target.closest('.tp-langs,#lang')) openMenu(false); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !menu.hidden){ openMenu(false); lb.focus(); } });
function applyLang(){
  document.documentElement.lang = isZh() ? LT() : LANG;
  /* Header text as on /zhcy: English title with the Chinese subtitle, or the Chinese title alone. */
  $('.brand b').textContent = LANG === 'zh' ? '每日成语' : LANG === 'zht' ? '每日成語' : 'Chengyu';
  const sub = $('#sub'); sub.lang = LT(); sub.textContent = LANG === 'zht' ? '每日成語' : '每日成语';
  const label = {en: 'EN', de: 'DE', es: 'ES', fr: 'FR', zh: 'ZH', zht: '繁'}[LANG];
  code.textContent = label;
  lb.setAttribute('aria-label', 'Meaning language: ' + {en: 'English', de: 'German', es: 'Spanish', fr: 'French', zh: 'Chinese, Simplified', zht: 'Chinese, Traditional'}[LANG]);
  menu.querySelectorAll('[data-lang]').forEach(b => {
    const on = b.dataset.lang === LANG || (b.dataset.lang === 'zh' && LANG === 'zht');
    b.setAttribute('aria-checked', String(on));
    if(b.dataset.lang === 'zh'){ b.textContent = LANG === 'zht' ? '繁' : 'ZH'; b.setAttribute('aria-label', LANG === 'zh' ? 'Chinese, Simplified. Tap again for Traditional' : LANG === 'zht' ? 'Chinese, Traditional. Tap again for Simplified' : 'Chinese'); }
  });
  render(0); if(VIEW === 'books') list();
}

/* ---------- footer actions ---------- */
$('#word').addEventListener('click', () => play());

$('#play').addEventListener('click', () => play());
$('#copy').addEventListener('click', async () => {
  const text = form(W[cur]);
  try{ await navigator.clipboard.writeText(text); note('Copied ' + text); }catch(e){ note('Could not copy'); }
});
$('#star').addEventListener('click', () => {
  const k = W[cur].w; stars.has(k) ? stars.delete(k) : stars.add(k);
  store.set('tone:stars', [...stars]); render(0); note(stars.has(k) ? 'Starred' : 'Unstarred');
});

/* ---------- swipe and arrow keys ---------- */
document.addEventListener('keydown', e => {
  if(VIEW !== 'home' || e.target.closest('input,textarea')) return;
  if(e.key === 'ArrowLeft') move(-1); if(e.key === 'ArrowRight') move(1);
});
let sx = null, sy = 0; const tp = $('#tp');
tp.addEventListener('touchstart', e => { if(e.touches.length !== 1){ sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive: true});
tp.addEventListener('touchend', e => {
  if(sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2){ e.preventDefault(); move(dx < 0 ? 1 : -1); }
}, {passive: false});

applyLang();
})();
</script>
</body>
</html>
