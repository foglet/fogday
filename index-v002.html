	<!-- Full-width banner: breaks out of .container regardless of its max-width/padding -->
	<style>
		html, body { overflow-x: hidden; }
		.full-bleed {
			width: 98vw;
			max-width: 100vw;
			margin-left: calc(50% - 49vw);
			margin-right: calc(50% - 49vw);
			padding: 0;
		}
		.full-bleed a, .full-bleed img {
			display: block;
			width: 98%;
			max-width: none;
			height: auto;
			margin: 0;
		}
	</style>

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/unveil/1.3.0/jquery.unveil.min.js"></script>
	<script>
		$(function() {
			$("img").unveil(300);
		});
	</script>
