<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>San Francisco Tides</title>
<meta name="description" content="Tide times and tide charts for Baker Beach, East Beach and Ocean Beach in San Francisco.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one narrow column, like a tide card you check on the beach — beach picker, now, day curve, day list, week. */
:root{
  --bg:#EBF0EF;          /* fog */
  --surface:#F7FAF9;
  --ink:#10242C;
  --muted:#5A6F76;
  --line:#CCD8D8;
  --water:#1D6F8E;       /* Golden Gate channel */
  --water-fill:rgba(29,111,142,.16);
  --night:rgba(16,36,44,.06);
  --buoy:#D9622B;        /* channel buoy */
  --sand:#B58B45;        /* minus-tide sand */
  --sand-bg:rgba(181,139,69,.14);
  --moon-lit:#F3EBD3;--moon-dark:#C3CFD0;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C181D;--surface:#122329;--ink:#E3EDEE;--muted:#8DA3A9;--line:#24393F;
  --water:#4DB0CF;--water-fill:rgba(77,176,207,.18);--night:rgba(0,0,0,.28);
  --buoy:#F08A52;--sand:#D9B36E;--sand-bg:rgba(217,179,110,.14);--moon-lit:#F1E6C4;--moon-dark:#2A3E45;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C181D;--surface:#122329;--ink:#E3EDEE;--muted:#8DA3A9;--line:#24393F;
  --water:#4DB0CF;--water-fill:rgba(77,176,207,.18);--night:rgba(0,0,0,.28);
  --buoy:#F08A52;--sand:#D9B36E;--sand-bg:rgba(217,179,110,.14);--moon-lit:#F1E6C4;--moon-dark:#2A3E45;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--buoy);outline-offset:2px;border-radius:6px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7vw,44px);line-height:1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.picker{display:flex;flex-direction:column;gap:4px}
.picker label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.select{position:relative}
.select select{appearance:none;-webkit-appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:9px 40px 9px 16px;font-weight:600;font-size:16px;cursor:pointer;min-width:190px}
.select::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.place{color:var(--muted);font-size:14px;margin:6px 0 0}

.now{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center}
.now .level{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,12vw,64px);line-height:.95;letter-spacing:-.03em}
.now .level small{font-size:.4em;font-weight:500;margin-left:4px;color:var(--muted)}
.now .state{display:flex;flex-direction:column;gap:4px;min-width:0}
.dir{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:18px}
.dir svg{width:18px;height:18px;fill:var(--water)}
.next{color:var(--muted)}
.next b{color:var(--ink);font-weight:600}

.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 12px;display:flex;flex-direction:column;gap:12px}
.daynav{display:flex;align-items:center;gap:8px}
.daynav h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0;flex:1;min-width:0;letter-spacing:-.01em}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--muted)}
.iconbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.today{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
.today:hover{border-color:var(--muted)}
.chart{width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tick{font-family:var(--f-data);font-size:11px;fill:var(--muted)}
.chart .lab{font-family:var(--f-data);font-size:11.5px;fill:var(--ink)}
.chart .labt{font-family:var(--f-data);font-size:11px;fill:var(--muted)}

.events{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.ev{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);min-width:0}
.pill{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;flex:none}
.pill.H{background:var(--water-fill);color:var(--water)}
.pill.L{background:var(--sand-bg);color:var(--sand)}
.ev .t{font-weight:600}
.ev .h{margin-left:auto;color:var(--muted)}
.sun{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.sun span b{color:var(--ink);font-weight:500}

.week h3{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0 0 8px}
.weeklist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.wd{display:grid;grid-template-columns:76px minmax(0,1fr) auto;align-items:center;gap:14px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.wd:hover{background:var(--surface)}
.wd[aria-current="date"]{background:var(--surface)}
.wd .dname{display:flex;flex-direction:column;line-height:1.15}
.wd .dname b{font-weight:600}
.wd .dname span{color:var(--muted);font-size:13px}
.wd svg{width:100%;height:34px;display:block}
.wd .lo{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;color:var(--muted)}
.wd .lo b{color:var(--ink);font-weight:500}
.chip{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sand);background:var(--sand-bg);padding:2px 7px;border-radius:999px}

.moon{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.moon svg{width:34px;height:34px;flex:none}
.moon .mtxt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.moon .mtxt b{font-weight:600}
.moon .mtxt span{color:var(--muted);font-size:14px}
.moon .mfull{margin-left:auto;text-align:right;display:flex;flex-direction:column;line-height:1.25}
.moon .mfull span{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.moon .mfull b{font-weight:600}
@media (max-width:460px){.moon .mfull{margin-left:0;text-align:left;flex-basis:100%}}
footer{color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px;max-width:65ch}
@media (max-width:460px){
  .now{grid-template-columns:1fr}
  .wd{grid-template-columns:62px minmax(0,1fr) auto;gap:10px}
}
@media (prefers-reduced-motion:no-preference){.chart path.tide{transition:d .3s}}
</style>
</head>
<body>
<div class="wrap">
  <section class="moon" id="moon" aria-label="Moon phase"></section>
  <header>
    <div class="brand">
      <span class="eyebrow">San Francisco</span>
      <h1>Tides</h1>
    </div>
    <div class="picker">
      <label for="beach">Beach</label>
      <div class="select">
        <select id="beach">
          <option value="baker">Baker Beach</option>
          <option value="east">East Beach</option>
          <option value="ocean">Ocean Beach</option>
        </select>
      </div>
    </div>
  </header>
  <p class="place" id="place"></p>

  <section class="now" id="now" aria-live="polite"></section>

  <section class="day" aria-label="Tide chart">
    <div class="daynav">
      <button class="iconbtn" id="prev" aria-label="Previous day"><svg viewBox="0 0 14 14"><path d="M9 2 4 7l5 5"/></svg></button>
      <h2 id="dayTitle"></h2>
      <button class="today" id="todayBtn" hidden>Today</button>
      <button class="iconbtn" id="next" aria-label="Next day"><svg viewBox="0 0 14 14"><path d="m5 2 5 5-5 5"/></svg></button>
    </div>
    <div class="chart" id="chart"></div>
    <div class="events" id="events"></div>
    <div class="sun" id="sun"></div>
  </section>

  <section class="week">
    <h3>Next 7 days</h3>
    <div class="weeklist" id="week"></div>
  </section>

  <footer>
    <span id="source"></span>
    <span>Heights in feet above mean lower low water (MLLW). A minus tide drops below that line, the best time for tidepools. These are astronomical predictions; wind and swell change the real water level. Not for navigation.</span>
  </footer>
</div>

  const name = nearNew ? 'New moon' : nearFull ? 'Full moon' : Math.abs(p-.25)<day ? 'First quarter'
    : Math.abs(p-.75)<day ? 'Last quarter' : p<.25 ? 'Waxing crescent' : p<.5 ? 'Waxing gibbous' : p<.75 ? 'Waning gibbous' : 'Waning crescent';
  return {p, lit, name, nextFull, age:(now-prevNew)/864e5};
}

function moonIcon(p){
  const r=15, waning=p>.5, q=waning?1-p:p, rx=(r*Math.abs(Math.cos(2*Math.PI*q))).toFixed(2), sweep=q<.25?0:1;
  return `<svg viewBox="-17 -17 34 34" aria-hidden="true"><circle r="${r}" fill="var(--moon-dark)"/>`+
    `<path transform="${waning?'scale(-1,1)':''}" d="M0,-${r} A${r},${r} 0 0 1 0,${r} A${rx},${r} 0 0 ${sweep} 0,-${r}Z" fill="var(--moon-lit)"/>`+
    `<circle r="${r}" fill="none" stroke="var(--line)" stroke-width="1"/></svg>`;
}
const fFull=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
function renderMoon(){
  const m=moonInfo(Date.now());
  $('moon').innerHTML=`${moonIcon(m.p)}<div class="mtxt"><b>${m.name}</b><span class="num">${Math.round(m.lit*100)}% lit · day ${Math.floor(m.age)+1} of 29.5</span></div>
    <div class="mfull"><span>Next full moon</span><b class="num">${fFull.format(new Date(m.nextFull))}</b></div>`;
}

/* ---- Data ---- */
function dayData(key, day){
  const start=laTime(day.y,day.m,day.d), end=laTime(...Object.values(addDays(day,1)));
  const p=pred(BEACHES[key].st);
  // Pad the window: subordinate stations shift reference extremes by up to ±2 h.
  const ext=p.getExtremesPrediction({start:new Date(start-3*36e5), end:new Date(end+3*36e5), ...opts}).extremes
    .map(e=>({t:+new Date(e.time), v:e.level, high:e.high}))
    .filter(e=>e.t>=start && e.t<end);
  const tl=p.getTimelinePrediction({start:new Date(start-36e5), end:new Date(end+36e5), timeFidelity:600, ...opts}).timeline
    .map(x=>({t:+new Date(x.time), v:x.level}));
  return {start, end, ext, tl};
}

/* ---- State ---- */
let beach = 'baker';
const hashBeach = (location.hash||'').slice(1);
if (BEACHES[hashBeach]) beach = hashBeach;
else { try { const s=localStorage.getItem('sf-tides-beach'); if (BEACHES[s]) beach=s; } catch(e){} }
let view = todayKey();
const $ = id => document.getElementById(id);
$('beach').value = beach;

/* ---- Rendering ---- */
const NS='http://www.w3.org/2000/svg';
const Y0=-2.5, Y1=8;

function drawChart(d, isToday){
  const box=$('chart'), W=Math.max(280, box.clientWidth), H=W<520?230:280;
  const pl=30, pr=8, pt=34, pb=26, iw=W-pl-pr, ih=H-pt-pb;
  const x=t=>pl+(t-d.start)/(d.end-d.start)*iw;
  const y=v=>pt+(Y1-v)/(Y1-Y0)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Tide height through the day">`;
  s+=`<defs><clipPath id="clip"><rect x="${pl}" y="0" width="${iw}" height="${H}"/></clipPath></defs>`;
  const sun=sunTimes(view);
  s+=`<rect x="${pl}" y="${pt}" width="${Math.max(0,x(sun.rise)-pl)}" height="${ih}" fill="var(--night)"/>`;
  s+=`<rect x="${x(sun.set)}" y="${pt}" width="${Math.max(0,pl+iw-x(sun.set))}" height="${ih}" fill="var(--night)"/>`;
  for (let v=-2; v<=8; v+=2){
    s+=`<line x1="${pl}" x2="${pl+iw}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v===0?1.4:1}" ${v===0?'':'stroke-dasharray="2 4"'}/>`;
    s+=`<text class="tick" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v<0?'−'+(-v):v}</text>`;
  }
  const hrs=[0,6,12,18,24], hl=['12a','6a','12p','6p','12a'];
  const nd=addDays(view,1);
  hrs.forEach((h,i)=>{
    const t = h===24 ? d.end : laTime(view.y,view.m,view.d,h);
    s+=`<text class="tick" x="${x(t)}" y="${H-6}" text-anchor="${i===0?'start':i===4?'end':'middle'}">${hl[i]}</text>`;
  });
  const pts=d.tl.map(p=>`${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`);
  s+=`<g clip-path="url(#clip)"><path class="tide" d="M${pts[0].split(',')[0]},${y(Y0)} L${pts.join(' L')} L${pts[pts.length-1].split(',')[0]},${y(Y0)} Z" fill="var(--water-fill)"/>`;
  s+=`<path d="M${pts.join(' L')}" fill="none" stroke="var(--water)" stroke-width="2.2" stroke-linejoin="round"/></g>`;
  d.ext.forEach(e=>{
    const ex=x(e.t), ey=y(e.v);
    const anchor = ex<pl+40 ? 'start' : ex>pl+iw-40 ? 'end' : 'middle';
    s+=`<circle cx="${ex}" cy="${ey}" r="4" fill="var(--surface)" stroke="${e.high?'var(--water)':'var(--sand)'}" stroke-width="2"/>`;
    if (e.high){
      s+=`<text class="lab" x="${ex}" y="${ey-20}" text-anchor="${anchor}">${ft(e.v)} ft</text><text class="labt" x="${ex}" y="${ey-8}" text-anchor="${anchor}">${fShort(e.t)}</text>`;
    } else {
      s+=`<text class="lab" x="${ex}" y="${ey+19}" text-anchor="${anchor}">${ft(e.v)} ft</text><text class="labt" x="${ex}" y="${ey+31}" text-anchor="${anchor}">${fShort(e.t)}</text>`;
    }
  });
  if (isToday){
    const now=Date.now(), lv=pred(BEACHES[beach].st).getWaterLevelAtTime({time:new Date(now), ...opts}).level;
    s+=`<line x1="${x(now)}" x2="${x(now)}" y1="${pt-6}" y2="${pt+ih}" stroke="var(--buoy)" stroke-width="1.5"/>`;
    s+=`<circle cx="${x(now)}" cy="${y(lv)}" r="5.5" fill="var(--buoy)" stroke="var(--surface)" stroke-width="2"/>`;
    s+=`<text class="tick" x="${x(now)}" y="${pt-10}" text-anchor="${x(now)<pl+30?'start':x(now)>pl+iw-30?'end':'middle'}" style="fill:var(--buoy)">now</text>`;
  }
  box.innerHTML=s+'</svg>';
}

function renderNow(){
  const el=$('now'), now=Date.now(), p=pred(BEACHES[beach].st);
  const lv=p.getWaterLevelAtTime({time:new Date(now), ...opts}).level;
  const nx=p.getExtremesPrediction({start:new Date(now-3*36e5), end:new Date(now+30*36e5), ...opts}).extremes
    .filter(e=>+new Date(e.time)>now);
  const n1=nx[0], n2=nx[1];
  const rising=n1 && n1.high;
  const mins=n1 ? Math.round((+new Date(n1.time)-now)/6e4) : 0;
  const dur = mins>=60 ? `${Math.floor(mins/60)} h ${mins%60} min` : `${mins} min`;
  const arrow = rising ? '<path d="M9 2 16 10h-4.5v6h-5v-6H2z"/>' : '<path d="M9 16 2 8h4.5V2h5v6H16z"/>';
  const nLow=nx.find(e=>e.low), nHigh=nx.find(e=>e.high);
  const line=(lab,e)=> e ? `<span class="next">${lab}: <b class="num">${fTime.format(new Date(e.time))}</b> · <span class="num">${ft(e.level)} ft</span>${e===n1?` · in ${dur}`:''}</span>` : '';
  const order = rising ? [['Next high tide',nHigh],['Next low tide',nLow]] : [['Next low tide',nLow],['Next high tide',nHigh]];
  el.innerHTML = `<div class="level num">${ft(lv)}<small>ft</small></div>
    <div class="state"><span class="dir"><svg viewBox="0 0 18 18" aria-hidden="true">${arrow}</svg>Tide is ${rising?'rising':'falling'}</span>
    ${order.map(([l,e])=>line(l,e)).join('')}</div>`;
}

function spark(d){
  const W=200,H=34, x=t=>(t-d.start)/(d.end-d.start)*W, y=v=>2+(Y1-v)/(Y1-Y0)*(H-4);
  const pts=d.tl.filter((p,i)=>i%3===0).map(p=>`${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(' L');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1"/><path d="M${pts}" fill="none" stroke="var(--water)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

function renderWeek(){
  const t=todayKey(), list=$('week');
  let html='';
  for (let i=0;i<7;i++){
    const day=addDays(t,i), d=dayData(beach,day);
    const lows=d.ext.filter(e=>!e.high), lo=lows.reduce((a,b)=>b.v<a.v?b:a, lows[0]);
    const label = i===0 ? 'Today' : fWk.format(dayDate(day));
    html+=`<button class="wd" data-off="${i}" ${same(day,view)?'aria-current="date"':''}>
      <span class="dname"><b>${label}</b><span>${fMd.format(dayDate(day))}</span></span>
      ${spark(d)}
      <span class="lo">${lo?`<span>Low <b class="num">${ft(lo.v)}</b> · <span class="num">${fShort(lo.t)}</span></span>${lo.v<0?'<span class="chip">Minus tide</span>':''}`:''}</span>
    </button>`;
  }
  list.innerHTML=html;
}

function render(){
  const b=BEACHES[beach], t=todayKey(), isToday=same(view,t);
  renderMoon();
  $('place').textContent=b.place;
  $('source').textContent=SOURCE[b.st];
  $('dayTitle').textContent = (isToday?'Today, ':'') + fDay.format(dayDate(view));
  $('todayBtn').hidden = isToday;
  $('now').hidden = !isToday;
  if (isToday) renderNow();
  const d=dayData(beach,view);
  drawChart(d,isToday);
  $('events').innerHTML = d.ext.map(e=>`<div class="ev"><span class="pill ${e.high?'H':'L'}">${e.high?'High':'Low'}</span><span class="t num">${fTime.format(new Date(e.t))}</span><span class="h num">${ft(e.v)} ft</span></div>`).join('');
  const s=sunTimes(view);
  $('sun').innerHTML=`<span>Sunrise <b class="num">${fTime.format(new Date(s.rise))}</b></span><span>Sunset <b class="num">${fTime.format(new Date(s.set))}</b></span><span>Shaded areas on the chart are night.</span>`;
  renderWeek();
}

$('beach').addEventListener('change', e=>{
  beach=e.target.value;
  try{ localStorage.setItem('sf-tides-beach', beach); }catch(err){}
  render();
});
$('prev').addEventListener('click', ()=>{ view=addDays(view,-1); render(); });
$('next').addEventListener('click', ()=>{ view=addDays(view,1); render(); });
$('todayBtn').addEventListener('click', ()=>{ view=todayKey(); render(); });
$('week').addEventListener('click', e=>{ const b=e.target.closest('.wd'); if(!b) return; view=addDays(todayKey(), +b.dataset.off); render(); });
let rt; addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>drawChart(dayData(beach,view), same(view,todayKey())), 120); });
setInterval(()=>{ renderMoon(); if (same(view,todayKey())) { renderNow(); drawChart(dayData(beach,view), true); } }, 60000);
render();
</script>
</body>
</html>
