<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOG · Fogday Studios</title>
<meta name="description" content="FOG: San Francisco's fog rolling in through the Golden Gate, seen from above, as pixel art driven by the wind, the marine layer, the sun and the heat inland. By Fogday Studios.">

{% include head.html %}
<style>
  /* FOG: the Golden Gate from above, 125 m per pixel. Same page format as /waves/: the picture sticks at the top,
     sliders in titled groups below, Info and the language code on the last line. Site colors and fonts from fogday.css. */
  :root:lang(zh) {
    --font-ui: "Fira Sans", "Heiti SC", STHeiti, SimHei, "Kaiti SC", STKaiti, KaiTi, sans-serif;
  }
  .fog { display: flex; flex-direction: column; gap: 24px; padding-block: 12px 36px; }
  .fog .label { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .fog .title { margin: 0; font: 400 1.6rem/1.1 var(--font-logo, "Patua One", serif); }
  .fog .sub { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
  .fog canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  /* The picture never scrolls away: it sticks right under the fixed 8px color bar, as on /waves/ */
  .fog .stick { position: sticky; top: 8px; z-index: 21; border-radius: 12px; overflow: hidden; background: #0c2a40; }
  .fog #fog-map { width: 100%; aspect-ratio: 196/140; cursor: pointer; touch-action: manipulation; }
  @media (max-width: 520px) { .fog .stick { width: calc(100% + 40px); margin-inline: -20px; border-radius: 0; } }
  .fog .readout { color: var(--muted); font-size: .85rem; margin-top: -14px; font-variant-numeric: tabular-nums; }
  .fog .readout b { color: var(--ink); font-weight: 600; }
  .fog .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .fog fieldset { background: var(--surface); border: 0; border-radius: 12px; padding: 12px 16px 14px; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .fog legend { float: left; width: 100%; padding: 0; margin-bottom: 4px; }
  .fog fieldset label { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 6.5em; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }
  .fog fieldset label output { color: var(--ink); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .fog input[type=range] { width: 100%; accent-color: var(--accent); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fog fieldset { background: transparent; padding-inline: 0; } }
  :root[data-theme="dark"] .fog fieldset { background: transparent; padding-inline: 0; }
  @media (max-width: 640px) { .fog fieldset label { grid-template-columns: 7.5em minmax(0, 1fr) 5.5em; } }
  .fog .langbtn { float: left; background: none; border: 0; padding: 6px 16px 6px 0; margin: 0; cursor: pointer; font-size: .75rem; font-weight: 600;
    letter-spacing: .14em; color: var(--accent); -webkit-tap-highlight-color: transparent; }
  .fog .notes { color: var(--muted); font-size: .85rem; line-height: 1.5; max-width: 65ch; }
  .fog .notes summary { list-style: none; cursor: pointer; display: inline-block; font-size: .75rem; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 6px 0; }
  .fog .notes summary::-webkit-details-marker { display: none; }
  .fog .notes summary::after { content: " +"; }
  .fog .notes[open] summary::after { content: " –"; }
  .fog .notes-body { clear: both; display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
  .fog .notes a { color: var(--accent); }
  /* Bottom nav as clear as it can be, as on /waves/ */
  footer { background: transparent !important; border-top: 0 !important; }
  footer .wrap { text-shadow: 0 0 6px var(--bg), 0 0 2px var(--bg); }
</style>
</head>

{% include header.html current="maps" title=page.title %}

<main>
  <div class="wrap fog">
    <div class="stick">
      <canvas id="fog-map" width="196" height="140" tabindex="0" role="button" aria-pressed="false"></canvas>

    <div class="readout" id="fog-readout" aria-live="polite"></div>

    <div class="groups">
      <fieldset>
        <legend class="label" data-t="gFog">Fog</legend>

        <legend class="label" data-t="gWind">Wind</legend>

        <label><span data-t="sim">Sim speed</span> <input id="fog-sim" type="range" min="5" max="100" value="50"><output id="fog-simOut"></output></label>

    <div class="foot">
      <button class="langbtn" id="langBtn" type="button">EN</button>
      <details class="notes">

          <span data-t="n1"></span>
          <span data-t="n2"></span>
          <span data-t="n3"></span>
          <span data-t="n4"></span>
          <span data-t="n5"></span>
        </div>
      </details>
    </div>
  </div>

    [-122.5050, 37.7800, 70, .8], [-122.4920, 37.7650, 60, 1.6],
    [-122.4990, 37.8325, 280, .9], [-122.4855, 37.8370, 280, .8], [-122.4930, 37.8520, 290, 1.0], [-122.5200, 37.8400, 250, 1.2],
    [-122.4900, 37.8700, 280, 1.5], [-122.5100, 37.8750, 350, 1.8], [-122.5300, 37.8900, 400, 2.0],
    [-122.4650, 37.8880, 200, 1.0], [-122.4650, 37.8730, 100, .4], [-122.4317, 37.8608, 240, .8], [-122.3670, 37.8100, 100, .4],
  ];
  const elev = new Float32Array(W * H);

  const line = (a, b) => { const p = [], n = Math.ceil(Math.hypot(X(b[0]) - X(a[0]), Y(b[1]) - Y(a[1]))) * 2; for (let k = 0; k <= n; k++) p.push([Math.round(X(a[0]) + (X(b[0]) - X(a[0])) * k / n), Math.round(Y(a[1]) + (Y(b[1]) - Y(a[1])) * k / n)]); return p; };
  const GGB = line([-122.4770, 37.8107], [-122.4787, 37.8263]);

  // ---------- sliders ----------
  const el = id => document.getElementById('fog-' + id);
  const ui = {}; ['bank', 'top', 'wind', 'dir', 'time', 'heat', 'sim'].forEach(k => ui[k] = el(k));
  const val = k => +ui[k].value;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const COMPASS = { en: ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'],

                    es: ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'],
                    zh: ['北','北东北','东北','东东北','东','东东南','东南','南东南','南','南西南','西南','西西南','西','西西北','西北','北西北'] };
  const compass = d => COMPASS[lang][Math.round(d / 22.5) % 16];
  // Time: 0 = now (the live clock); n = n hours ahead, on the hour, through the forecast
  const LOCALE = { en: 'en-US', fr: 'fr-FR', es: 'es-ES', zh: 'zh-CN' };
  let hour0 = Math.floor(Date.now() / 36e5) * 36e5;
  const timeMs = () => val('time') ? hour0 + val('time') * 36e5 : Date.now();
  function fmtTime(withOffset) {

    return withOffset ? `${s} (+${val('time')} h)` : s;
  }
  function outputs() {
    el('bankOut').textContent = val('bank') + '%';
    el('topOut').textContent = val('top') + ' m';
    el('windOut').textContent = val('wind') ? val('wind') + ' kt' : t('calm');
    el('dirOut').textContent = `${compass(val('dir'))} ${val('dir')}°`;
    el('timeOut').textContent = fmtTime(false);
    el('heatOut').textContent = val('heat') + ' °F';
    el('simOut').textContent = (val('sim') / 100).toFixed(2) + '×';
  }

  // ---------- sun (approximate, San Francisco), for the time of day on today's date ----------
  const R = Math.PI / 180, LAT = 37.81, LONG = -122.48;
  function sunElev(ms) {
    const D = (ms - Date.UTC(2000, 0, 1, 12)) / 864e5, gA = (357.529 + .98560028 * D) * R, q = 280.459 + .98564736 * D;

  // ---------- fog: the Doom fire rule on its side ----------
  // f = fog density 0..36 per pixel. The west edge is the source (the fog bank, with drifting streaks). Each step every pixel
  // moves one pixel downwind (east), wanders a pixel up or down, drifts north or south with the wind, and thins by one
  // with a chance P that depends on the pixel it lands on. Hills above the marine layer thin it by several at once.
  const N = 36;
  let f = new Uint8Array(W * H), prev = new Uint8Array(W * H);
  const P = new Float32Array(W * H), BLOCK = new Uint8Array(W * H);
  const streak = new Float32Array(H);
  { const raw = Array.from({ length: H }, () => Math.random());
    for (let y = 0; y < H; y++) { let s = 0; for (let k = -5; k <= 5; k++) s += raw[(y + k + H) % H]; streak[y] = s / 11; }
    const lo = Math.min(...streak), hi = Math.max(...streak); for (let y = 0; y < H; y++) streak[y] = (streak[y] - lo) / (hi - lo); }
  let streakOff = 0, light = 1, sunK = 0, dayK = 1, billowX = 0, billowY = 0;
  function physics() {   // per-pixel thinning, from the sliders; recomputed when they change
    const el0 = sunElev(timeMs());
    sunK = clamp(Math.sin(Math.max(0, el0) * R) * 1.4, 0, 1);                 // how hard the sun works on the fog
    light = clamp(.22 + .78 * (el0 + 6) / 24, .22, 1);                           // how lit the scene is
    dayK = clamp((el0 + 8) / 14, 0, 1);                                          // fog: white by day, blue-grey at night
    const heatK = clamp((val('heat') - 55) / 40, 0, 1), top = val('top');
    for (let i = 0; i < W * H; i++) {
      if (!land[i]) { P[i] = .012 + .03 * sunK; BLOCK[i] = 0; continue; }       // the cold Bay keeps fog
      const e = elev[i], over = e - top;
      // Sun and inland heat burn it off over land: shades lost per step, from 0.12 (night) to ~2.2 (hot afternoon sun)
      let p = .12 + sunK * (.3 + 1.8 * heatK);
      if (e > top * .7) p += (e / top - .7) * 1.5;                                 // thinner near the top of the layer
      P[i] = clamp(p, .02, 4); BLOCK[i] = over > 0 ? Math.min(N, 3 + Math.floor(over / 20)) : 0;
    }
  }
  function windVec() {   // travel direction: east component (pixels per step along x is always 1 when > 0), north/south drift per step
    const to = (val('dir') + 180) * R, ue = Math.sin(to), vn = Math.cos(to);
    return { ue, dy: ue > .1 ? clamp(-vn / ue, -1.5, 1.5) : 0 };
  }
  function step() {
    const { ue, dy } = windVec(), bank = val('bank') / 100;
    if (ue > .1 && val('wind') > 0) {
      streakOff += .12;   // the bank's lobes slide slowly along the edge
      for (let y = 0; y < H; y++) {
        // The whole west edge feeds fog, over the Marin coast too (its hills thin or stop it, as anywhere else).
        // A thick bank is solid; a thin one breaks into slow lobes with clear gaps between them.
        const s = streak[Math.floor(y + streakOff) % H], lobe = 1 - (1 - bank) * 1.6 * s;
        f[y * W] = Math.max(0, Math.round(N * clamp(bank * 1.15, 0, 1) * clamp(lobe, 0, 1) - Math.random()));
      }

      for (let x = W - 2; x >= 0; x--) for (let y = 0; y < H; y++) {
        const v = f[y * W + x];
        let ny = y + ((Math.random() * 3) | 0) - 1 + Math.floor(dy + Math.random());
        ny = ny < 0 ? 0 : ny >= H ? H - 1 : ny;
        const dst = ny * W + x + 1;
        if (v === 0) { f[dst] = 0; continue; }

        f[dst] = v > dec ? v - dec : 0;
      }
    } else {   // calm or offshore: no new fog comes in, and what's here thins out where it sits
      const k = val('wind') > 0 && ue <= .1 ? .25 : .04;

  // ---------- drawing ----------
  const cv = document.getElementById('fog-map'), ctx = cv.getContext('2d'), img = ctx.createImageData(W, H), d = img.data;

  // ---------- readout, words, language ----------
  function readout() {
    const { ue } = windVec(), gate = GGB.reduce((s, [x, y]) => s + fogAt0(x, y), 0) / GGB.length;

    document.getElementById('fog-readout').innerHTML = `<b>${state}</b> · ${val('wind') ? val('wind') + ' kt ' + compass(val('dir')) : t('calm')} · ${val('top')} m · ${fmtTime(true)}`;
  }
  const fogAt0 = (x, y) => f[clamp(y, 0, H - 1) * W + clamp(x, 0, W - 1)] / N;
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(e => e.innerHTML = t(e.dataset.t));   // trusted text from the table above

  // ---------- conditions from the National Weather Service: now, and hour by hour ahead ----------
  // The gridded forecast for the water just outside the Gate (wind, humidity, fog flag, visibility, mixing height) and for
  // the Mission (temperature inland). Loaded once; the Time slider reads any hour from them. Sliders the visitor has moved

    if (ms >= a && ms < b) return v.value; } return null; };
  const lastHour = layer => { let e = 0; for (const v of (layer && layer.values) || []) { const [s0, du] = String(v.validTime).split('/');
    const m = /P(?:(\d+)D)?(?:T(?:(\d+)H)?)?/.exec(du || '') || []; e = Math.max(e, +new Date(s0) + ((+m[1] || 0) * 24 + (+m[2] || 0)) * 36e5); } return e; };

    if (GATE) {
      const spd = at(GATE.windSpeed, ms), dir = at(GATE.windDirection, ms), rh = at(GATE.relativeHumidity, ms), wx = at(GATE.weather, ms),
            vis = at(GATE.visibility, ms), mix = at(GATE.mixingHeight, ms);
      if (spd != null) set('wind', Math.round(spd / 1.852));                                   // km/h → kt
      if (dir != null) set('dir', (Math.round(dir / 5) * 5) % 360);
      const fogFlag = Array.isArray(wx) && wx.some(w => w && /fog/.test(w.weather || ''));
      const visK = vis == null ? 0 : vis < 1000 ? 30 : vis < 3000 ? 15 : 0;                    // m
      if (rh != null) set('bank', Math.round(clamp(clamp((rh - 70) / 30, 0, 1) * 60 + (fogFlag ? 30 : 0) + visK, 0, 100)));
      if (mix != null) set('top', Math.round(mix / 10) * 10);                                 // m
    }

  }
  async function live() {
    const h = { headers: { Accept: 'application/geo+json' } };
    const get = async u => { const r = await fetch(u, h); if (!r.ok) throw new Error(r.status); return r.json(); };
    const grid = async (lat, lon) => (await get((await get(`https://api.weather.gov/points/${lat},${lon}`)).properties.forecastGridData)).properties;
    try { GATE = await grid(37.82, -122.52); } catch (e) {}   // just outside the Gate
    try { CITY = await grid(37.76, -122.415); } catch (e) {}  // the Mission
    if (GATE) {   // the Time slider reaches as far as the forecast does (whole hours, up to a week)
      const end = lastHour(GATE.windSpeed);
      if (end > hour0) ui.time.max = Math.max(1, Math.min(168, Math.floor((end - hour0) / 36e5) - 1));
    }
    forecastAt(timeMs());
    outputs(); physics(); readout();
  }

  // ---------- start ----------
  physics();
  for (let i = 0; i < W * 1.3; i++) step();   // warm up: fog already in
  prev.set(f);
  applyLang(); draw(0);

  requestAnimationFrame(loop);

})();
