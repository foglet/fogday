title: FOG

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOG · Fogday Studios</title>
<meta name="description" content="FOG: San Francisco's fog rolling in through the Golden Gate, seen from above, as pixel art driven by the wind, the marine layer, the sun and the heat inland. By Fogday Studios.">

{% include head.html %}
<style>
  /* FOG: the Golden Gate from above, 125 m per pixel. Same page format as /waves/: the picture sticks at the top,
     sliders in titled groups below, Info and the language code on the last line. Site colors and fonts from fogday.css. */
  :root:lang(zh) {
    --font-ui: "Fira Sans", "Heiti SC", STHeiti, SimHei, "Kaiti SC", STKaiti, KaiTi, sans-serif;
  }
  .fog { display: flex; flex-direction: column; gap: 24px; padding-block: 12px 36px; }
  .fog .label { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .fog .title { margin: 0; font: 400 1.6rem/1.1 var(--font-logo, "Patua One", serif); }
  .fog .sub { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
  .fog canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  /* The picture never scrolls away: it sticks right under the fixed 8px color bar, as on /waves/ */
  .fog .stick { position: sticky; top: 8px; z-index: 21; border-radius: 12px; overflow: hidden; background: #0c2a40; }
  .fog #fog-map { width: 100%; aspect-ratio: 196/140; cursor: pointer; touch-action: manipulation; }
  /* Bridges: a pixel sprite on a layer 2x finer than the map (62.5 m per pixel), so they read as bridges */
  .fog #fog-bridges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  @media (max-width: 520px) { .fog .stick { width: calc(100% + 40px); margin-inline: -20px; border-radius: 0; } }
  .fog .readout { color: var(--muted); font-size: .85rem; margin-top: -14px; font-variant-numeric: tabular-nums; }
  .fog .readout b { color: var(--ink); font-weight: 600; }
  .fog .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .fog fieldset { background: var(--surface); border: 0; border-radius: 12px; padding: 12px 16px 14px; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .fog legend { float: left; width: 100%; padding: 0; margin-bottom: 4px; }
  .fog fieldset label { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 6.5em; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }
  .fog fieldset label output { color: var(--ink); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .fog input[type=range] { width: 100%; accent-color: var(--accent); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fog fieldset { background: transparent; padding-inline: 0; } }
  :root[data-theme="dark"] .fog fieldset { background: transparent; padding-inline: 0; }
  @media (max-width: 640px) { .fog fieldset label { grid-template-columns: 7.5em minmax(0, 1fr) 5.5em; } }
  .fog .langbtn { float: left; background: none; border: 0; padding: 6px 16px 6px 0; margin: 0; cursor: pointer; font-size: .75rem; font-weight: 600;
    letter-spacing: .14em; color: var(--accent); -webkit-tap-highlight-color: transparent; }
  .fog .notes { color: var(--muted); font-size: .85rem; line-height: 1.5; max-width: 65ch; }
  .fog .notes summary { list-style: none; cursor: pointer; display: inline-block; font-size: .75rem; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 6px 0; }
  .fog .notes summary::-webkit-details-marker { display: none; }
  .fog .notes summary::after { content: " +"; }
  .fog .notes[open] summary::after { content: " –"; }
  .fog .notes-body { clear: both; display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
  .fog .notes a { color: var(--accent); }
  /* Bottom nav as clear as it can be, as on /waves/ */
  footer { background: transparent !important; border-top: 0 !important; }
  footer .wrap { text-shadow: 0 0 6px var(--bg), 0 0 2px var(--bg); }
</style>
</head>
<body class="wide">

{% include header.html current="maps" title=page.title %}

<main>
  <div class="wrap fog">
    <div class="stick">
      <canvas id="fog-map" width="196" height="140" tabindex="0" role="button" aria-pressed="false"></canvas>
      <canvas id="fog-bridges" width="392" height="280" aria-hidden="true"></canvas>
    </div>
    <div class="readout" id="fog-readout" aria-live="polite"></div>

    <div class="groups">
      <fieldset>
        <legend class="label" data-t="gFog">Fog</legend>
        <label><span data-t="bank">Fog bank</span> <input id="fog-bank" type="range" min="0" max="100" value="70"><output id="fog-bankOut"></output></label>
        <label><span data-t="top">Marine layer top</span> <input id="fog-top" type="range" min="100" max="900" step="10" value="350"><output id="fog-topOut"></output></label>
      </fieldset>
      <fieldset>
        <legend class="label" data-t="gWind">Wind</legend>
        <label><span data-t="speed">Wind speed</span> <input id="fog-wind" type="range" min="0" max="35" value="14"><output id="fog-windOut"></output></label>
        <label><span data-t="dir">Wind from</span> <input id="fog-dir" type="range" min="0" max="355" step="5" value="275"><output id="fog-dirOut"></output></label>
      </fieldset>
      <fieldset>
        <legend class="label" data-t="gSun">Sun &amp; heat</legend>
        <label><span data-t="hour">Time</span> <input id="fog-time" type="range" min="0" max="72" step="1" value="0"><output id="fog-timeOut"></output></label>
        <label><span data-t="heat">Inland heat</span> <input id="fog-heat" type="range" min="45" max="100" value="68"><output id="fog-heatOut"></output></label>
        <label><span data-t="sim">Sim speed</span> <input id="fog-sim" type="range" min="5" max="100" value="50"><output id="fog-simOut"></output></label>
      </fieldset>
    </div>

    <div class="foot">
      <button class="langbtn" id="langBtn" type="button">EN</button>
      <details class="notes">
        <summary data-t="info">Info</summary>
        <div class="notes-body">
          <span data-t="n1"></span>
          <span data-t="n2"></span>
          <span data-t="n3"></span>
          <span data-t="n4"></span>
          <span data-t="n5"></span>
        </div>
      </details>
    </div>
  </div>
</main>

{% include footer.html %}

<script>
(() => {
  // ---------- words, in the four languages of /tides/ and /waves/ (same language setting, shared across the pages) ----------
  const T = {
    en: { gFog:'Fog', bank:'Fog bank', top:'Marine layer top', gWind:'Wind', speed:'Wind speed', dir:'Wind from', gSun:'Sun & heat', hour:'Time', now:'Now', heat:'Inland heat', sim:'Sim speed', info:'Info',
      calm:'calm', offshore:'Offshore wind: fog pulls back', towers:'Bridge towers above the fog', covered:'Fog through the Golden Gate', clear:'Gate clear',
      aria:'Pixel-art map of the Golden Gate from above, with fog rolling in from the Pacific. Tap to pause or play.', tap:'Tap to pause or play',
      n1:'<b>What you see:</b> the Golden Gate from straight above, about 125 m per pixel, north up. Marin Headlands and Sausalito at top left, San Francisco along the bottom, Angel Island, Alcatraz and Treasure Island in the Bay. Fog pours in from the Pacific on the left.',
      n2:'<b>How the fog moves:</b> the PSX Doom fire rule turned on its side. Each step, every fog pixel moves one pixel downwind, wanders a little, and sometimes thins by one shade. It thins fastest over sunny, hot land and barely at all over the cold Bay. It moves fastest at sea level, so it races through the Gate, and slows as it climbs the hills. Hills taller than the marine layer stop it, so a low layer squeezes through the Gate and a high one spills over the hills. The Golden Gate Bridge towers (227 m) show through when the layer is lower than they are.',
      n3:'<b>Starts with current conditions.</b> The map opens on now: the wind just outside the Gate, the temperature inland (the Mission), the fog and the height of the marine layer, from this hour\'s National Weather Service forecast, with the sun where it is right now. <b>Time:</b> slide ahead hour by hour through the forecast (up to about a week) for a time lapse; the sliders move to each hour. You can still move any slider yourself; moving Time again puts them back on the forecast. The fog bank is an estimate: the forecast gives no fog thickness, so it\'s read from the forecast\'s fog flag, humidity and visibility. The marine layer top is the forecast\'s mixing height, which sits near the top of the marine layer when there\'s an inversion.',
      n4:'<b>Map:</b> shorelines from OpenStreetMap land polygons (via geo-maps, 100 m), with Alcatraz added by hand. The terrain is approximate, not a survey: ridgelines at their real places and heights (the Headlands ridges, Twin Peaks, Mount Sutro, Mount Livermore and others), roughened with noise for gullies and spurs, and lit from the northwest. Ground cover (grass, scrub, forest, city, sand) is drawn by hand from where it is.',
      n5:'Sources: <a href="https://www.weather.gov/documentation/services-web-api">National Weather Service API</a> · <a href="https://github.com/simonepri/geo-maps">geo-maps</a> (© OpenStreetMap contributors). A hat tip to the fire animation in the PlayStation port of Doom.' },
    fr: { gFog:'Brouillard', bank:'Banc de brume', top:'Couche marine', gWind:'Vent', speed:'Vent', dir:'Vent de', gSun:'Soleil et chaleur', hour:'Heure', now:'Maintenant', heat:'Chaleur intérieure', sim:'Vitesse', info:'Info',
      calm:'calme', offshore:'Vent de terre : la brume recule', towers:'Tours du pont au-dessus de la brume', covered:'Brume à travers le Golden Gate', clear:'Golden Gate dégagé',
      aria:'Carte en pixel art du Golden Gate vu d’en haut, avec la brume qui arrive du Pacifique. Touchez pour mettre en pause ou relancer.', tap:'Touchez pour mettre en pause ou relancer',
      n1:'<b>Ce que vous voyez :</b> le Golden Gate vu d’en haut, environ 125 m par pixel, nord en haut. Les Marin Headlands et Sausalito en haut à gauche, San Francisco en bas, Angel Island, Alcatraz et Treasure Island dans la baie. La brume arrive du Pacifique, à gauche.',
      n2:'<b>Comment la brume avance :</b> la règle du feu de Doom (PSX) couchée sur le côté. À chaque pas, chaque pixel de brume avance d’un pixel sous le vent, dévie un peu, et parfois s’éclaircit d’une teinte. Elle s’éclaircit vite sur les terres chaudes et ensoleillées, à peine sur la baie froide. Elle va plus vite au niveau de la mer, donc file par le Golden Gate, et ralentit en montant sur les collines. Les collines plus hautes que la couche marine l’arrêtent : une couche basse se faufile par le Golden Gate, une couche haute déborde sur les collines. Les tours du pont (227 m) dépassent quand la couche est plus basse qu’elles.',
      n3:'<b>Commence par les conditions actuelles.</b> La carte s’ouvre sur maintenant : le vent juste au large du Golden Gate, la température à l’intérieur (Mission), la brume et la hauteur de la couche marine, d’après la prévision du National Weather Service pour cette heure, avec le soleil là où il est. <b>Heure :</b> avancez heure par heure dans la prévision (jusqu’à environ une semaine) pour un accéléré ; les curseurs suivent chaque heure. Vous pouvez toujours bouger un curseur vous-même ; bouger l’heure les remet sur la prévision. Le banc de brume est une estimation : la prévision ne donne pas l’épaisseur de la brume, elle est déduite de l’indicateur de brouillard, de l’humidité et de la visibilité. Le sommet de la couche marine est la hauteur de mélange de la prévision, proche du sommet de la couche marine quand il y a une inversion.',
      n4:'<b>Carte :</b> côtes d’après les polygones de terre d’OpenStreetMap (via geo-maps, 100 m), avec Alcatraz ajouté à la main. Le relief est approximatif, pas un relevé : les crêtes à leurs vraies places et hauteurs (les crêtes des Headlands, Twin Peaks, Mount Sutro, Mount Livermore et d’autres), rendues irrégulières par du bruit pour les ravines et les éperons, éclairées du nord-ouest. La couverture du sol (herbe, maquis, forêt, ville, sable) est dessinée à la main d’après la réalité.',
      n5:'Sources : <a href="https://www.weather.gov/documentation/services-web-api">API du National Weather Service</a> · <a href="https://github.com/simonepri/geo-maps">geo-maps</a> (© contributeurs d’OpenStreetMap). Un clin d’œil à l’animation du feu du portage PlayStation de Doom.' },
    es: { gFog:'Niebla', bank:'Banco de niebla', top:'Capa marina', gWind:'Viento', speed:'Viento', dir:'Viento del', gSun:'Sol y calor', hour:'Hora', now:'Ahora', heat:'Calor interior', sim:'Velocidad', info:'Info',
      calm:'calma', offshore:'Viento de tierra: la niebla retrocede', towers:'Torres del puente sobre la niebla', covered:'Niebla a través del Golden Gate', clear:'Golden Gate despejado',
      aria:'Mapa en pixel art del Golden Gate visto desde arriba, con la niebla entrando desde el Pacífico. Toca para pausar o reanudar.', tap:'Toca para pausar o reanudar',
      n1:'<b>Lo que ves:</b> el Golden Gate visto desde arriba, unos 125 m por píxel, con el norte arriba. Marin Headlands y Sausalito arriba a la izquierda, San Francisco abajo, y Angel Island, Alcatraz y Treasure Island en la bahía. La niebla entra desde el Pacífico, a la izquierda.',
      n2:'<b>Cómo se mueve la niebla:</b> la regla del fuego de Doom (PSX) puesta de lado. En cada paso, cada píxel de niebla avanza un píxel a favor del viento, se desvía un poco y a veces se aclara un tono. Se aclara rápido sobre la tierra caliente y soleada y casi nada sobre la bahía fría. Va más rápido al nivel del mar, así que cruza el Golden Gate a toda prisa, y se frena al subir las colinas. Las colinas más altas que la capa marina la frenan: una capa baja se cuela por el Golden Gate y una alta desborda las colinas. Las torres del puente (227 m) asoman cuando la capa es más baja que ellas.',
      n3:'<b>Empieza con las condiciones actuales.</b> El mapa abre en el ahora: el viento justo fuera del Golden Gate, la temperatura del interior (la Mission), la niebla y la altura de la capa marina, según el pronóstico del National Weather Service para esta hora, con el sol donde está ahora. <b>Hora:</b> avanza hora a hora por el pronóstico (hasta una semana, más o menos) para un time-lapse; los controles siguen cada hora. Aún puedes mover cualquier control; al mover la hora vuelven al pronóstico. El banco de niebla es una estimación: el pronóstico no da el espesor de la niebla, así que se deduce del aviso de niebla, la humedad y la visibilidad. El tope de la capa marina es la altura de mezcla del pronóstico, que queda cerca del tope de la capa marina cuando hay inversión.',
      n4:'<b>Mapa:</b> costas de los polígonos de tierra de OpenStreetMap (vía geo-maps, 100 m), con Alcatraz añadido a mano. El relieve es aproximado, no un levantamiento: las crestas en sus lugares y alturas reales (las de los Headlands, Twin Peaks, Mount Sutro, Mount Livermore y otras), con ruido para barrancos y lomas, iluminadas desde el noroeste. La cobertura del suelo (pasto, matorral, bosque, ciudad, arena) está dibujada a mano según la realidad.',
      n5:'Fuentes: <a href="https://www.weather.gov/documentation/services-web-api">API del National Weather Service</a> · <a href="https://github.com/simonepri/geo-maps">geo-maps</a> (© colaboradores de OpenStreetMap). Un guiño a la animación del fuego de la versión de Doom para PlayStation.' },
    zh: { gFog:'雾', bank:'雾堤', top:'海洋层顶', gWind:'风', speed:'风速', dir:'风向', gSun:'太阳与热度', hour:'时间', now:'现在', heat:'内陆气温', sim:'模拟速度', info:'说明',

      aria:'从上方俯瞰金门的像素地图，雾从太平洋涌入。轻触暂停或播放。', tap:'轻触暂停或播放',
      n1:'<b>你看到的：</b>从正上方俯瞰的金门，每像素约 125 米，上方为北。左上是马林岬角和索萨利托，下方是旧金山，海湾中有天使岛、恶魔岛和金银岛。雾从左边的太平洋涌入。',
      n2:'<b>雾如何移动：</b>把 PSX 版《毁灭战士》的火焰规则横过来。每一步，每个雾像素顺风前进一格，略微偏移，有时淡一级。在晴朗炎热的陆地上消散最快，在寒冷的海湾上几乎不散。它在海平面上移动最快，因此会迅速穿过金门，爬坡时则会减慢。高于海洋层的山丘会挡住雾：海洋层低时，雾从金门挤进来；海洋层高时，雾漫过山丘。金门大桥的桥塔（227 米）在海洋层低于它们时露出雾面。',
      n3:'<b>从当前状况开始。</b>地图一打开就是现在：金门外侧的风、内陆（教会区）的气温、雾和海洋层高度，取自美国国家气象局本小时的预报，太阳也在此刻的位置。<b>时间：</b>向后滑动，按小时浏览预报（最多约一周），形成延时效果；各滑块随每个小时变化。你仍可自行调节任何滑块；再次移动时间会让它们回到预报值。雾堤是估计值：预报不提供雾的厚度，因此根据预报中的雾标记、湿度和能见度推算。海洋层顶取预报中的混合层高度，在有逆温时接近海洋层顶部。',

      // Sun and inland heat burn it off over land: shades lost per step, from 0.12 (night) to ~2.2 (hot afternoon sun)
      let p = .12 + sunK * (.3 + 1.8 * heatK);
      if (e > top * .7) p += (e / top - .7) * 1.5;                                 // thinner near the top of the layer
      P[i] = clamp(p, .02, 4); BLOCK[i] = over > 0 ? Math.min(N, 3 + Math.floor(over / 20)) : 0;
      SPD[i] = clamp(1 - .9 * e / top, .15, .9);   // climbing slows it; even low land drags a little
    }
  }
  function windVec() {   // travel direction: east component (pixels per step along x is always 1 when > 0), north/south drift per step
    const to = (val('dir') + 180) * R, ue = Math.sin(to), vn = Math.cos(to);
    return { ue, dy: ue > .1 ? clamp(-vn / ue, -1.5, 1.5) : 0 };
  }
  function step() {
    const { ue, dy } = windVec(), bank = val('bank') / 100;
    if (ue > .1 && val('wind') > 0) {
      streakOff += .12;   // the bank's lobes slide slowly along the edge
      for (let y = 0; y < H; y++) {
        // The whole west edge feeds fog, over the Marin coast too (its hills thin or stop it, as anywhere else).
        // A thick bank is solid; a thin one breaks into slow lobes with clear gaps between them.
        const s = streak[Math.floor(y + streakOff) % H], lobe = 1 - (1 - bank) * 1.6 * s;
        f[y * W] = Math.max(0, Math.round(N * clamp(bank * 1.15, 0, 1) * clamp(lobe, 0, 1) - Math.random()));
      }
      billowX += 1; billowY += dy;   // the billow pattern rides along with the fog
      for (let x = W - 2; x >= 0; x--) for (let y = 0; y < H; y++) {
        const v = f[y * W + x];
        let ny = y + ((Math.random() * 3) | 0) - 1 + Math.floor(dy + Math.random());
        ny = ny < 0 ? 0 : ny >= H ? H - 1 : ny;
        const dst = ny * W + x + 1;
        if (land[dst] && Math.random() > SPD[dst]) continue;   // on a slope the fog holds back this step
        if (v === 0) { f[dst] = 0; continue; }
        const pd = P[dst], dec = (pd | 0) + (Math.random() < pd % 1 ? 1 : 0) + BLOCK[dst];
        f[dst] = v > dec ? v - dec : 0;
      }
      // the fast lane: over water, fog takes an extra hop downwind (only ever adds fog, so fronts lead over the water)
      for (let x = W - 2; x >= 0; x--) for (let y = 0; y < H; y++) {
        const i = y * W + x; if (land[i] || Math.random() > WATER_BOOST) continue;
        const v = f[i]; if (!v) continue;
        let ny = y + ((Math.random() * 3) | 0) - 1 + Math.floor(dy + Math.random()); ny = ny < 0 ? 0 : ny >= H ? H - 1 : ny;
        const j = ny * W + x + 1; if (land[j]) continue;
        const dec = 1 + (Math.random() < P[j] ? 1 : 0);   // a hop costs a shade, so the leading edge stays ragged
        if (v - dec > f[j]) f[j] = v - dec;
      }
    } else {   // calm or offshore: no new fog comes in, and what's here thins out where it sits
      const k = val('wind') > 0 && ue <= .1 ? .25 : .04;
      for (let i = 0; i < W * H; i++) if (f[i] && Math.random() < k + Math.min(1, P[i]) * .3) f[i]--;
    }
  }

  // ---------- drawing ----------
  const cv = document.getElementById('fog-map'), ctx = cv.getContext('2d'), img = ctx.createImageData(W, H), d = img.data;
  const FOG_DAY = [238, 243, 245], FOG_NIGHT = [96, 108, 124];
  // Fog is drawn soft: the density is blurred (two 3x3 passes) so the Doom fire rule's pixel-by-pixel grain becomes
  // smooth sheets, and a slowly drifting two-scale noise breaks the thin edges into billows and holes.
  const NG = 32, ng = Float32Array.from({ length: NG * NG }, () => Math.random());
  const sm = t => t * t * (3 - 2 * t);
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), fx = sm(x - xi), fy = sm(y - yi), g = (a, b) => ng[(((b % NG) + NG) % NG) * NG + (((a % NG) + NG) % NG)];
    const a = g(xi, yi) + (g(xi + 1, yi) - g(xi, yi)) * fx, b = g(xi, yi + 1) + (g(xi + 1, yi + 1) - g(xi, yi + 1)) * fx;
    return a + (b - a) * fy;
  }
  const fa = new Float32Array(W * H), fb = new Float32Array(W * H), fogA = new Float32Array(W * H);
  function blur(src, dst) {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let s = 0, n = 0;
      for (let j = -1; j <= 1; j++) { const yy = y + j; if (yy < 0 || yy >= H) continue;
        for (let k = -1; k <= 1; k++) { const xx = x + k; if (xx < 0 || xx >= W) continue; s += src[yy * W + xx]; n++; } }
      dst[y * W + x] = s / n;
    }
  }
  function draw(fr) {
    const fogC = FOG_NIGHT.map((v, k) => v + (FOG_DAY[k] - v) * dayK);
    for (let i = 0; i < W * H; i++) fa[i] = (prev[i] + (f[i] - prev[i]) * fr) / N;
    blur(fa, fb); blur(fb, fa);
    for (let i = 0; i < W * H; i++) {
      const c = [baseC[i * 3], baseC[i * 3 + 1], baseC[i * 3 + 2]];
      const x = i % W, y = (i / W) | 0;
      const n = .65 * vnoise((x - billowX) / 11, (y - billowY) / 11) + .35 * vnoise((x - billowX) / 4.5 + 17, (y - billowY) / 4.5 + 5);
      const v = fa[i] + .28 * (n - .5), e = clamp((v - .1) / .5, 0, 1);
      const a = e < .12 ? 0 : e < .4 ? .42 : e < .72 ? .74 : .93, o = i * 4; fogA[i] = a;   // blocky cloud steps, hard edges
      d[o] = (c[0] * light) * (1 - a) + fogC[0] * a; d[o + 1] = (c[1] * light) * (1 - a) + fogC[1] * a; d[o + 2] = (c[2] * light) * (1 - a) + fogC[2] * a; d[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    drawBridges();
  }

  // ---------- bridges, as a pixel sprite at 2x (62.5 m per pixel) ----------
  // Exaggerated to read at this scale: decks 3 px wide (orange cables at the edges, grey road between), towers 5 x 3 px.
  // Fog hides them pixel by pixel; the Golden Gate towers (227 m) stand clear of a marine layer lower than they are.
  // By day the towers and deck cast shadows on the water, away from the sun; at night, deck lights and red tower beacons.
  const S = 2, bcv = document.getElementById('fog-bridges'), b2 = bcv.getContext('2d');
  const SX = lon => X(lon) * S, SY = lat => Y(lat) * S;
  const GG_O = [192, 54, 44], GG_O2 = [150, 38, 32], ROAD = [128, 130, 134], BB_G = [176, 182, 188], BB_G2 = [128, 134, 142];
  function seg(a, b) {   // pixel centers along a, b (lon/lat), with the unit across-vector
    const x0 = SX(a[0]), y0 = SY(a[1]), x1 = SX(b[0]), y1 = SY(b[1]), L = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(L);
    const out = []; for (let k = 0; k <= n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);
    return { pts: out, ax: -(y1 - y0) / L, ay: (x1 - x0) / L };
  }
  const GG_SEG = seg(GG.s, GG.n), GG_RD = GG_ROADS.map(r => r.slice(1).map((p, k) => seg(r[k], p)));
  const BB_SEGS = [seg(BB_W[0], BB_W[1]), seg(BB_E[0], BB_E[1])];
  function drawBridges() {
    b2.clearRect(0, 0, bcv.width, bcv.height);
    const lk = .4 + .6 * light, night = dayK < .35, rgba = (c, a, k = lk) => `rgba(${c[0] * k | 0},${c[1] * k | 0},${c[2] * k | 0},${a})`;
    const vis = (x, y) => 1 - fogA[clamp(y / S | 0, 0, H - 1) * W + clamp(x / S | 0, 0, W - 1)];
    const px = (x, y, c, a) => { if (a <= .02) return; b2.fillStyle = c; b2.globalAlpha = a; b2.fillRect(Math.round(x), Math.round(y), 1, 1); };
    // shadows (day): tower shadow length = 227 m / tan(sun height), in 62.5 m pixels; the deck's from its ~67 m clearance
    if (sunEl > 3 && !night) {
      const t = 1 / Math.tan(sunEl * R), dx = -Math.sin(sunAz * R), dy = Math.cos(sunAz * R);   // away from the sun, screen y down
      const towerL = Math.min(16, 227 * t / 62.5), deckL = Math.min(3, 67 * t / 62.5);
      for (const [x, y] of GG_SEG.pts) px(x + dx * deckL, y + dy * deckL, 'rgb(2,10,18)', .5 * vis(x, y));
      for (const T of [GG.sT, GG.nT]) { const x0 = SX(T[0]), y0 = SY(T[1]);
        for (let k = 1; k <= towerL; k++) for (const w of [-1, 0, 1]) px(x0 + dx * k + GG_SEG.ax * w, y0 + dy * k + GG_SEG.ay * w, 'rgb(2,10,18)', .6 * vis(x0 + dx * k, y0 + dy * k)); }
    }
    // roads on land up to each end
    for (const r of GG_RD) for (const sg of r) for (const [x, y] of sg.pts) px(x, y, rgba(ROAD, 1, lk * .8), .7 * vis(x, y));
    // Bay Bridge: grey deck, silver towers
    for (const sg of BB_SEGS) for (const [x, y] of sg.pts) for (const w of [-1, 0, 1]) px(x + sg.ax * w, y + sg.ay * w, rgba(w ? BB_G2 : BB_G, 1), .9 * vis(x, y));
    for (const T of BB_TOWERS) { const x0 = SX(T[0]), y0 = SY(T[1]), { ax, ay } = BB_SEGS[0];
      for (let i = -2; i <= 2; i++) for (let j = -1; j <= 0; j++) px(x0 + ax * i + ay * j, y0 + ay * i - ax * j, rgba(Math.abs(i) === 2 ? BB_G2 : BB_G, 1, lk * 1.15), vis(x0, y0)); }
    // Golden Gate Bridge deck: orange cable edges, grey road between
    for (const [x, y] of GG_SEG.pts) { const v = .95 * vis(x, y);
      px(x - GG_SEG.ax, y - GG_SEG.ay, rgba(GG_O, 1), v); px(x, y, rgba(ROAD, 1), v); px(x + GG_SEG.ax, y + GG_SEG.ay, rgba(GG_O, 1), v); }
    // towers: 5 across x 3 along, darker rim, lit top
    const towersOut = val('top') < 227;
    for (const T of [GG.sT, GG.nT]) {
      const x0 = SX(T[0]), y0 = SY(T[1]), v = towersOut ? 1 : vis(x0, y0);
      for (let i = -2; i <= 2; i++) for (let j = -1; j <= 1; j++) {
        const edge = Math.abs(i) === 2 || Math.abs(j) === 1;
        px(x0 + GG_SEG.ax * i + GG_SEG.ay * j, y0 + GG_SEG.ay * i - GG_SEG.ax * j, rgba(edge ? GG_O2 : GG_O, 1, lk * (edge ? 1 : 1.2)), v);
      }
      if (night) px(x0, y0, `rgb(255,${(performance.now() / 700 | 0) % 2 ? 40 : 90},40)`, v);   // aircraft beacon, blinking
    }
    // night: deck lights along the Golden Gate and the Bay Bridge
    if (night) {
      GG_SEG.pts.forEach(([x, y], k) => { if (k % 3 === 0) { px(x - GG_SEG.ax, y - GG_SEG.ay, 'rgb(255,196,110)', .9 * vis(x, y)); px(x + GG_SEG.ax, y + GG_SEG.ay, 'rgb(255,196,110)', .9 * vis(x, y)); } });
      for (const sg of BB_SEGS) sg.pts.forEach(([x, y], k) => { if (k % 4 === 0) px(x, y, 'rgb(235,240,255)', .85 * vis(x, y)); });
    }
    b2.globalAlpha = 1;
  }


  // ---------- readout, words, language ----------
  function readout() {
    const { ue } = windVec(), gate = GGB.reduce((s, [x, y]) => s + fogAt0(x, y), 0) / GGB.length;
    let state = val('wind') && ue <= .1 ? t('offshore') : gate > .35 ? (val('top') < 227 ? t('towers') : t('covered')) : t('clear');
    document.getElementById('fog-readout').innerHTML = `<b>${state}</b> · ${val('wind') ? val('wind') + ' kt ' + compass(val('dir')) : t('calm')} · ${val('top')} m · ${fmtTime(true)}`;
  }
  const fogAt0 = (x, y) => f[clamp(y, 0, H - 1) * W + clamp(x, 0, W - 1)] / N;
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(e => e.innerHTML = t(e.dataset.t));   // trusted text from the table above
    cv.setAttribute('aria-label', t('aria')); cv.title = t('tap');
    const next = ORDER[(ORDER.indexOf(lang) + 1) % ORDER.length], b = document.getElementById('langBtn');
    b.textContent = lang.toUpperCase(); b.title = NAMES[next]; b.setAttribute('aria-label', `${NAMES[lang]} → ${NAMES[next]}`);
    outputs(); readout();
  }
  document.getElementById('langBtn').addEventListener('click', () => {
    lang = ORDER[(ORDER.indexOf(lang) + 1) % ORDER.length];
    try { localStorage.setItem('sf-tides-lang', lang); } catch (e) {}
    applyLang();
  });
  Object.values(ui).forEach(i => i.addEventListener('input', () => {
    if (i === ui.time) { touched.clear(); forecastAt(timeMs()); }   // a new hour: every slider back on the forecast
    else touched.add(i.id);
    outputs(); physics(); readout(); }));
  const touched = new Set();

  // ---------- loop ----------
  // Speed: real wind carries fog ~160x faster than life, so a 15 kt westerly crosses the 24 km view in about 20 s at 1x.
  let running = true, acc = 0, last = performance.now(), lastRead = 0, lastClock = performance.now();
  function loop(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (running) {
      const { ue } = windVec(), kt = val('wind');
      const rate = (ue > .1 && kt > 0 ? kt * .5144 * ue * 160 / CELL_M : 4) * (val('sim') / 100) * 2;   // steps per second
      acc += dt * rate; let n = 0;
      while (acc >= 1 && n < 6) { prev.set(f); step(); acc -= 1; n++; }
      if (n === 6) acc = 0;
      draw(acc);
      if (now - lastRead > 500) { readout(); lastRead = now; }
      if (!val('time') && now - lastClock > 60000) {   // at Now: the sun follows the clock, the forecast each new hour
        lastClock = now; const h0 = Math.floor(Date.now() / 36e5) * 36e5;
        if (h0 !== hour0) { hour0 = h0; forecastAt(Date.now()); outputs(); }
        physics();
      }
    }
    requestAnimationFrame(loop);
  }
  const setRun = v => { running = v; cv.setAttribute('aria-pressed', !v); last = performance.now(); };
  cv.onclick = () => setRun(!running);
  cv.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setRun(!running); } };

  // ---------- conditions from the National Weather Service: now, and hour by hour ahead ----------
  // The gridded forecast for the water just outside the Gate (wind, humidity, fog flag, visibility, mixing height) and for
  // the Mission (temperature inland). Loaded once; the Time slider reads any hour from them. Sliders the visitor has moved
  // since the last Time change are left alone. If the NWS can't be reached, the sliders keep their values and only the sun moves.
  let GATE = null, CITY = null;
  const at = (layer, ms) => { for (const v of (layer && layer.values) || []) { const [s0, du] = String(v.validTime).split('/');
    const m = /P(?:(\d+)D)?(?:T(?:(\d+)H)?)?/.exec(du || '') || [], a = +new Date(s0), b = a + ((+m[1] || 0) * 24 + (+m[2] || 0)) * 36e5;
    if (ms >= a && ms < b) return v.value; } return null; };
  const lastHour = layer => { let e = 0; for (const v of (layer && layer.values) || []) { const [s0, du] = String(v.validTime).split('/');
    const m = /P(?:(\d+)D)?(?:T(?:(\d+)H)?)?/.exec(du || '') || []; e = Math.max(e, +new Date(s0) + ((+m[1] || 0) * 24 + (+m[2] || 0)) * 36e5); } return e; };
  function forecastAt(ms) {
    const set = (k, v) => { if (v == null || !isFinite(v) || touched.has(ui[k].id)) return; ui[k].value = clamp(v, +ui[k].min, +ui[k].max); };
    if (GATE) {
      const spd = at(GATE.windSpeed, ms), dir = at(GATE.windDirection, ms), rh = at(GATE.relativeHumidity, ms), wx = at(GATE.weather, ms),
            vis = at(GATE.visibility, ms), mix = at(GATE.mixingHeight, ms);
      if (spd != null) set('wind', Math.round(spd / 1.852));                                   // km/h → kt
      if (dir != null) set('dir', (Math.round(dir / 5) * 5) % 360);
      const fogFlag = Array.isArray(wx) && wx.some(w => w && /fog/.test(w.weather || ''));
      const visK = vis == null ? 0 : vis < 1000 ? 30 : vis < 3000 ? 15 : 0;                    // m
      if (rh != null) set('bank', Math.round(clamp(clamp((rh - 70) / 30, 0, 1) * 60 + (fogFlag ? 30 : 0) + visK, 0, 100)));
      if (mix != null) set('top', Math.round(mix / 10) * 10);                                 // m
    }
    if (CITY) { const c = at(CITY.temperature, ms); if (c != null) set('heat', Math.round(c * 9 / 5 + 32)); }
  }
  async function live() {
    const h = { headers: { Accept: 'application/geo+json' } };
    const get = async u => { const r = await fetch(u, h); if (!r.ok) throw new Error(r.status); return r.json(); };
    const grid = async (lat, lon) => (await get((await get(`https://api.weather.gov/points/${lat},${lon}`)).properties.forecastGridData)).properties;
    try { GATE = await grid(37.82, -122.52); } catch (e) {}   // just outside the Gate
    try { CITY = await grid(37.76, -122.415); } catch (e) {}  // the Mission
    if (GATE) {   // the Time slider reaches as far as the forecast does (whole hours, up to a week)
      const end = lastHour(GATE.windSpeed);
      if (end > hour0) ui.time.max = Math.max(1, Math.min(168, Math.floor((end - hour0) / 36e5) - 1));
    }
    forecastAt(timeMs());
    outputs(); physics(); readout();
  }

  // ---------- start ----------
  physics();
  for (let i = 0; i < W * 1.3; i++) step();   // warm up: fog already in
  prev.set(f);
  applyLang(); draw(0);
  live();
  requestAnimationFrame(loop);
  window.__fog = { land, elev, f: () => f, step, physics, draw, W, H, X, Y, GG, setRun };
})();
</script>
</body>
