<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOG · Fogday Studios</title>
<meta name="description" content="FOG: San Francisco's fog rolling in through the Golden Gate, seen from above, as pixel art driven by the wind, the marine layer, the sun and the heat inland. By Fogday Studios.">

{% include head.html %}
<style>
  /* FOG: the Golden Gate from above, 125 m per pixel. Same page format as /waves/: the picture sticks at the top,
     sliders in titled groups below, Info and the language code on the last line. Site colors and fonts from fogday.css. */
  :root:lang(zh) {
    --font-ui: "Fira Sans", "Heiti SC", STHeiti, SimHei, "Kaiti SC", STKaiti, KaiTi, sans-serif;
  }
  .fog { display: flex; flex-direction: column; gap: 24px; padding-block: 12px 36px; }
  .fog .label { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .fog .title { margin: 0; font: 400 1.6rem/1.1 var(--font-logo, "Patua One", serif); }
  .fog .sub { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
  .fog canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  /* The picture never scrolls away: it sticks right under the fixed 8px color bar, as on /waves/ */
  .fog .stick { position: sticky; top: 8px; z-index: 21; border-radius: 12px; overflow: hidden; background: #0c2a40; }
  .fog #fog-map { width: 100%; aspect-ratio: 196/140; cursor: pointer; touch-action: manipulation; }
  @media (max-width: 520px) { .fog .stick { width: calc(100% + 40px); margin-inline: -20px; border-radius: 0; } }
  .fog .readout { color: var(--muted); font-size: .85rem; margin-top: -14px; font-variant-numeric: tabular-nums; }
  .fog .readout b { color: var(--ink); font-weight: 600; }
  .fog .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .fog fieldset { background: var(--surface); border: 0; border-radius: 12px; padding: 12px 16px 14px; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .fog legend { float: left; width: 100%; padding: 0; margin-bottom: 4px; }
  .fog fieldset label { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 6.5em; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }
  .fog fieldset label output { color: var(--ink); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .fog input[type=range] { width: 100%; accent-color: var(--accent); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fog fieldset { background: transparent; padding-inline: 0; } }
  :root[data-theme="dark"] .fog fieldset { background: transparent; padding-inline: 0; }
  @media (max-width: 640px) { .fog fieldset label { grid-template-columns: 7.5em minmax(0, 1fr) 5.5em; } }
  .fog .langbtn { float: left; background: none; border: 0; padding: 6px 16px 6px 0; margin: 0; cursor: pointer; font-size: .75rem; font-weight: 600;
    letter-spacing: .14em; color: var(--accent); -webkit-tap-highlight-color: transparent; }
  .fog .notes { color: var(--muted); font-size: .85rem; line-height: 1.5; max-width: 65ch; }
  .fog .notes summary { list-style: none; cursor: pointer; display: inline-block; font-size: .75rem; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 6px 0; }
  .fog .notes summary::-webkit-details-marker { display: none; }
  .fog .notes summary::after { content: " +"; }
  .fog .notes[open] summary::after { content: " –"; }
  .fog .notes-body { clear: both; display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
  .fog .notes a { color: var(--accent); }
  /* Bottom nav as clear as it can be, as on /waves/ */
  footer { background: transparent !important; border-top: 0 !important; }
  footer .wrap { text-shadow: 0 0 6px var(--bg), 0 0 2px var(--bg); }
</style>
</head>

{% include header.html current="maps" title=page.title %}

<main>
  <div class="wrap fog">
    <div class="stick">
      <canvas id="fog-map" width="196" height="140" tabindex="0" role="button" aria-pressed="false"></canvas>

        <legend class="label" data-t="gSun">Sun &amp; heat</legend>

        <label><span data-t="sim">Sim speed</span> <input id="fog-sim" type="range" min="5" max="100" value="50"><output id="fog-simOut"></output></label>

    <div class="foot">
      <button class="langbtn" id="langBtn" type="button">EN</button>

          <span data-t="n1"></span>
          <span data-t="n2"></span>
          <span data-t="n3"></span>
          <span data-t="n4"></span>
          <span data-t="n5"></span>
        </div>
      </details>
    </div>
  </div>
</main>

      n1:'<b>Lo que ves:</b> el Golden Gate visto desde arriba, unos 125 m por píxel, con el norte arriba. Marin Headlands y Sausalito arriba a la izquierda, San Francisco abajo, y Angel Island, Alcatraz y Treasure Island en la bahía. La niebla entra desde el Pacífico, a la izquierda.',

  const land = new Uint8Array(W * H);

  // Hills: smooth bumps at real summits (approximate heights in m, radius in km), over a 15 m base on land
  const HILLS = [

  const shade = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (!land[i]) continue;
    const ex = elev[y * W + Math.min(W - 1, x + 1)] - elev[y * W + Math.max(0, x - 1)], ey = elev[Math.min(H - 1, y + 1) * W + x] - elev[Math.max(0, y - 1) * W + x];
    shade[i] = Math.max(.65, Math.min(1.3, 1 - (ex + ey) * .004));
  }
  // Bridges (lon, lat endpoints): Golden Gate (Fort Point to Lime Point) and the Bay Bridge (Rincon Point, Yerba Buena, toward Oakland)
  const line = (a, b) => { const p = [], n = Math.ceil(Math.hypot(X(b[0]) - X(a[0]), Y(b[1]) - Y(a[1]))) * 2; for (let k = 0; k <= n; k++) p.push([Math.round(X(a[0]) + (X(b[0]) - X(a[0])) * k / n), Math.round(Y(a[1]) + (Y(b[1]) - Y(a[1])) * k / n)]); return p; };
  const GGB = line([-122.4770, 37.8107], [-122.4787, 37.8263]);
  const GG_TOWERS = [[-122.4772, 37.8122], [-122.4785, 37.8243]].map(([lo, la]) => [Math.round(X(lo)), Math.round(Y(la))]);
  const BAYB = line([-122.3880, 37.7880], [-122.3700, 37.8080]).concat(line([-122.3615, 37.8115], [-122.3220, 37.8230]));

  // ---------- sliders ----------
  const el = id => document.getElementById('fog-' + id);
  const ui = {}; ['bank', 'top', 'wind', 'dir', 'hour', 'heat', 'sim'].forEach(k => ui[k] = el(k));
  const val = k => +ui[k].value;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const COMPASS = { en: ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'],
                    fr: ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'],
                    es: ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'],
                    zh: ['北','北东北','东北','东东北','东','东东南','东南','南东南','南','南西南','西南','西西南','西','西西北','西北','北西北'] };
  const compass = d => COMPASS[lang][Math.round(d / 22.5) % 16];
  const fmtHour = h => { const hh = Math.floor(h), mm = String(Math.round((h % 1) * 60)).padStart(2, '0');
    return lang === 'en' ? `${((hh + 11) % 12) + 1}:${mm} ${hh < 12 ? 'am' : 'pm'}` : `${hh}:${mm}`; };
  function outputs() {
    el('bankOut').textContent = val('bank') + '%';
    el('topOut').textContent = val('top') + ' m';
    el('windOut').textContent = val('wind') ? val('wind') + ' kt' : t('calm');
    el('dirOut').textContent = `${compass(val('dir'))} ${val('dir')}°`;
    el('hourOut').textContent = fmtHour(val('hour'));
    el('heatOut').textContent = val('heat') + ' °F';
    el('simOut').textContent = (val('sim') / 100).toFixed(2) + '×';
  }

  // ---------- sun (approximate, San Francisco), for the time of day on today's date ----------
  const R = Math.PI / 180, LAT = 37.81, LONG = -122.48;
  function sunElev(ms) {
    const D = (ms - Date.UTC(2000, 0, 1, 12)) / 864e5, gA = (357.529 + .98560028 * D) * R, q = 280.459 + .98564736 * D;
    const L = (q + 1.915 * Math.sin(gA) + .020 * Math.sin(2 * gA)) * R, e = (23.439 - .00000036 * D) * R;
    const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)) / R, dec = Math.asin(Math.sin(e) * Math.sin(L));
    const ha = ((((18.697374558 + 24.06570982441908 * D) * 15 + LONG - ra) % 360) + 540) % 360 - 180;
    return Math.asin(Math.sin(LAT * R) * Math.sin(dec) + Math.cos(LAT * R) * Math.cos(dec) * Math.cos(ha * R)) / R;
  }
  const tz = { timeZone: 'America/Los_Angeles' };
  function laParts(ms) { const o = {}; new Intl.DateTimeFormat('en-CA', { ...tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(ms)).forEach(p => o[p.type] = p.value); return o; }
  function todayAt(h) {   // today in San Francisco at hour h, as epoch ms
    const o = laParts(Date.now()), hh = Math.floor(h), mm = Math.round((h % 1) * 60);
    let g = Date.UTC(+o.year, o.month - 1, +o.day, hh + 8, mm);
    for (let i = 0; i < 2; i++) { const p = laParts(g); g -= Date.UTC(+p.year, p.month - 1, +p.day, +p.hour, +p.minute) - Date.UTC(+o.year, o.month - 1, +o.day, hh, mm); }
    return g;
  }

  // ---------- fog: the Doom fire rule on its side ----------
  // f = fog density 0..36 per pixel. The west edge is the source (the fog bank, with drifting streaks). Each step every pixel
  // moves one pixel downwind (east), wanders a pixel up or down, drifts north or south with the wind, and thins by one
  // with a chance P that depends on the pixel it lands on. Hills above the marine layer thin it by several at once.
  const N = 36;
  let f = new Uint8Array(W * H), prev = new Uint8Array(W * H);
  const P = new Float32Array(W * H), BLOCK = new Uint8Array(W * H);
  const streak = new Float32Array(H);
  { const raw = Array.from({ length: H }, () => Math.random());
    for (let y = 0; y < H; y++) { let s = 0; for (let k = -5; k <= 5; k++) s += raw[(y + k + H) % H]; streak[y] = s / 11; }
    const lo = Math.min(...streak), hi = Math.max(...streak); for (let y = 0; y < H; y++) streak[y] = (streak[y] - lo) / (hi - lo); }
  let streakOff = 0, light = 1, sunK = 0, dayK = 1;
  function physics() {   // per-pixel thinning, from the sliders; recomputed when they change
    const el0 = sunElev(todayAt(val('hour')));
    sunK = clamp(Math.sin(Math.max(0, el0) * R) * 1.4, 0, 1);                 // how hard the sun works on the fog
    light = clamp(.22 + .78 * (el0 + 6) / 24, .22, 1);                           // how lit the scene is
    dayK = clamp((el0 + 8) / 14, 0, 1);                                          // fog: white by day, blue-grey at night
    const heatK = clamp((val('heat') - 55) / 40, 0, 1), top = val('top');
    for (let i = 0; i < W * H; i++) {
      if (!land[i]) { P[i] = .012 + .03 * sunK; BLOCK[i] = 0; continue; }       // the cold Bay keeps fog
      const e = elev[i], over = e - top;
      // Sun and inland heat burn it off over land: shades lost per step, from 0.12 (night) to ~2.2 (hot afternoon sun)
      let p = .12 + sunK * (.3 + 1.8 * heatK);
      if (e > top * .7) p += (e / top - .7) * 1.5;                                 // thinner near the top of the layer
      P[i] = clamp(p, .02, 4); BLOCK[i] = over > 0 ? Math.min(N, 3 + Math.floor(over / 20)) : 0;
    }
  }
  function windVec() {   // travel direction: east component (pixels per step along x is always 1 when > 0), north/south drift per step
    const to = (val('dir') + 180) * R, ue = Math.sin(to), vn = Math.cos(to);
    return { ue, dy: ue > .1 ? clamp(-vn / ue, -1.5, 1.5) : 0 };
  }
  function step() {
    const { ue, dy } = windVec(), bank = val('bank') / 100;
    if (ue > .1 && val('wind') > 0) {
      streakOff += .35;
      for (let y = 0; y < H; y++) {
        const s = streak[Math.floor(y + streakOff) % H];
        f[y * W] = land[y * W] ? 0 : Math.max(0, Math.round(N * bank - 7 * s * (1.2 - bank) - 2 * Math.random()));
      }
      for (let x = W - 2; x >= 0; x--) for (let y = 0; y < H; y++) {
        const v = f[y * W + x];
        let ny = y + ((Math.random() * 3) | 0) - 1 + Math.floor(dy + Math.random());
        ny = ny < 0 ? 0 : ny >= H ? H - 1 : ny;
        const dst = ny * W + x + 1;
        if (v === 0) { f[dst] = 0; continue; }
        const pd = P[dst], dec = (pd | 0) + (Math.random() < pd % 1 ? 1 : 0) + BLOCK[dst];
        f[dst] = v > dec ? v - dec : 0;
      }
    } else {   // calm or offshore: no new fog comes in, and what's here thins out where it sits
      const k = val('wind') > 0 && ue <= .1 ? .25 : .04;
      for (let i = 0; i < W * H; i++) if (f[i] && Math.random() < k + Math.min(1, P[i]) * .3) f[i]--;
    }
  }

  // ---------- drawing ----------
  const cv = document.getElementById('fog-map'), ctx = cv.getContext('2d'), img = ctx.createImageData(W, H), d = img.data;
  const WATER = [10, 48, 78], WATER2 = [14, 62, 96], LAND_LO = [52, 72, 54], LAND_HI = [86, 96, 66];
  const FOG_DAY = [238, 243, 245], FOG_NIGHT = [96, 108, 124], ORANGE = [192, 54, 44], DECK = [170, 176, 180];
  const wnoise = new Float32Array(W * H).map(() => Math.random());
  function draw(fr) {
    const fogC = FOG_NIGHT.map((v, k) => v + (FOG_DAY[k] - v) * dayK);
    for (let i = 0; i < W * H; i++) {
      let c;
      if (land[i]) { const t2 = clamp(elev[i] / 450, 0, 1), s = shade[i]; c = LAND_LO.map((v, k) => (v + (LAND_HI[k] - v) * t2) * s); }
      else c = WATER.map((v, k) => v + (WATER2[k] - v) * wnoise[i] * .5);
      const fv = prev[i] + (f[i] - prev[i]) * fr, a = Math.min(.97, Math.pow(fv / N, .55) * 1.02), o = i * 4;
      d[o] = (c[0] * light) * (1 - a) + fogC[0] * a; d[o + 1] = (c[1] * light) * (1 - a) + fogC[1] * a; d[o + 2] = (c[2] * light) * (1 - a) + fogC[2] * a; d[o + 3] = 255;
    }
    const put = (x, y, c, a) => { if (x < 0 || y < 0 || x >= W || y >= H) return; const o = (y * W + x) * 4; d[o] = d[o] * (1 - a) + c[0] * a; d[o + 1] = d[o + 1] * (1 - a) + c[1] * a; d[o + 2] = d[o + 2] * (1 - a) + c[2] * a; };
    const lk = .45 + .55 * light, fogAt = (x, y) => f[clamp(y, 0, H - 1) * W + clamp(x, 0, W - 1)] / N;
    for (const [x, y] of BAYB) put(x, y, DECK.map(v => v * lk), .85 * (1 - Math.min(1, fogAt(x, y) * 1.4)));
    for (const [x, y] of GGB) put(x, y, ORANGE.map(v => v * lk), .9 * (1 - Math.min(1, fogAt(x, y) * 1.4)));
    const towersOut = val('top') < 227;   // the towers stand 227 m above the water
    for (const [x, y] of GG_TOWERS) { const a = towersOut ? 1 : 1 - Math.min(1, fogAt(x, y) * 1.4); put(x, y, ORANGE.map(v => v * lk * 1.1), a); put(x + 1, y, [20, 20, 24], a * .5); }
    ctx.putImageData(img, 0, 0);
  }

  // ---------- readout, words, language ----------
  function readout() {
    const { ue } = windVec(), gate = GGB.reduce((s, [x, y]) => s + fogAt0(x, y), 0) / GGB.length;
    let state = val('wind') && ue <= .1 ? t('offshore') : gate > .35 ? (val('top') < 227 ? t('towers') : t('covered')) : t('clear');
    document.getElementById('fog-readout').innerHTML = `<b>${state}</b> · ${val('wind') ? val('wind') + ' kt ' + compass(val('dir')) : t('calm')} · ${val('top')} m · ${fmtHour(val('hour'))}`;
  }
  const fogAt0 = (x, y) => f[clamp(y, 0, H - 1) * W + clamp(x, 0, W - 1)] / N;
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(e => e.innerHTML = t(e.dataset.t));   // trusted text from the table above
    cv.setAttribute('aria-label', t('aria')); cv.title = t('tap');
    const next = ORDER[(ORDER.indexOf(lang) + 1) % ORDER.length], b = document.getElementById('langBtn');
    b.textContent = lang.toUpperCase(); b.title = NAMES[next]; b.setAttribute('aria-label', `${NAMES[lang]} → ${NAMES[next]}`);
    outputs(); readout();
  }
  document.getElementById('langBtn').addEventListener('click', () => {
    lang = ORDER[(ORDER.indexOf(lang) + 1) % ORDER.length];
    try { localStorage.setItem('sf-tides-lang', lang); } catch (e) {}
    applyLang();
  });
  Object.values(ui).forEach(i => i.addEventListener('input', () => { touched.add(i.id); outputs(); physics(); readout(); }));
  const touched = new Set();

  // ---------- loop ----------
  // Speed: real wind carries fog ~160x faster than life, so a 15 kt westerly crosses the 24 km view in about 20 s at 1x.
  let running = true, acc = 0, last = performance.now(), lastRead = 0;
  function loop(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (running) {
      const { ue } = windVec(), kt = val('wind');
      const rate = (ue > .1 && kt > 0 ? kt * .5144 * ue * 160 / CELL_M : 4) * (val('sim') / 100) * 2;   // steps per second
      acc += dt * rate; let n = 0;
      while (acc >= 1 && n < 6) { prev.set(f); step(); acc -= 1; n++; }
      if (n === 6) acc = 0;
      draw(acc);
      if (now - lastRead > 500) { readout(); lastRead = now; }
    }
    requestAnimationFrame(loop);
  }
  const setRun = v => { running = v; cv.setAttribute('aria-pressed', !v); last = performance.now(); };
  cv.onclick = () => setRun(!running);
  cv.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setRun(!running); } };

  // ---------- live start, from the National Weather Service: this hour's forecast for the Golden Gate ----------
  // Wind speed and direction, the temperature inland (Mission District grid cell), and a fog bank estimate from the
  // forecast's fog flag and humidity. Sliders already moved are left alone; if the NWS can't be reached, the defaults stay.
  async function live() {
    const h = { headers: { Accept: 'application/geo+json' } };
    const get = async u => { const r = await fetch(u, h); if (!r.ok) throw new Error(r.status); return r.json(); };
    const at = (layer, ms) => { for (const v of (layer && layer.values) || []) { const [s, du] = String(v.validTime).split('/');
      const m = /P(?:(\d+)D)?(?:T(?:(\d+)H)?)?/.exec(du || '') || [], s0 = +new Date(s), e0 = s0 + ((+m[1] || 0) * 24 + (+m[2] || 0)) * 36e5;
      if (ms >= s0 && ms < e0) return v.value; } return null; };
    const set = (k, v) => { if (v == null || !isFinite(v) || touched.has(ui[k].id)) return; ui[k].value = clamp(v, +ui[k].min, +ui[k].max); };
    const now = Date.now();
    try {
      const g = (await get((await get('https://api.weather.gov/points/37.82,-122.52')).properties.forecastGridData)).properties;   // just outside the Gate
      const spd = at(g.windSpeed, now), dir = at(g.windDirection, now), rh = at(g.relativeHumidity, now), wx = at(g.weather, now);
      if (spd != null) set('wind', Math.round(spd / 1.852));
      if (dir != null) set('dir', Math.round(clamp(dir < 90 ? dir + 360 : dir, 180, 360) / 5) * 5);
      const fogFlag = Array.isArray(wx) && wx.some(w => w && /fog/.test(w.weather || ''));
      if (rh != null) set('bank', Math.round(clamp((rh - 70) / 30, 0, 1) * 70 + (fogFlag ? 30 : 0)));
    } catch (e) {}
    try {
      const g = (await get((await get('https://api.weather.gov/points/37.76,-122.415')).properties.forecastGridData)).properties;   // the Mission
      const c = at(g.temperature, now); if (c != null) set('heat', Math.round(c * 9 / 5 + 32));
    } catch (e) {}
    outputs(); physics(); readout();
  }

  // ---------- start ----------
  { const o = laParts(Date.now()); ui.hour.value = (+o.hour + Math.round(+o.minute / 15) / 4).toFixed(2); }
  physics();
  for (let i = 0; i < W * 1.3; i++) step();   // warm up: fog already in
  prev.set(f);
  applyLang(); draw(0);
  live();
  requestAnimationFrame(loop);
  window.__fog = { land, elev, f: () => f, step, physics, draw, W, H, X, Y, GGB, GG_TOWERS, setRun };
})();
</script>
</body>
