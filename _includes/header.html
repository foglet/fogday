<header>
  <div class="wrap">
    {% if include.title %}<h1 class="map-heading"><a href="{{ '/maps/' | relative_url }}" title="All maps">{{ include.title }}</a></h1>{% comment %} map pages: the map's name replaces the wordmark and links back to /maps/ {% endcomment %}
    {% else %}<a class="logo" href="{{ '/' | relative_url }}" aria-label="Fogday Studios home">
      FOGDAY STUDIOS
    </a>{% endif %}
        <nav aria-label="Main">
      <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 1.5v2.5M12 20v2.5M1.5 12h2.5M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>
        </svg>
      </button>
      <a href="{{ '/works/' | relative_url }}"{% if include.current == "works" %} aria-current="page"{% endif %} class="bento" aria-label="Projects" title="Projects">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <g fill="currentColor">
            <rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9.5" y="2" width="5" height="5" rx="1"/><rect x="17" y="2" width="5" height="5" rx="1"/>
            <rect x="2" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><rect x="17" y="9.5" width="5" height="5" rx="1"/>
            <rect x="2" y="17" width="5" height="5" rx="1"/><rect x="9.5" y="17" width="5" height="5" rx="1"/><rect x="17" y="17" width="5" height="5" rx="1"/>
          </g>
        </svg>
      </a>
    </nav>
  </div>
</header>
