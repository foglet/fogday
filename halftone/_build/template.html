<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* iPhone/iPad: Safari zooms in on a field under 16 px when it takes focus; maximum-scale stops that (pinch zoom still works on iOS) */
if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1))
  document.querySelector("meta[name=viewport]").setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover");</script>
<meta name="theme-color" content="#fbf8f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Image Looks">
<link rel="apple-touch-icon" href="/px/icon-180.png">
<title>Image Looks</title>
<meta name="description" content="Turn a photo into a dot matrix or a halftone print, add text, save it as an image or a video.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Rubik:wght@400;500;600&display=swap">
<style>
:root{--paper:#fbf8f1;--ink:#1d2622;--muted:#55605a;--felt:#1f5c4a;--felt-d:#164536;--red:#b8352b;--line:#d9d2c3;--card:#fffdf8;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.35 "Rubik",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1180px;margin:0 auto;
  padding:calc(6px + var(--sat)) calc(2.5vw + var(--sar) - 4px) 2px calc(2.5vw + var(--sal))}
h1{margin:0;font:400 22px/1.1 "Young Serif",Georgia,serif;letter-spacing:.01em}
.bento{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:5px;color:var(--muted);border-radius:10px}
.bento svg{display:block;width:100%;height:100%}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:4px calc(2.5vw + var(--sar)) calc(24px + var(--sab)) calc(2.5vw + var(--sal));display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:900px){.top{padding-left:16px;padding-right:12px}.wrap{padding-left:16px;padding-right:16px;gap:16px;grid-template-columns:minmax(0,1fr) 380px;align-items:start}.stagecol{position:sticky;top:12px}}
.stage{display:flex;justify-content:center}
#cv{display:block;border-radius:12px;background:#eee8dc;box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 28px rgba(29,38,34,.12)}
#cv{touch-action:manipulation}
#cv.drag{touch-action:none;cursor:move}
#cv.picking{cursor:crosshair}
.hint{margin:6px 0 0;text-align:center;font-size:12px;color:var(--muted);min-height:16px}
.stagecol,.ctlcol{min-width:0}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.actions .btn{min-width:0;padding:0 6px}
@media (min-width:480px){.actions{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:340px){.actions .btn svg{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;height:32px;padding:0 10px;border-radius:8px;font-size:13px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--felt)}
.btn svg{width:16px;height:16px;flex:0 0 16px}
.btn.primary{background:var(--felt);border-color:var(--felt);color:#fff}
.btn.primary:hover{background:var(--felt-d)}
.btn[disabled]{opacity:.5;cursor:default}
.ctlcol{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--card);gap:2px;height:32px;margin:0;min-width:0}
.seg legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg label{flex:1 1 0;min-width:0;position:relative;display:flex}
@media (max-width:340px){.seg span{padding:4px 2px;font-size:14px;line-height:1.15}}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;min-height:26px;padding:0 6px;border-radius:6px;font-size:13px;text-align:center;font-weight:500;color:var(--muted)}
.seg input:checked+span{background:var(--felt);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--red);outline-offset:1px}
.seg.big span{min-height:26px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px}
.ph{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:32px;padding:0 12px;border:0;background:none;cursor:pointer;font:400 15px/1.2 "Young Serif",Georgia,serif;text-align:left;border-radius:10px}
.ph svg{width:16px;height:16px;transition:transform .2s;color:var(--muted)}
.ph[aria-expanded="false"] svg{transform:rotate(-90deg)}
.pb{padding:0 12px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.pb[hidden]{display:none}
.f{display:grid;gap:0}
.f>.lab{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.f>.lab output{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:26px;margin:0;accent-color:var(--felt);background:transparent}
select,textarea{width:100%;min-height:32px;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
textarea{resize:vertical;height:auto;padding:6px 8px;min-height:48px;line-height:1.3}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.color{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px}
.color input[type=color]{width:40px;height:32px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.color .sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.color .sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--felt)}
.icob{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;padding:0}
.icob svg{width:16px;height:16px}
.icob[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:#fff}
.chk{display:flex;align-items:center;gap:8px;min-height:32px;cursor:pointer;font-size:13px}
.chk input{width:18px;height:18px;accent-color:var(--felt)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 auto}
.status{min-height:18px;margin:0;font-size:13px;color:var(--felt)}
body[data-look="dot"] .only-half,body[data-look="half"] .only-dot{display:none!important}
body[data-ht="ink"] .ht-noink,body[data-ht="image"] .ht-ink,body[data-ht="cmyk"] .ht-ink{display:none!important}
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,26,24,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--card);border-radius:16px;padding:14px;max-width:640px;width:100%;display:grid;gap:12px}
.sheet h2{margin:0;font:400 20px/1.2 "Young Serif",Georgia,serif}
.sheet video{width:100%;border-radius:12px;background:#000;max-height:60vh;object-fit:contain}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:8px 0 0}
.foot a{color:var(--felt)}
@media (prefers-reduced-motion:reduce){.ph svg{transition:none}}
</style>
</head>
<body data-look="dot" data-ht="ink">
<header class="top">
  <h1>Image Looks</h1>
  <a href="/works/" class="bento" aria-label="Projects" title="Projects"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.75" y="2.75" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="2.75" width="4.5" height="4.5" rx="1"/><rect x="16.75" y="2.75" width="4.5" height="4.5" rx="1"/><rect x="2.75" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="16.75" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="2.75" y="16.75" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="16.75" width="4.5" height="4.5" rx="1"/><rect x="16.75" y="16.75" width="4.5" height="4.5" rx="1"/></g></svg></a>
</header>

<main class="wrap">
  <section class="stagecol" aria-label="Preview">
    <div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Preview of the image look"></canvas></div>
    <p class="hint" id="hint"></p>
    <div class="actions">
      <button type="button" class="btn" id="addImg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span>Add image</span></button>
      <button type="button" class="btn" id="takePhoto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Take photo</span></button>
      <button type="button" class="btn only-dot" id="play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg><span>Play reveal</span></button>
      <button type="button" class="btn primary" id="saveTop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Save image</span></button>
    </div>
    <input type="file" id="fileIn" accept="image/*" hidden>
    <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
  </section>

  <section class="ctlcol" aria-label="Settings">
    <fieldset class="seg big">
      <legend>Look</legend>
      <label><input type="radio" name="look" value="dot" data-k="look"><span>Dot matrix</span></label>
      <label><input type="radio" name="look" value="half" data-k="look"><span>Halftone</span></label>
    </fieldset>

    <!-- Dot matrix -->
    <div class="panel only-dot">
      <button type="button" class="ph" aria-expanded="true" aria-controls="pDot">Dot matrix<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="pb" id="pDot">
        <div class="f"><label class="lab" for="cols">Dots across <output data-for="cols"></output></label><input type="range" id="cols" min="12" max="160" step="1" data-k="cols"></div>
        <div class="f"><label class="lab" for="reveal">Reveal <output data-for="reveal"></output></label><input type="range" id="reveal" min="0" max="100" step="1" data-k="reveal"></div>
        <div class="f"><label class="lab" for="dmDot">Dot size <output data-for="dmDot"></output></label><input type="range" id="dmDot" min="20" max="100" step="1" data-k="dmDot"></div>
        <fieldset class="seg"><legend>Dot shape</legend>
          <label><input type="radio" name="dmShape" value="circle" data-k="dmShape"><span>Circle</span></label>
          <label><input type="radio" name="dmShape" value="square" data-k="dmShape"><span>Square</span></label>
        </fieldset>
        <div class="two">
          <div class="f"><label class="lab" for="dir">Direction</label>
            <select id="dir" data-k="dir"><option value="lr">Left to right</option><option value="rl">Right to left</option><option value="tb">Top to bottom</option><option value="diag">Diagonal</option><option value="center">From center</option><option value="random">Random</option></select></div>
          <div class="f"><label class="lab" for="palette">Start colors</label>
            <select id="palette" data-k="palette"><option value="confetti">Confetti</option><option value="pastel">Pastel</option><option value="neon">Neon</option><option value="mono">Mono</option></select></div>
        </div>
        <div class="f"><label class="lab" for="band">Fade band <output data-for="band"></output></label><input type="range" id="band" min="3" max="60" step="1" data-k="band"></div>
        <div class="f"><label class="lab" for="wash">Washout <output data-for="wash"></output></label><input type="range" id="wash" min="0" max="100" step="1" data-k="wash"></div>
        <div class="f"><label class="lab" for="scatter">Edge scatter <output data-for="scatter"></output></label><input type="range" id="scatter" min="0" max="60" step="1" data-k="scatter"></div>
        <div class="two">
          <div class="f"><label class="lab" for="dmSat">Saturation <output data-for="dmSat"></output></label><input type="range" id="dmSat" min="0" max="200" step="1" data-k="dmSat"></div>
          <div class="f"><label class="lab" for="dmCon">Contrast <output data-for="dmCon"></output></label><input type="range" id="dmCon" min="50" max="200" step="1" data-k="dmCon"></div>
        </div>
        <div class="f"><span class="lab" id="dmBgL">Background</span><div class="color" data-color="dmBg" data-label="dmBgL"></div></div>
        <div class="f"><label class="lab" for="revealTime">Reveal time <output data-for="revealTime"></output></label><input type="range" id="revealTime" min="1" max="8" step="0.5" data-k="revealTime"></div>
        <button type="button" class="btn" id="shuffle">Shuffle start colors</button>
      </div>
    </div>

    <!-- Halftone -->
    <div class="panel only-half">
      <button type="button" class="ph" aria-expanded="true" aria-controls="pHalf">Halftone<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="pb" id="pHalf">
        <fieldset class="seg"><legend>Ink</legend>
          <label><input type="radio" name="htMode" value="ink" data-k="htMode"><span>One ink</span></label>
          <label><input type="radio" name="htMode" value="image" data-k="htMode"><span>Image color</span></label>
          <label><input type="radio" name="htMode" value="cmyk" data-k="htMode"><span>CMYK</span></label>
        </fieldset>
        <div class="f ht-ink"><span class="lab" id="htInkL">Ink color</span><div class="color" data-color="htInk" data-label="htInkL"></div></div>
        <div class="f"><span class="lab" id="htPaperL">Paper color</span><div class="color" data-color="htPaper" data-label="htPaperL"></div></div>
        <div class="f"><label class="lab" for="htCells">Dots across <output data-for="htCells"></output></label><input type="range" id="htCells" min="16" max="180" step="1" data-k="htCells"></div>
        <div class="f"><label class="lab" for="htAngle">Screen angle <output data-for="htAngle"></output></label><input type="range" id="htAngle" min="0" max="90" step="1" data-k="htAngle"></div>
        <fieldset class="seg"><legend>Dot shape</legend>
          <label><input type="radio" name="htShape" value="dot" data-k="htShape"><span>Dot</span></label>
          <label><input type="radio" name="htShape" value="square" data-k="htShape"><span>Square</span></label>
          <label><input type="radio" name="htShape" value="line" data-k="htShape"><span>Line</span></label>
        </fieldset>
        <div class="f"><label class="lab" for="htGain">Dot gain <output data-for="htGain"></output></label><input type="range" id="htGain" min="40" max="160" step="1" data-k="htGain"></div>
        <div class="two">
          <div class="f"><label class="lab" for="htCon">Contrast <output data-for="htCon"></output></label><input type="range" id="htCon" min="50" max="250" step="1" data-k="htCon"></div>
          <div class="f"><label class="lab" for="htLight">Lightness <output data-for="htLight"></output></label><input type="range" id="htLight" min="-50" max="50" step="1" data-k="htLight"></div>
        </div>
        <label class="chk"><input type="checkbox" data-k="htInvert">Invert</label>
      </div>
    </div>

    <!-- Text -->
    <div class="panel">
      <button type="button" class="ph" aria-expanded="true" aria-controls="pText">Text<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="pb" id="pText">
        <div class="f"><label class="lab" for="text">Text</label><textarea id="text" rows="2" data-k="text" placeholder="Type something"></textarea></div>
        <div class="two">
          <div class="f"><label class="lab" for="font">Font</label>
            <select id="font" data-k="font">
              <optgroup label="Sans serif"><option>Inter</option><option>Rubik</option><option>Space Grotesk</option><option>DM Sans</option><option>Archivo Black</option><option>Bebas Neue</option></optgroup>
              <optgroup label="Serif"><option>Young Serif</option><option>Playfair Display</option></optgroup>
              <optgroup label="Mono"><option>Space Mono</option></optgroup>
            </select></div>
          <div class="f"><label class="lab" for="weight">Weight</label><select id="weight" data-k="weight"></select></div>
        </div>
        <div class="f"><span class="lab" id="textColorL">Text color</span><div class="color" data-color="textColor" data-label="textColorL"></div></div>
        <div class="f"><label class="lab" for="textOp">Opacity <output data-for="textOp"></output></label><input type="range" id="textOp" min="0" max="100" step="1" data-k="textOp"></div>
        <div class="f"><label class="lab" for="size">Size <output data-for="size"></output></label><input type="range" id="size" min="2" max="40" step="0.5" data-k="size"></div>
        <fieldset class="seg"><legend>Text style</legend>
          <label><input type="radio" name="textMode" value="solid" data-k="textMode"><span>Solid</span></label>
          <label><input type="radio" name="textMode" value="dots" data-k="textMode"><span>Made of dots</span></label>
        </fieldset>
        <fieldset class="seg"><legend>Align</legend>
          <label><input type="radio" name="align" value="left" data-k="align"><span>Left</span></label>
          <label><input type="radio" name="align" value="center" data-k="align"><span>Center</span></label>
          <label><input type="radio" name="align" value="right" data-k="align"><span>Right</span></label>
        </fieldset>
        <div class="two">
          <div class="f"><label class="lab" for="tx">Across <output data-for="tx"></output></label><input type="range" id="tx" min="0" max="100" step="0.5" data-k="tx"></div>
          <div class="f"><label class="lab" for="ty">Down <output data-for="ty"></output></label><input type="range" id="ty" min="0" max="100" step="0.5" data-k="ty"></div>
        </div>
        <div class="two">
          <div class="f"><label class="lab" for="track">Letter spacing <output data-for="track"></output></label><input type="range" id="track" min="-10" max="40" step="1" data-k="track"></div>
          <div class="f"><label class="lab" for="lead">Line height <output data-for="lead"></output></label><input type="range" id="lead" min="70" max="180" step="5" data-k="lead"></div>
        </div>
        <label class="chk"><input type="checkbox" data-k="upper">All caps</label>
      </div>
    </div>

    <!-- Save -->
    <div class="panel">
      <button type="button" class="ph" aria-expanded="false" aria-controls="pSave">Save and share<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="pb" id="pSave" hidden>
        <div class="f"><label class="lab" for="outSize">Image size (long edge)</label>
          <select id="outSize" data-k="outSize"><option value="1080">1080 px</option><option value="2048">2048 px</option><option value="3000">3000 px</option><option value="4096">4096 px</option></select></div>
        <div class="row">
          <button type="button" class="btn primary" id="savePng">Save image</button>
          <button type="button" class="btn" id="share" hidden>Share</button>
        </div>
        <button type="button" class="btn only-dot" id="saveVideo" hidden>Save reveal video</button>
        <button type="button" class="btn" id="reset">Reset settings</button>
      </div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="foot">Photos stay on your device. Nothing is uploaded.</p>
  </section>
</main>

<div class="modal" id="camModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="camTitle">
    <h2 id="camTitle">Take photo</h2>
    <video id="camVideo" playsinline muted autoplay></video>
    <div class="row">
      <button type="button" class="btn primary" id="snap">Take photo</button>
      <button type="button" class="btn" id="flip" hidden>Switch camera</button>
      <button type="button" class="btn" id="camCancel">Cancel</button>
    </div>
  </div>
</div>

<script>
(function () {
"use strict";
var KEY = "halftone:settings";
var DEF = {
  look: "dot",
  cols: 56, reveal: 60, dmDot: 86, dmShape: "circle", dir: "lr", palette: "confetti", band: 22, wash: 55, scatter: 25,
  dmSat: 110, dmCon: 110, dmBg: "#fbfbf8", revealTime: 3, seed: 7,
  htMode: "ink", htInk: "#1d2622", htPaper: "#f6f1e7", htCells: 70, htAngle: 45, htShape: "dot", htGain: 100, htCon: 120, htLight: 0, htInvert: false,
  text: "Image Looks", font: "Inter", weight: 800, textColor: "#ffffff", textOp: 100, size: 11, textMode: "solid", align: "center",
  tx: 50, ty: 86, track: 0, lead: 100, upper: false,
  outSize: "2048"
};
var FONTS = {
  "Inter": [400, 600, 800], "Rubik": [400, 600, 800], "Space Grotesk": [400, 500, 700], "DM Sans": [400, 600, 800],

  fillWeights();
  document.querySelectorAll("[data-color]").forEach(syncColor);
  document.body.dataset.look = S.look; document.body.dataset.ht = S.htMode;
}
function onChange(el) {
  var k = el.dataset.k, v;
  if (el.type === "radio") { if (!el.checked) return; v = el.value; }
  else if (el.type === "checkbox") v = el.checked;
  else if (el.type === "range") v = +el.value;
  else if (k === "weight") v = +el.value;
  else v = el.value;
  S[k] = v; out(k);
  if (k === "look") document.body.dataset.look = v;
  if (k === "htMode") document.body.dataset.ht = v;
  if (k === "font") { fillWeights(); ensureFont(S.font, S.weight).then(schedule); }
  if (k === "weight") ensureFont(S.font, S.weight).then(schedule);
  if (k === "reveal") cancelAnimationFrame(playing);
  saveSettings(); schedule();
}
document.querySelectorAll("[data-k]").forEach(function (el) {
  el.addEventListener(el.type === "range" || el.tagName === "TEXTAREA" ? "input" : "change", function () { onChange(el); });
});

/* color fields: native picker, swatches and a pick from image button */
function buildColor(box) {
  var k = box.dataset.color, lab = box.dataset.label;
  var inp = document.createElement("input"); inp.type = "color"; inp.setAttribute("aria-labelledby", lab);
  inp.addEventListener("input", function () { setColor(k, inp.value); });
  box.appendChild(inp);
  var pick = document.createElement("button"); pick.type = "button"; pick.className = "icob pick"; pick.setAttribute("aria-pressed", "false");
  pick.setAttribute("aria-label", "Pick " + document.getElementById(lab).textContent.toLowerCase() + " from the image"); pick.title = "Pick from image";
  pick.innerHTML = "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14.5 5.5l4 4M4 20l1-4 9.5-9.5 3 3L8 19z\"/><path d=\"M15 4.5a2.1 2.1 0 0 1 3 0l1.5 1.5a2.1 2.1 0 0 1 0 3\"/></svg>";
  pick.addEventListener("click", function () {
    pickKey = pickKey === k ? null : k;
    document.querySelectorAll(".pick").forEach(function (b) { b.setAttribute("aria-pressed", b === pick && pickKey ? "true" : "false"); });
    cv.classList.toggle("picking", !!pickKey);
    if (pickKey) say("Tap the image to pick a color."); else say("");
    draw();
  });
  box.appendChild(pick);
  SWATCHES.forEach(function (c) {
    var b = document.createElement("button"); b.type = "button"; b.className = "sw"; b.style.background = c;
    b.dataset.c = c; b.setAttribute("aria-label", "Color " + c); b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () { setColor(k, c); });
    box.appendChild(b);
  });
}
function syncColor(box) {
  var v = S[box.dataset.color];
  box.querySelector("input").value = v;
  box.querySelectorAll(".sw").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.c === v.toLowerCase() ? "true" : "false"); });
}
function setColor(k, v) {
  S[k] = v.toLowerCase();
  document.querySelectorAll("[data-color=\"" + k + "\"]").forEach(syncColor);
  saveSettings(); schedule();
}
document.querySelectorAll("[data-color]").forEach(buildColor);

/* collapsible panels */
document.querySelectorAll(".ph").forEach(function (b) {
  b.addEventListener("click", function () {
    var open = b.getAttribute("aria-expanded") !== "true";
    b.setAttribute("aria-expanded", open); document.getElementById(b.getAttribute("aria-controls")).hidden = !open;
  });
});

/* canvas: drag moves the text (a tap does not), double tap toggles full width, or pick a color */
var down = null, dragging = false, lastTap = 0;
function toggleBig() { big = !big; fit(); draw(); say(big ? "Full width." : "Fitted to the screen."); }
function moveText(e) {
  var r = cv.getBoundingClientRect();
  S.tx = Math.round(clamp(down.tx + (e.clientX - down.x) / r.width * 100, 0, 100) * 2) / 2;
  S.ty = Math.round(clamp(down.ty + (e.clientY - down.y) / r.height * 100, 0, 100) * 2) / 2;
  $("#tx").value = S.tx; $("#ty").value = S.ty; out("tx"); out("ty");
  schedule();
}
cv.addEventListener("pointerdown", function (e) {
  if (pickKey) {
    var r = cv.getBoundingClientRect();
    var px = clamp(Math.floor((e.clientX - r.left) / r.width * src.width), 0, src.width - 1);
    var py = clamp(Math.floor((e.clientY - r.top) / r.height * src.height), 0, src.height - 1);
    var p = sctx.getImageData(px, py, 1, 1).data, hex = toHex(p[0], p[1], p[2]);
    var k = pickKey; pickKey = null;
    document.querySelectorAll(".pick").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
    cv.classList.remove("picking");
    setColor(k, hex); say("Picked " + hex + ".");
    draw();
    return;
  }
  down = { x: e.clientX, y: e.clientY, tx: S.tx, ty: S.ty };
  dragging = false;
  if (hasText()) { cv.setPointerCapture(e.pointerId); e.preventDefault(); }
});
cv.addEventListener("pointermove", function (e) {
  if (!down || !hasText()) return;
  if (!dragging && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) dragging = true;
  if (dragging) moveText(e);
});
function endDrag(e) {
  if (!down) return;
  var was = dragging; down = null; dragging = false;
  if (was) { saveSettings(); lastTap = 0; return; }
  if (e.type !== "pointerup") return;
  var now = performance.now();
  if (now - lastTap < 350) { lastTap = 0; toggleBig(); } else lastTap = now;
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("dblclick", function (e) { e.preventDefault(); });

/* buttons */
$("#addImg").addEventListener("click", function () { $("#fileIn").click(); });
$("#takePhoto").addEventListener("click", openCamera);
$("#fileIn").addEventListener("change", function (e) { loadFile(e.target.files[0]); e.target.value = ""; });
$("#camIn").addEventListener("change", function (e) { loadFile(e.target.files[0]); e.target.value = ""; });
$("#play").addEventListener("click", play);
$("#saveTop").addEventListener("click", savePng);
$("#savePng").addEventListener("click", savePng);
$("#share").addEventListener("click", share);
$("#saveVideo").addEventListener("click", saveVideo);
$("#shuffle").addEventListener("click", function () { S.seed = (Math.random() * 1e6) | 0; saveSettings(); schedule(); });
$("#reset").addEventListener("click", function () {
  S = Object.assign({}, DEF); sync(); saveSettings(); ensureFont(S.font, S.weight).then(schedule); say("Settings reset.");
});
$("#snap").addEventListener("click", snap);
$("#camCancel").addEventListener("click", closeCamera);
$("#flip").addEventListener("click", function () { facing = facing === "user" ? "environment" : "user"; startStream().catch(function () {}); });
$("#camModal").addEventListener("keydown", function (e) {
  if (e.key === "Escape") { e.preventDefault(); closeCamera(); return; }
  if (e.key !== "Tab") return;
  var f = Array.prototype.filter.call($("#camModal").querySelectorAll("button"), function (b) { return !b.hidden; });
  var first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

/* start */
try {
  var probe = new File([new Blob(["x"], { type: "image/png" })], "x.png", { type: "image/png" });
  $("#share").hidden = !(navigator.canShare && navigator.canShare({ files: [probe] }));
} catch (e) {}
$("#saveVideo").hidden = !videoType();
sync();
if (window.ResizeObserver) new ResizeObserver(function () { fit(); }).observe(stage);
window.addEventListener("resize", fit);
demo();
ensureFont(S.font, S.weight).then(schedule);
})();
</script>
