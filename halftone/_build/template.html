<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* iPhone/iPad: Safari zooms in on a field under 16 px when it takes focus; maximum-scale stops that (pinch zoom still works on iOS) */
if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1))
  document.querySelector("meta[name=viewport]").setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover");</script>
<meta name="theme-color" content="#fbf8f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Halftone">
<link rel="apple-touch-icon" href="/px/icon-180.png">
<title>Halftone</title>
<script>/* light/dark, shared with the rest of fogday.com (localStorage "fogday-theme"); no saved choice = follow the system */
(function () { var t = null; try { t = localStorage.getItem("fogday-theme"); } catch (e) {}
  if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t; })();</script>
<meta name="description" content="Turn a photo into a dot matrix or a halftone print, add text on a path, save it as an image or a video.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Rubik:wght@400;500;600&display=swap">
<style>
:root{--paper:#ffffff;--ink:#1d1d1d;--muted:#5e5e5e;--felt:#1f5c4a;--felt-d:#164536;--red:#b8352b;--line:#dcdcdc;--card:#ffffff;--well:#efefef;--field:#ffffff;--stagebg:#ececec;color-scheme:light;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
:root[data-theme="dark"]{--paper:#1e1e1e;--ink:#e6e6e6;--muted:#a3a3a3;--felt:#5681ff;--felt-d:#4570f0;--red:#ff7a6e;--line:#444444;--card:#2b2b2b;--well:#3a3a3a;--field:#363636;--stagebg:#141414;color-scheme:dark}
.topr{display:flex;align-items:center;gap:2px}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:6px;margin:0;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:8px}
.theme-toggle svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle .icon-sun{display:none}
.theme-toggle:hover .icon-moon path{fill:currentColor}
:root[data-theme="dark"] .theme-toggle .icon-moon{display:none}
:root[data-theme="dark"] .theme-toggle .icon-sun{display:block}
:root[data-theme="dark"] .theme-toggle:hover{color:#ffe680}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.35 "Rubik",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.ico{width:16px;height:16px;flex:0 0 16px;display:block}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1180px;margin:0 auto;
  padding:calc(6px + var(--sat)) calc(2.5vw + var(--sar) - 4px) 2px calc(2.5vw + var(--sal))}
h1{margin:0;font:400 22px/1.1 "Young Serif",Georgia,serif;letter-spacing:.01em}
.bento{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:5px;color:var(--muted);border-radius:8px}
.bento svg{display:block;width:100%;height:100%}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:4px calc(2.5vw + var(--sar)) calc(24px + var(--sab)) calc(2.5vw + var(--sal));display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
/* phones: the image stays pinned at the top while the settings scroll under it (not in full width mode) */
.stagecol{position:sticky;top:0;z-index:5;background:var(--paper);padding:calc(4px + var(--sat)) 0 2px;min-width:0}
body.big .stagecol{position:static}
@media (min-width:900px){.top{padding-left:16px;padding-right:12px}.wrap{padding-left:16px;padding-right:16px;gap:16px;grid-template-columns:minmax(0,1fr) 380px;align-items:start}.stagecol{top:12px;padding-top:0}body.big .stagecol{position:sticky}}
.stage{display:flex;justify-content:center}
#cv{display:block;border-radius:12px;background:var(--stagebg);box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 28px rgba(29,38,34,.12);touch-action:manipulation}
#cv.drag{touch-action:none;cursor:move}
#cv.picking,#cv.drawing{cursor:crosshair;touch-action:none}
.hint{margin:4px 0 0;text-align:center;font-size:12px;color:var(--muted);min-height:16px}
.ctlcol{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.actions{display:flex;gap:6px}
.imgs{display:grid;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--card)}
.imgs .lab{display:flex;justify-content:space-between}
.ilist{display:grid;gap:4px;max-height:236px;overflow-y:auto}
.layer{display:flex;align-items:center;gap:8px;padding:3px 6px 3px 3px;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer}
.layer[aria-current="true"]{border-color:var(--felt);box-shadow:inset 0 0 0 1px var(--felt)}
.layer canvas{height:40px;width:40px;object-fit:cover;border-radius:5px;flex:0 0 40px}
.layer .nm{font-size:12px;font-weight:500;flex:0 0 52px;white-space:nowrap}
.layer input[type=range]{flex:1 1 auto;min-width:40px}
.layer output{font-size:12px;color:var(--muted);flex:0 0 34px;text-align:right}
.imgctl{display:flex;gap:6px;align-items:center}
.imgctl input[type=range]{flex:1 1 auto;min-width:50px}
.imgctl select{width:auto;flex:0 1 112px}
.rotu .ico{transform:rotate(180deg)}
.actions .btn{flex:1 1 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;height:32px;padding:0 10px;border-radius:8px;font-size:13px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;min-width:0;white-space:nowrap}
.btn span{overflow:hidden;text-overflow:ellipsis}
.actions .btn{padding:0 6px}
.btn:hover{border-color:var(--felt)}
.btn.primary{background:var(--felt);border-color:var(--felt);color:#fff}
.btn.primary:hover{background:var(--felt-d)}
.btn[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:#fff}
#riley{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
@media (max-width:360px){.actions .btn span{display:none}}
/* pill slider: Dot matrix, Halftone, Text share one switch; the green pill slides to the chosen one */
.tabrow{display:flex;gap:6px;align-items:center}.tabrow .pill{flex:1;min-width:0}
.pill{position:relative;display:grid;grid-template-columns:repeat(4,1fr);height:32px;border-radius:999px;background:var(--well);padding:2px}
.pill .knob{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/4);border-radius:999px;background:var(--felt);transform:translateX(calc(var(--i,0) * 100%));transition:transform .25s cubic-bezier(.3,0,.2,1)}
.pill [role=tab]{position:relative;z-index:1;border:0;background:none;border-radius:999px;font-weight:500;font-size:13px;white-space:nowrap;padding:0 2px;min-width:0;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.pill [role=tab][aria-selected=true]{color:#fff}
.pill [role=tab].cur::after{content:"";flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.tabp{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:10px}
.ph{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:32px;padding:0 12px;border:0;background:none;cursor:pointer;font:400 15px/1.2 "Young Serif",Georgia,serif;text-align:left;border-radius:10px}
.ph .ico{color:var(--muted);transition:transform .2s}
.ph[aria-expanded="false"] .ico{transform:rotate(-90deg)}
.pb{padding:0 12px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.f{display:grid;gap:0}
.f>.lab{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.f>.lab output{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:26px;margin:0;accent-color:var(--felt);background:transparent}
select,textarea{width:100%;min-height:32px;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--field);font-size:13px}
textarea{resize:vertical;height:auto;padding:6px 8px;min-height:52px;line-height:1.3}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--card);gap:2px;margin:0;min-width:0;height:32px}
.seg legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg label{flex:1 1 0;min-width:0;position:relative;display:flex}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;min-height:26px;padding:0 4px;border-radius:7px;text-align:center;font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.seg input:checked+span{background:var(--felt);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--red);outline-offset:1px}
.color{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px}
.color input[type=color]{width:40px;height:32px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer}
.color .sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.color .sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--felt)}
.icob{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:0 0 32px;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer;padding:0}
.icob[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:#fff}
.icob[disabled]{opacity:.4;cursor:default}
.chk{display:flex;align-items:center;gap:8px;min-height:32px;cursor:pointer;font-size:13px}
.chk input{width:18px;height:18px;accent-color:var(--felt)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row .btn{flex:1 1 auto}
/* text layers */
.layers{display:flex;gap:6px;align-items:center}
.chips{display:flex;gap:4px;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
.chip{flex:0 0 auto;max-width:130px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--field);cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:#fff}
.status{min-height:18px;margin:0;font-size:13px;color:var(--felt)}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 0}
body:not([data-ht="ink"]) .ht-ink,body[data-ht="rgb"] .ht-paper{display:none!important}
body[data-path="none"] .p-any,body:not([data-path="arc"]) .p-arc,body:not([data-path="circle"]) .p-circle,body:not([data-path="wave"]) .p-wave{display:none!important}
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,26,24,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);border-radius:14px;padding:12px;max-width:640px;width:100%;display:grid;gap:8px}
.sheet h2{margin:0;font:400 18px/1.2 "Young Serif",Georgia,serif;display:flex;justify-content:space-between;align-items:center}
.sheet video{width:100%;border-radius:10px;background:#000;max-height:60vh;object-fit:contain}
#saveModal .sheet{max-width:380px}
@media (max-width:420px){.pill [role=tab]{font-size:12px;gap:3px}}
@media (prefers-reduced-motion:reduce){.ph .ico,.pill .knob{transition:none}}
</style>
</head>
<body data-look="dot" data-ht="rgb" data-path="none">
<header class="top">
  <h1>Halftone</h1>
  <div class="topr">
  <button class="theme-toggle" id="themeBtn" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12h2.5M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
  </button>
  <a href="/works/" class="bento" aria-label="Projects" title="Projects"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.75" y="2.75" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="2.75" width="4.5" height="4.5" rx="1"/><rect x="16.75" y="2.75" width="4.5" height="4.5" rx="1"/><rect x="2.75" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="16.75" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="2.75" y="16.75" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="16.75" width="4.5" height="4.5" rx="1"/><rect x="16.75" y="16.75" width="4.5" height="4.5" rx="1"/></g></svg></a>
  </div>
</header>

<main class="wrap">
  <section class="stagecol" aria-label="Preview">
    <div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Preview of the image look"></canvas></div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="ctlcol" aria-label="Settings">
    <div class="actions">
      <button type="button" class="btn" id="addImg" aria-label="Add image" title="Add image">{{icon:image}}<span>Image</span></button>
      <button type="button" class="btn" id="takePhoto" aria-label="Take photo" title="Take photo">{{icon:camera}}<span>Camera</span></button>
      <button type="button" class="btn primary" id="saveOpen">{{icon:download-simple}}<span>Save</span></button>
    </div>
    <input type="file" id="fileIn" accept="image/*" multiple hidden>
    <div class="imgs" id="imgs" hidden>
      <span class="lab"><span>Layers (top is in front)</span><span id="imgN"></span></span>
      <div class="ilist" id="layers" role="list" aria-label="Image layers, top first"></div>
      <div class="imgctl">
        <button type="button" class="icob rotu" id="imgUp" aria-label="Move this layer up (in front)" title="Move up">{{icon:caret-down}}</button>
        <button type="button" class="icob" id="imgDown" aria-label="Move this layer down (behind)" title="Move down">{{icon:caret-down}}</button>
        <select style="flex:1 1 auto;width:auto" id="imgBlend" aria-label="Image blend mode"><option value="source-over">Normal</option><option value="multiply">Multiply</option><option value="screen">Screen</option><option value="overlay">Overlay</option><option value="soft-light">Soft light</option><option value="lighten">Lighten</option><option value="darken">Darken</option><option value="difference">Difference</option></select>
        <button type="button" class="icob" id="imgDel" aria-label="Remove this image" title="Remove">{{icon:trash}}</button>
      </div>
    </div>
    <input type="file" id="camIn" accept="image/*" capture="environment" hidden>

    <div class="tabrow">
    <div class="pill" role="tablist" aria-label="Edit">
      <span class="knob" aria-hidden="true"></span>
      <button type="button" role="tab" id="t-dot" aria-controls="p-dot" data-tab="dot">Dot matrix</button>
      <button type="button" role="tab" id="t-half" aria-controls="p-half" data-tab="half">Halftone</button>
      <button type="button" role="tab" id="t-text" aria-controls="p-text" data-tab="text">Text</button>
      <button type="button" role="tab" id="t-fx" aria-controls="p-fx" data-tab="fx">Effects</button>
    </div>
    <button type="button" class="icob" id="tabReset" aria-label="Reset this tab" title="Reset this tab">{{icon:arrow-counter-clockwise}}</button>
    </div>

    <!-- Dot matrix -->
    <div class="tabp" role="tabpanel" id="p-dot" aria-labelledby="t-dot">
      <div class="acc">
        <button type="button" class="ph" aria-expanded="false" aria-controls="a-grid">Grid{{icon:caret-down}}</button>
        <div class="pb" id="a-grid" hidden>
          <div class="f"><label class="lab" for="cols">Dots across <output data-for="cols"></output></label><input type="range" id="cols" min="12" max="160" step="1" data-k="cols"></div>
          <div class="f"><label class="lab" for="dmDot">Dot size <output data-for="dmDot"></output></label><input type="range" id="dmDot" min="20" max="100" step="1" data-k="dmDot"></div>
          <div class="f"><label class="lab" for="dmOp">Dot opacity <output data-for="dmOp"></output></label><input type="range" id="dmOp" min="5" max="100" step="1" data-k="dmOp"></div>
          <fieldset class="seg"><legend>Dot shape</legend>
            <label><input type="radio" name="dmShape" value="circle" data-k="dmShape"><span>Circle</span></label>
            <label><input type="radio" name="dmShape" value="square" data-k="dmShape"><span>Square</span></label>
          </fieldset>
        </div>
      </div>
      <div class="acc">
        <button type="button" class="ph" aria-expanded="false" aria-controls="a-reveal">Reveal{{icon:caret-down}}</button>
        <div class="pb" id="a-reveal" hidden>
          <div class="f"><label class="lab" for="reveal">Reveal <output data-for="reveal"></output></label><input type="range" id="reveal" min="0" max="100" step="1" data-k="reveal"></div>
          <fieldset class="seg"><legend>Reveal from</legend>
            <label><input type="radio" name="dmFrom" value="confetti" data-k="dmFrom"><span>Confetti colors</span></label>
            <label><input type="radio" name="dmFrom" value="clear" data-k="dmFrom"><span>Transparent</span></label>
          </fieldset>
          <div class="f"><label class="lab" for="dir">Direction</label>
            <select id="dir" data-k="dir"><option value="lr">Left to right</option><option value="rl">Right to left</option><option value="tb">Top to bottom</option><option value="diag">Diagonal</option><option value="center">From center</option><option value="random">Random</option></select></div>
          <div class="f"><label class="lab" for="band">Fade band <output data-for="band"></output></label><input type="range" id="band" min="3" max="60" step="1" data-k="band"></div>
          <div class="f"><label class="lab" for="wash">Washout <output data-for="wash"></output></label><input type="range" id="wash" min="0" max="100" step="1" data-k="wash"></div>
          <div class="f"><label class="lab" for="scatter">Edge scatter <output data-for="scatter"></output></label><input type="range" id="scatter" min="0" max="60" step="1" data-k="scatter"></div>
          <div class="f"><label class="lab" for="revealTime">Reveal time <output data-for="revealTime"></output></label><input type="range" id="revealTime" min="1" max="8" step="0.5" data-k="revealTime"></div>
        </div>
      </div>
      <div class="acc">
        <button type="button" class="ph" aria-expanded="false" aria-controls="a-dmcolor">Color{{icon:caret-down}}</button>
        <div class="pb" id="a-dmcolor" hidden>
          <div class="f"><label class="lab" for="palette">Start colors</label>
            <div class="row"><select id="palette" data-k="palette" style="flex:1"><option value="confetti">Confetti</option><option value="pastel">Pastel</option><option value="neon">Neon</option><option value="mono">Mono</option></select>
            <button type="button" class="icob" id="shuffle" aria-label="Shuffle start colors" title="Shuffle start colors">{{icon:shuffle}}</button></div></div>
          <div class="two">
            <div class="f"><label class="lab" for="dmSat">Saturation <output data-for="dmSat"></output></label><input type="range" id="dmSat" min="0" max="200" step="1" data-k="dmSat"></div>
            <div class="f"><label class="lab" for="dmCon">Contrast <output data-for="dmCon"></output></label><input type="range" id="dmCon" min="50" max="200" step="1" data-k="dmCon"></div>
          </div>
          <div class="f"><span class="lab" id="dmBgL">Background</span><div class="color" data-color="dmBg" data-label="dmBgL"></div></div>
        </div>
      </div>
    </div>

    <!-- Halftone -->
    <div class="tabp" role="tabpanel" id="p-half" aria-labelledby="t-half" hidden>
      <button type="button" class="btn" id="riley" aria-pressed="false"><span>Bridget Riley</span></button>
      <div class="acc">
        <button type="button" class="ph" aria-expanded="false" aria-controls="a-screen">Screen{{icon:caret-down}}</button>
        <div class="pb" id="a-screen" hidden>
          <div class="f"><label class="lab" for="htCells">Dots across <output data-for="htCells"></output></label><input type="range" id="htCells" min="16" max="180" step="1" data-k="htCells"></div>
          <div class="f"><label class="lab" for="htAngle">Screen angle <output data-for="htAngle"></output></label><input type="range" id="htAngle" min="0" max="90" step="1" data-k="htAngle"></div>
          <fieldset class="seg"><legend>Dot shape</legend>
            <label><input type="radio" name="htShape" value="dot" data-k="htShape"><span>Dot</span></label>
            <label><input type="radio" name="htShape" value="square" data-k="htShape"><span>Square</span></label>
            <label><input type="radio" name="htShape" value="line" data-k="htShape"><span>Line</span></label>
          </fieldset>
          <div class="f"><label class="lab" for="htGain">Dot gain <output data-for="htGain"></output></label><input type="range" id="htGain" min="40" max="160" step="1" data-k="htGain"></div>

<script>
(function () {
"use strict";
var KEY = "halftone:settings";
var LDEF = {
  text: "", font: "Inter", weight: 800, size: 11, color: "#ffffff", op: 100, mode: "solid", upper: false,
  align: "center", track: 0, lead: 100, hs: 100, vs: 100, rot: 0, skew: 0, shift: 0, tx: 50, ty: 86,
  path: "none", bend: 40, radius: 30, waveA: 6, waveF: 2, start: 0, effect: "rainbow", pathAlign: "baseline", flip: false, pts: null,
  fill: true, strokeW: 0, strokeC: "#1d2622", shadow: 0, blend: "source-over"
};
var DEF = {
  look: "dot",
  cols: 56, reveal: 60, dmDot: 86, dmOp: 100, dmShape: "circle", dir: "lr", palette: "confetti", band: 22, wash: 55, scatter: 25,
  dmSat: 110, dmCon: 110, dmBg: "#fbfbf8", revealTime: 3, seed: 7, dmFrom: "confetti",
  htMode: "rgb", htInk: "#1d2622", htPaper: "#f6f1e7", htCells: 70, htAngle: 45, htShape: "dot", htGain: 100, htOp: 100, htCon: 120, htLight: 0, htInvert: false, htRiley: false,
  fxShift: 0, fxGlitch: 0, fxSeed: 3, fxLeak: 0, fxFlare: 0, fxStreak: 0, fxGrade: "none", fxGradeAmt: 70,
  outSize: "2048", ig: false, igSize: "1350", active: 0
};
var FONTS = {
  "Inter": [400, 600, 800], "Rubik": [400, 600, 800], "Space Grotesk": [400, 500, 700], "DM Sans": [400, 600, 800],
  "Archivo Black": [400], "Bebas Neue": [400], "Anton": [400], "Young Serif": [400], "Playfair Display": [400, 600, 800],
  "DM Serif Display": [400], "Space Mono": [400, 700]
};
var WNAMES = { 400: "Regular", 500: "Medium", 600: "Semibold", 700: "Bold", 800: "Extra bold" };
var PALETTES = {
  confetti: ["#5ccfa6", "#f27b5b", "#f2b431", "#e2559b", "#7a5af0", "#4db7e2", "#2b2b2e", "#9fe0c9", "#5ccfa6", "#4db7e2"],
  pastel: ["#a8e6cf", "#ffd3b6", "#ffaaa5", "#dcd3ff", "#bde0fe", "#fdf1a6"],
  neon: ["#39ff14", "#ff2079", "#00e5ff", "#ffe600", "#b026ff", "#ff6b00", "#111111"],
  mono: ["#111111", "#3a3a3a", "#6b6b6b", "#9a9a9a", "#c8c8c8", "#e6e6e6"]
};
var SWATCHES = ["#1d2622", "#ffffff", "#1f5c4a", "#b8352b", "#f2b431", "#4db7e2", "#e2559b", "#7a5af0"];

var S = loadSettings();
var $ = function (s) { return document.querySelector(s); };
var cv = $("#cv"), pctx = cv.getContext("2d");
var stage = $("#stage"), statusEl = $("#status");
var src = document.createElement("canvas"), sctx = src.getContext("2d", { willReadFrequently: true });
var orig = document.createElement("canvas");
var scratch = document.createElement("canvas").getContext("2d");
var cache = {};
var pickKey = null, big = false, tab = S.look, drawMode = false, stroke = null;
var playing = 0;

function newLayer(o) { return Object.assign({}, LDEF, o || {}); }
function loadSettings() {
  var o = {};
  try { o = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  var s = Object.assign({}, DEF, o);
  if (!Array.isArray(o.layers)) {
    /* settings from the first version had one text: carry it over as layer 1 */
    var old = {};
    if (typeof o.text === "string") old = { text: o.text, font: o.font, weight: o.weight, color: o.textColor, op: o.textOp, size: o.size,
      mode: o.textMode, align: o.align, tx: o.tx, ty: o.ty, track: o.track, lead: o.lead, upper: o.upper };
    Object.keys(old).forEach(function (k) { if (old[k] == null) delete old[k]; });
    s.layers = [old];
  }
  ["text", "font", "weight", "textColor", "textOp", "size", "textMode", "align", "tx", "ty", "track", "lead", "upper"].forEach(function (k) { delete s[k]; });
  s.layers = s.layers.map(function (l) { var n = newLayer(l); if (!FONTS[n.font]) n.font = LDEF.font; return n; });
  if (!s.layers.length) s.layers = [newLayer()];
  /* the old default text ("Image Looks") was saved for everyone who changed any setting: clear it once if it is still the only text */
  if (!o.v2 && s.layers.length === 1 && s.layers[0].text === "Image Looks") s.layers[0].text = "";
  s.v2 = true;
  s.active = Math.min(Math.max(0, s.active | 0), s.layers.length - 1);
  return s;
}
var saveT;
function saveSettings() {
  clearTimeout(saveT);
  saveT = setTimeout(function () {
    try {
      localStorage.setItem(KEY, JSON.stringify(S, function (k, v) { return k.charAt(0) === "_" ? undefined : v; }));
    } catch (e) {}
  }, 300);
}
var sayT;
function say(t) { statusEl.textContent = t; clearTimeout(sayT); if (t) sayT = setTimeout(function () { statusEl.textContent = ""; }, 2500); }
function AL() { return S.layers[S.active]; }

/* ---------- helpers ---------- */
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function rgb(hex) { var n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function toHex(r, g, b) { return "#" + [r, g, b].map(function (v) { return ("0" + Math.round(v).toString(16)).slice(-2); }).join(""); }
function mulberry(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function mk(w, h) { var c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function ease(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }

/* Downsample by halving steps so each small cell is a true average of its area */
function shrink(c, w, h, read) {
  var cw = c.width, ch = c.height;
  while (cw / 2 >= w * 2 && ch / 2 >= h * 2) {
    var n = mk(cw / 2, ch / 2), x = n.getContext("2d");
    x.imageSmoothingQuality = "high"; x.drawImage(c, 0, 0, n.width, n.height);
    c = n; cw = n.width; ch = n.height;
  }
  var o = mk(w, h), ox = o.getContext("2d", { willReadFrequently: true });
  ox.imageSmoothingQuality = "high"; ox.drawImage(c, 0, 0, w, h);
  return read ? ox.getImageData(0, 0, w, h).data : o;
}
function sample(w, h) {
  var k = w + "x" + h;
  if (!cache[k]) cache[k] = shrink(src, w, h, true);
  return cache[k];
}

/* ---------- fonts ---------- */
var fontLinks = {};
function ensureFont(fam, w) {
  var p = fontLinks[fam];
  if (!p) {
    p = fontLinks[fam] = new Promise(function (res) {
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = "https://fonts.googleapis.com/css2?family=" + fam.replace(/ /g, "+") + ":wght@" + FONTS[fam].join(";") + "&display=swap";
      l.onload = res; l.onerror = res;
      document.head.appendChild(l);
    });
  }
  return p.then(function () {
    return document.fonts && document.fonts.load ? document.fonts.load(w + " 48px \"" + fam + "\"", "AaGg") : null;
  }).catch(function () {});
}
function allFonts() { return Promise.all(S.layers.map(function (l) { return ensureFont(l.font, l.weight); })); }
function fillWeights() {
  var L = AL(), sel = $("#weight"), ws = FONTS[L.font];
  sel.innerHTML = "";
  ws.forEach(function (w) { var o = document.createElement("option"); o.value = w; o.textContent = WNAMES[w]; sel.appendChild(o); });
  if (ws.indexOf(+L.weight) < 0) L.weight = ws.reduce(function (a, b) { return Math.abs(b - L.weight) < Math.abs(a - L.weight) ? b : a; });
  sel.value = L.weight;

  var l = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
  for (var i = 0; i < l.length; i++) if (MediaRecorder.isTypeSupported(l[i])) return l[i];
  return null;
}
function saveVideo() {
  var type = videoType(); if (!type) return;
  var dm = outDims(1080), c = mk(dm[0] & ~1, dm[1] & ~1), x = c.getContext("2d");
  var dur = S.revealTime * 1000, hold0 = 500, hold1 = 1200, chunks = [];
  var btn = $("#saveVideo"); btn.disabled = true; say("Recording the reveal.");
  render(x, c.width, c.height, 0, false);
  var rec = new MediaRecorder(c.captureStream(30), { mimeType: type, videoBitsPerSecond: 8e6 });
  rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
  rec.onstop = function () {
    var b = new Blob(chunks, { type: type.split(";")[0] });
    download(b, fname(type.indexOf("mp4") > 0 ? "mp4" : "webm"));
    btn.disabled = false; say("");
  };
  rec.start();
  var t0 = performance.now();
  (function frame(now) {
    var t = now - t0, p = clamp((t - hold0) / dur, 0, 1);
    render(x, c.width, c.height, ease(p), false);
    if (t < hold0 + dur + hold1) requestAnimationFrame(frame); else rec.stop();
  })(t0);
}

/* ---------- tabs (the pill slider) ---------- */
function setTab(t) {
  tab = t;
  if (t === "dot" || t === "half") { S.look = t; document.body.dataset.look = t; saveSettings(); }
  var tabs = document.querySelectorAll(".pill [role=tab]");
  tabs.forEach(function (b, i) {
    var on = b.dataset.tab === t;

  b.addEventListener("keydown", function (e) {

    if (!d) return;

});

/* ---------- controls ---------- */
var UNITS = { fxShift: "%", fxGlitch: "%", fxLeak: "%", fxFlare: "%", fxStreak: "%", fxGradeAmt: "%", reveal: "%", dmDot: "%", dmOp: "%", htOp: "%", band: "%", wash: "%", scatter: "%", dmSat: "%", dmCon: "%", htGain: "%", htCon: "%", op: "%", size: "%",
  tx: "%", ty: "%", lead: "%", hs: "%", vs: "%", revealTime: " s", htAngle: "°", rot: "°", skew: "°", bend: "%", radius: "%",
  waveA: "%", start: "%", strokeW: "%", shadow: "%", shift: "%" };
var SIGNED = { htLight: 1, rot: 1, skew: 1, shift: 1, bend: 1, start: 1, track: 1 };
function out(k, v) {
  document.querySelectorAll("output[data-for=\"" + k + "\"]").forEach(function (o) {
    o.textContent = (SIGNED[k] && v > 0 ? "+" : "") + v + (UNITS[k] || "");

}
function setVal(el, v) {
  if (el.type === "radio") el.checked = String(v) === el.value;
  else if (el.type === "checkbox") el.checked = !!v;
  else el.value = v;
}
function syncLayer() {
  var L = AL();
  document.querySelectorAll("[data-l]").forEach(function (el) { var k = el.dataset.l; if (k !== "weight") setVal(el, L[k]); out(k, L[k]); });
  fillWeights();
  document.querySelectorAll("[data-lcolor]").forEach(syncColor);
  document.body.dataset.path = L.path === "custom" && !(L.pts && L.pts.length > 1) ? "none" : L.path;
  renderChips();
}
function sync() {
  document.querySelectorAll("[data-k]").forEach(function (el) { var k = el.dataset.k; setVal(el, S[k]); out(k, S[k]); });
  document.querySelectorAll("[data-color]").forEach(syncColor);
  document.body.dataset.ht = S.htMode;
  $("#riley").setAttribute("aria-pressed", S.htRiley ? "true" : "false");
  $("#igSizes").hidden = !S.ig; $("#outSize").disabled = S.ig;
  if (orig.width) applyCrop();
  syncLayer();
}
function onChange(el) {
  var scope = el.dataset.k ? S : AL(), k = el.dataset.k || el.dataset.l, v;
  if (el.type === "radio") { if (!el.checked) return; v = el.value; }
  else if (el.type === "checkbox") v = el.checked;
  else if (el.type === "range" || k === "weight") v = +el.value;
  else v = el.value;
  scope[k] = v; out(k, v);
  if (k === "htMode") document.body.dataset.ht = v;
  if (k === "font") { fillWeights(); ensureFont(scope.font, scope.weight).then(schedule); }
  if (k === "weight") ensureFont(scope.font, scope.weight).then(schedule);
  if (k === "reveal") cancelAnimationFrame(playing);
  if (k === "path") {
    if (v === "custom" && !(scope.pts && scope.pts.length > 1)) { setDraw(true); }
    document.body.dataset.path = v === "custom" && !(scope.pts && scope.pts.length > 1) ? "none" : v;
  }
  if (k === "text") renderChips();
  if (k === "ig" || k === "igSize") applyCrop();
  saveSettings(); schedule();
}
document.querySelectorAll("[data-k],[data-l]").forEach(function (el) {
  el.addEventListener(el.type === "range" || el.tagName === "TEXTAREA" ? "input" : "change", function () { onChange(el); });
});

/* color fields: native picker, a pick from image button and swatches. data-color = a setting, data-lcolor = the chosen text's */
function colorGet(box) { return box.dataset.color ? S[box.dataset.color] : AL()[box.dataset.lcolor]; }
function buildColor(box) {
  var lab = box.dataset.label;
  var inp = document.createElement("input"); inp.type = "color"; inp.setAttribute("aria-labelledby", lab);
  inp.addEventListener("input", function () { setColor(box, inp.value); });
  box.appendChild(inp);
  var pick = document.createElement("button"); pick.type = "button"; pick.className = "icob pick"; pick.setAttribute("aria-pressed", "false");
  pick.setAttribute("aria-label", "Pick " + document.getElementById(lab).textContent.toLowerCase() + " from the image"); pick.title = "Pick from image";
  pick.appendChild($("#icoPick").content.cloneNode(true));
  pick.addEventListener("click", function () {
    pickKey = pickKey === box ? null : box;
    document.querySelectorAll(".pick").forEach(function (b) { b.setAttribute("aria-pressed", b === pick && pickKey ? "true" : "false"); });
    cv.classList.toggle("picking", !!pickKey);
    if (pickKey) setDraw(false);
    draw();
  });
  box.appendChild(pick);
  SWATCHES.forEach(function (c) {
    var b = document.createElement("button"); b.type = "button"; b.className = "sw"; b.style.background = c;
    b.dataset.c = c; b.setAttribute("aria-label", "Color " + c); b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () { setColor(box, c); });
    box.appendChild(b);
  });
}
function syncColor(box) {
  var v = colorGet(box);
  box.querySelector("input").value = v;
  box.querySelectorAll(".sw").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.c === v.toLowerCase() ? "true" : "false"); });
}
function setColor(box, v) {
  v = v.toLowerCase();
  if (box.dataset.color) S[box.dataset.color] = v; else AL()[box.dataset.lcolor] = v;
  syncColor(box); saveSettings(); schedule();
}
document.querySelectorAll("[data-color],[data-lcolor]").forEach(buildColor);

/* accordions: all closed to start */
document.querySelectorAll(".ph").forEach(function (b) {
  b.addEventListener("click", function () {
    var open = b.getAttribute("aria-expanded") !== "true";
    b.setAttribute("aria-expanded", open); document.getElementById(b.getAttribute("aria-controls")).hidden = !open;
  });
});

/* ---------- text layers ---------- */
function renderChips() {
  var box = $("#chips"); box.innerHTML = "";
  S.layers.forEach(function (l, i) {
    var b = document.createElement("button"); b.type = "button"; b.className = "chip";
    b.textContent = (l.text.trim().split("\n")[0] || "Empty text").slice(0, 24);
    b.setAttribute("aria-pressed", i === S.active ? "true" : "false");
    b.setAttribute("aria-label", "Text " + (i + 1) + ": " + b.textContent);
    b.addEventListener("click", function () { select(i); });
    box.appendChild(b);
  });
  $("#lDel").disabled = S.layers.length < 2 && !AL().text;
  $("#lAdd").disabled = $("#lDup").disabled = S.layers.length >= 12;
}
function select(i) { S.active = i; syncLayer(); saveSettings(); schedule(); }
$("#lAdd").addEventListener("click", function () {
  var prev = AL();
  S.layers.push(newLayer({ text: "New text", font: prev.font, weight: prev.weight, color: prev.color, size: Math.min(prev.size, 9),
    ty: prev.ty > 50 ? Math.max(8, prev.ty - 14) : Math.min(92, prev.ty + 14) }));
  select(S.layers.length - 1);
  var t = $("#ltext"); t.focus(); t.select();
});
$("#lDup").addEventListener("click", function () {
  var c = JSON.parse(JSON.stringify(AL(), function (k, v) { return k.charAt(0) === "_" ? undefined : v; }));
  c.tx = Math.min(100, c.tx + 3); c.ty = Math.min(100, c.ty + 3);
  S.layers.splice(S.active + 1, 0, newLayer(c)); select(S.active + 1);
});
$("#lDel").addEventListener("click", function () {
  if (S.layers.length < 2) { S.layers[0].text = ""; select(0); return; }
  S.layers.splice(S.active, 1); select(Math.max(0, S.active - 1));
});

/* draw a path for the chosen text */
function setDraw(on) {
  drawMode = on; stroke = null;
  $("#drawPath").setAttribute("aria-pressed", on);
  if (on && pickKey) { pickKey = null; document.querySelectorAll(".pick").forEach(function (b) { b.setAttribute("aria-pressed", "false"); }); cv.classList.remove("picking"); }
  draw();
}
$("#drawPath").addEventListener("click", function () { setDraw(!drawMode); });
$("#riley").addEventListener("click", function () {
  S.htRiley = !S.htRiley; this.setAttribute("aria-pressed", S.htRiley ? "true" : "false"); saveSettings(); schedule();
});
function finishPath() {
  var p = stroke; stroke = null; setDraw(false);
  if (!p || p.length < 4) return;
  /* smooth, then thin to at most 200 points */
  var sm = p.map(function (q, i) {
    var a = p[Math.max(0, i - 2)], b = p[Math.min(p.length - 1, i + 2)];
    return [(a[0] + q[0] * 2 + b[0]) / 4, (a[1] + q[1] * 2 + b[1]) / 4];
  });
  var step = Math.max(1, Math.ceil(sm.length / 200)), th = sm.filter(function (q, i) { return i % step === 0 || i === sm.length - 1; });
  var L = AL(), o = th[0];
  L.tx = Math.round(o[0] * 1000) / 10; L.ty = Math.round(o[1] * 1000) / 10;
  L.pts = th.map(function (q) { return [q[0] - o[0], q[1] - o[1]]; });
  L.path = "custom"; L.rot = 0; L.align = "left"; L.start = 0;
  syncLayer(); saveSettings(); schedule();
}

/* ---------- canvas gestures ---------- */
/* drag moves the text under the finger (a tap does not), two fingers size and turn it,
   double tap on text edits it (Text tab, field focused and selected), double tap elsewhere toggles full width */
var pts = new Map(), down = null, dragging = false, pinch = null, lastTap = 0, lastOn = false;
function fr(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; }
function hit(p) {
  var pad = 0.03;
  for (var i = S.layers.length - 1; i >= 0; i--) {
    var b = S.layers[i]._box;
    if (b && p[0] >= b[0] - pad && p[0] <= b[2] + pad && p[1] >= b[1] - pad && p[1] <= b[3] + pad) return i;
  }
  return -1;
}
function toggleBig() { big = !big; fit(); }
function editText() {
  if (big) toggleBig();
  setTab("text");
  var ta = $("#ltext");
  ta.focus({ preventScroll: true }); ta.select();
  ta.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
cv.addEventListener("pointerdown", function (e) {
  var p = fr(e);
  if (pickKey) {
    var px = clamp(Math.floor(p[0] * src.width), 0, src.width - 1), py = clamp(Math.floor(p[1] * src.height), 0, src.height - 1);
    var c = sctx.getImageData(px, py, 1, 1).data, box = pickKey;
    pickKey = null;
    document.querySelectorAll(".pick").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
    cv.classList.remove("picking");
    setColor(box, toHex(c[0], c[1], c[2])); draw();
    return;
  }
  cv.setPointerCapture(e.pointerId);
  if (drawMode) { stroke = [p]; e.preventDefault(); return; }
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) {
    var a = Array.from(pts.values()), L = AL();
    pinch = { d: Math.hypot(a[1][0] - a[0][0], a[1][1] - a[0][1]), a: Math.atan2(a[1][1] - a[0][1], a[1][0] - a[0][0]), size: L.size, rot: L.rot };
    dragging = false; lastTap = 0;
    e.preventDefault();
    return;
  }
  var i = hit(p);
  if (i >= 0 && i !== S.active) select(i);
  var L2 = AL();
  down = { x: e.clientX, y: e.clientY, tx: L2.tx, ty: L2.ty, on: i >= 0 };
  dragging = false;
  if (i >= 0) e.preventDefault();
});
cv.addEventListener("pointermove", function (e) {
  if (drawMode && stroke) { stroke.push(fr(e)); draw(); return; }
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  var L = AL();
  if (pinch && pts.size === 2) {
    var a = Array.from(pts.values());
    var d = Math.hypot(a[1][0] - a[0][0], a[1][1] - a[0][1]), an = Math.atan2(a[1][1] - a[0][1], a[1][0] - a[0][0]);
    L.size = Math.round(clamp(pinch.size * d / pinch.d, 2, 100) * 2) / 2;
    L.rot = Math.round(((pinch.rot + (an - pinch.a) * 180 / Math.PI + 540) % 360) - 180);
    $("#size").value = L.size; $("#rot").value = L.rot; out("size", L.size); out("rot", L.rot);
    schedule(); return;
  }
  if (!down || !down.on) return;
  if (!dragging && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) dragging = true;
  if (dragging) {
    var r = cv.getBoundingClientRect();
    L.tx = Math.round(clamp(down.tx + (e.clientX - down.x) / r.width * 100, 0, 100) * 2) / 2;
    L.ty = Math.round(clamp(down.ty + (e.clientY - down.y) / r.height * 100, 0, 100) * 2) / 2;
    $("#tx").value = L.tx; $("#ty").value = L.ty; out("tx", L.tx); out("ty", L.ty);
    schedule();
  }
});
function up(e) {
  if (drawMode && stroke) { if (e.type === "pointerup") finishPath(); else { stroke = null; draw(); } return; }
  pts.delete(e.pointerId);
  if (pinch) { if (pts.size < 2) { pinch = null; down = null; saveSettings(); } return; }
  if (!down) return;
  var was = dragging, on = down.on; down = null; dragging = false;
  if (was) { saveSettings(); lastTap = 0; return; }
  if (e.type !== "pointerup") return;
  var now = performance.now();
  if (now - lastTap < 350) { lastTap = 0; if (on && lastOn) editText(); else toggleBig(); } else { lastTap = now; lastOn = on; }
}
cv.addEventListener("pointerup", up);
cv.addEventListener("pointercancel", up);
cv.addEventListener("dblclick", function (e) { e.preventDefault(); });

/* ---------- buttons ---------- */
function themeSync() {
  var dark = document.documentElement.dataset.theme === "dark", b = $("#themeBtn");
  b.setAttribute("aria-pressed", dark ? "true" : "false");
  b.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode"); b.title = b.getAttribute("aria-label");
  document.querySelector("meta[name=theme-color]").setAttribute("content", dark ? "#1e1e1e" : "#ffffff");
}

  document.documentElement.dataset.theme = next;

  themeSync();
});

  var saved = null; try { saved = localStorage.getItem("fogday-theme"); } catch (x) {}
  if (saved !== "dark" && saved !== "light") { document.documentElement.dataset.theme = e.matches ? "dark" : "light"; themeSync(); }

themeSync();
$("#addImg").addEventListener("click", function () { $("#fileIn").click(); });

$("#camIn").addEventListener("change", function (e) { loadFile(e.target.files[0]); e.target.value = ""; });
$("#saveOpen").addEventListener("click", function () { openModal("#saveModal", "#savePng"); });

$("#share").addEventListener("click", share);

var TABKEYS = {
  dot: ["cols", "reveal", "dmDot", "dmOp", "dmShape", "dmFrom", "dir", "palette", "band", "wash", "scatter", "dmSat", "dmCon", "dmBg", "revealTime", "seed"],
  half: ["htMode", "htInk", "htPaper", "htCells", "htAngle", "htShape", "htGain", "htOp", "htCon", "htLight", "htInvert", "htRiley"],

  else TABKEYS[tab].forEach(function (k) { S[k] = DEF[k]; });

trap("#saveModal", function () { closeModal("#saveModal"); });

/* ---------- start ---------- */
try {
  var probe = new File([new Blob(["x"], { type: "image/png" })], "x.png", { type: "image/png" });
  $("#share").hidden = !(navigator.canShare && navigator.canShare({ files: [probe] }));
} catch (e) {}
sync();
setTab(S.look);
if (window.ResizeObserver) new ResizeObserver(function () { fit(); }).observe(stage);
window.addEventListener("resize", fit);
demo();
allFonts().then(schedule);
})();
