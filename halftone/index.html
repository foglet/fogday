<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* iPhone/iPad: Safari zooms in on a field under 16 px when it takes focus; maximum-scale stops that (pinch zoom still works on iOS) */
if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1))
  document.querySelector("meta[name=viewport]").setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover");</script>
<meta name="theme-color" content="#fbf8f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Image Looks">
<link rel="apple-touch-icon" href="/px/icon-180.png">
<title>Image Looks</title>
<meta name="description" content="Turn a photo into a dot matrix or a halftone print, add text on a path, save it as an image or a video.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Rubik:wght@400;500;600&display=swap">
<style>
:root{--paper:#fbf8f1;--ink:#1d2622;--muted:#55605a;--felt:#1f5c4a;--felt-d:#164536;--red:#b8352b;--line:#d9d2c3;--card:#fffdf8;--well:#ece6d9;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.35 "Rubik",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.ico{width:16px;height:16px;flex:0 0 16px;display:block}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1180px;margin:0 auto;
  padding:calc(6px + var(--sat)) calc(2.5vw + var(--sar) - 4px) 2px calc(2.5vw + var(--sal))}
h1{margin:0;font:400 22px/1.1 "Young Serif",Georgia,serif;letter-spacing:.01em}
.bento{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:5px;color:var(--muted);border-radius:8px}
.bento svg{display:block;width:100%;height:100%}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:4px calc(2.5vw + var(--sar)) calc(24px + var(--sab)) calc(2.5vw + var(--sal));display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
/* phones: the image stays pinned at the top while the settings scroll under it (not in full width mode) */
.stagecol{position:sticky;top:0;z-index:5;background:var(--paper);padding:calc(4px + var(--sat)) 0 2px;min-width:0}
body.big .stagecol{position:static}
@media (min-width:900px){.top{padding-left:16px;padding-right:12px}.wrap{padding-left:16px;padding-right:16px;gap:16px;grid-template-columns:minmax(0,1fr) 380px;align-items:start}.stagecol{top:12px;padding-top:0}body.big .stagecol{position:sticky}}
.stage{display:flex;justify-content:center}
#cv{display:block;border-radius:12px;background:#eee8dc;box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 28px rgba(29,38,34,.12);touch-action:manipulation}
#cv.drag{touch-action:none;cursor:move}
#cv.picking,#cv.drawing{cursor:crosshair;touch-action:none}
.hint{margin:4px 0 0;text-align:center;font-size:12px;color:var(--muted);min-height:16px}
.ctlcol{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.actions{display:flex;gap:6px}
.actions .btn{flex:1 1 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;height:32px;padding:0 10px;border-radius:8px;font-size:13px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;min-width:0;white-space:nowrap}
.btn span{overflow:hidden;text-overflow:ellipsis}
.actions .btn{padding:0 6px}
.btn:hover{border-color:var(--felt)}
.btn.primary{background:var(--felt);border-color:var(--felt);color:#fff}
.btn.primary:hover{background:var(--felt-d)}
.btn[disabled]{opacity:.5;cursor:default}
@media (max-width:360px){.actions .btn span{display:none}}
/* pill slider: Dot matrix, Halftone, Text share one switch; the green pill slides to the chosen one */
.pill{position:relative;display:grid;grid-template-columns:repeat(3,1fr);height:32px;border-radius:999px;background:var(--well);padding:2px}
.pill .knob{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/3);border-radius:999px;background:var(--felt);transform:translateX(calc(var(--i,0) * 100%));transition:transform .25s cubic-bezier(.3,0,.2,1)}
.pill [role=tab]{position:relative;z-index:1;border:0;background:none;border-radius:999px;font-weight:500;font-size:13px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.pill [role=tab][aria-selected=true]{color:#fff}
.pill [role=tab].cur::after{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.tabp{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:10px}
.ph{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:32px;padding:0 12px;border:0;background:none;cursor:pointer;font:400 15px/1.2 "Young Serif",Georgia,serif;text-align:left;border-radius:10px}
.ph .ico{color:var(--muted);transition:transform .2s}
.ph[aria-expanded="false"] .ico{transform:rotate(-90deg)}
.pb{padding:0 12px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.f{display:grid;gap:0}
.f>.lab{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.f>.lab output{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:26px;margin:0;accent-color:var(--felt);background:transparent}
select,textarea{width:100%;min-height:32px;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
textarea{resize:vertical;height:auto;padding:6px 8px;min-height:52px;line-height:1.3}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--card);gap:2px;margin:0;min-width:0;height:32px}
.seg legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg label{flex:1 1 0;min-width:0;position:relative;display:flex}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;min-height:26px;padding:0 4px;border-radius:7px;text-align:center;font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.seg input:checked+span{background:var(--felt);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--red);outline-offset:1px}
.color{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px}
.color input[type=color]{width:40px;height:32px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.color .sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.color .sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--felt)}
.icob{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:0 0 32px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;padding:0}
.icob[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:#fff}
.icob[disabled]{opacity:.4;cursor:default}
.chk{display:flex;align-items:center;gap:8px;min-height:32px;cursor:pointer;font-size:13px}
.chk input{width:18px;height:18px;accent-color:var(--felt)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row .btn{flex:1 1 auto}
/* text layers */
.layers{display:flex;gap:6px;align-items:center}
.chips{display:flex;gap:4px;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
.chip{flex:0 0 auto;max-width:130px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:#fff}
.status{min-height:18px;margin:0;font-size:13px;color:var(--felt)}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 0}
body:not([data-ht="ink"]) .ht-ink,body[data-ht="rgb"] .ht-paper{display:none!important}
body[data-path="none"] .p-any,body:not([data-path="arc"]) .p-arc,body:not([data-path="circle"]) .p-circle,body:not([data-path="wave"]) .p-wave{display:none!important}
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,26,24,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);border-radius:14px;padding:12px;max-width:640px;width:100%;display:grid;gap:8px}
.sheet h2{margin:0;font:400 18px/1.2 "Young Serif",Georgia,serif;display:flex;justify-content:space-between;align-items:center}
.sheet video{width:100%;border-radius:10px;background:#000;max-height:60vh;object-fit:contain}
#saveModal .sheet{max-width:380px}
@media (prefers-reduced-motion:reduce){.ph .ico,.pill .knob{transition:none}}
</style>
</head>
<body data-look="dot" data-ht="rgb" data-path="none">
<header class="top">
  <h1>Image Looks</h1>
  <a href="/works/" class="bento" aria-label="Projects" title="Projects"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.75" y="2.75" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="2.75" width="4.5" height="4.5" rx="1"/><rect x="16.75" y="2.75" width="4.5" height="4.5" rx="1"/><rect x="2.75" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="16.75" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="2.75" y="16.75" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="16.75" width="4.5" height="4.5" rx="1"/><rect x="16.75" y="16.75" width="4.5" height="4.5" rx="1"/></g></svg></a>
</header>

<main class="wrap">
  <section class="stagecol" aria-label="Preview">
    <div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Preview of the image look"></canvas></div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="ctlcol" aria-label="Settings">
    <div class="actions">
      <button type="button" class="btn" id="addImg" aria-label="Add image" title="Add image"><svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,16V158.75l-26.07-26.06a16,16,0,0,0-22.63,0l-20,20-44-44a16,16,0,0,0-22.62,0L40,149.37V56ZM40,172l52-52,80,80H40Zm176,28H194.63l-36-36,20-20L216,181.38V200ZM144,100a12,12,0,1,1,12,12A12,12,0,0,1,144,100Z"/></svg><span>Image</span></button>
      <button type="button" class="btn" id="takePhoto" aria-label="Take photo" title="Take photo"><svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M208,56H180.28L166.65,35.56A8,8,0,0,0,160,32H96a8,8,0,0,0-6.65,3.56L75.71,56H48A24,24,0,0,0,24,80V192a24,24,0,0,0,24,24H208a24,24,0,0,0,24-24V80A24,24,0,0,0,208,56Zm8,136a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V80a8,8,0,0,1,8-8H80a8,8,0,0,0,6.66-3.56L100.28,48h55.43l13.63,20.44A8,8,0,0,0,176,72h32a8,8,0,0,1,8,8ZM128,88a44,44,0,1,0,44,44A44.05,44.05,0,0,0,128,88Zm0,72a28,28,0,1,1,28-28A28,28,0,0,1,128,160Z"/></svg><span>Camera</span></button>
      <button type="button" class="btn" id="play" aria-label="Play reveal" title="Play reveal"><svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M232.4,114.49,88.32,26.35a16,16,0,0,0-16.2-.3A15.86,15.86,0,0,0,64,39.87V216.13A15.94,15.94,0,0,0,80,232a16.07,16.07,0,0,0,8.36-2.35L232.4,141.51a15.81,15.81,0,0,0,0-27ZM80,215.94V40l143.83,88Z"/></svg><span>Play</span></button>
      <button type="button" class="btn primary" id="saveOpen"><svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M224,144v64a8,8,0,0,1-8,8H40a8,8,0,0,1-8-8V144a8,8,0,0,1,16,0v56H208V144a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,124.69V32a8,8,0,0,0-16,0v92.69L93.66,98.34a8,8,0,0,0-11.32,11.32Z"/></svg><span>Save</span></button>
    </div>
    <input type="file" id="fileIn" accept="image/*" hidden>
    <input type="file" id="camIn" accept="image/*" capture="environment" hidden>

    <div class="pill" role="tablist" aria-label="Edit">
      <span class="knob" aria-hidden="true"></span>
      <button type="button" role="tab" id="t-dot" aria-controls="p-dot" data-tab="dot">Dot matrix</button>
      <button type="button" role="tab" id="t-half" aria-controls="p-half" data-tab="half">Halftone</button>
      <button type="button" role="tab" id="t-text" aria-controls="p-text" data-tab="text">Text</button>
    </div>

    <!-- Dot matrix -->
    <div class="tabp" role="tabpanel" id="p-dot" aria-labelledby="t-dot">
      <div class="acc">
        <button type="button" class="ph" aria-expanded="false" aria-controls="a-grid">Grid<svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg></button>
        <div class="pb" id="a-grid" hidden>
          <div class="f"><label class="lab" for="cols">Dots across <output data-for="cols"></output></label><input type="range" id="cols" min="12" max="160" step="1" data-k="cols"></div>
          <div class="f"><label class="lab" for="dmDot">Dot size <output data-for="dmDot"></output></label><input type="range" id="dmDot" min="20" max="100" step="1" data-k="dmDot"></div>
          <fieldset class="seg"><legend>Dot shape</legend>
            <label><input type="radio" name="dmShape" value="circle" data-k="dmShape"><span>Circle</span></label>
            <label><input type="radio" name="dmShape" value="square" data-k="dmShape"><span>Square</span></label>
          </fieldset>
        </div>
      </div>
      <div class="acc">
        <button type="button" class="ph" aria-expanded="false" aria-controls="a-reveal">Reveal<svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg></button>
        <div class="pb" id="a-reveal" hidden>
          <div class="f"><label class="lab" for="reveal">Reveal <output data-for="reveal"></output></label><input type="range" id="reveal" min="0" max="100" step="1" data-k="reveal"></div>
          <div class="f"><label class="lab" for="dir">Direction</label>
            <select id="dir" data-k="dir"><option value="lr">Left to right</option><option value="rl">Right to left</option><option value="tb">Top to bottom</option><option value="diag">Diagonal</option><option value="center">From center</option><option value="random">Random</option></select></div>
          <div class="f"><label class="lab" for="band">Fade band <output data-for="band"></output></label><input type="range" id="band" min="3" max="60" step="1" data-k="band"></div>
          <div class="f"><label class="lab" for="wash">Washout <output data-for="wash"></output></label><input type="range" id="wash" min="0" max="100" step="1" data-k="wash"></div>
          <div class="f"><label class="lab" for="scatter">Edge scatter <output data-for="scatter"></output></label><input type="range" id="scatter" min="0" max="60" step="1" data-k="scatter"></div>
          <div class="f"><label class="lab" for="revealTime">Reveal time <output data-for="revealTime"></output></label><input type="range" id="revealTime" min="1" max="8" step="0.5" data-k="revealTime"></div>
        </div>
      </div>
      <div class="acc">
        <button type="button" class="ph" aria-expanded="false" aria-controls="a-dmcolor">Color<svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg></button>
        <div class="pb" id="a-dmcolor" hidden>
          <div class="f"><label class="lab" for="palette">Start colors</label>
            <div class="row"><select id="palette" data-k="palette" style="flex:1"><option value="confetti">Confetti</option><option value="pastel">Pastel</option><option value="neon">Neon</option><option value="mono">Mono</option></select>
            <button type="button" class="icob" id="shuffle" aria-label="Shuffle start colors" title="Shuffle start colors"><svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M237.66,178.34a8,8,0,0,1,0,11.32l-24,24a8,8,0,0,1-11.32-11.32L212.69,192H200.94a72.12,72.12,0,0,1-58.59-30.15l-41.72-58.4A56.1,56.1,0,0,0,55.06,80H32a8,8,0,0,1,0-16H55.06a72.12,72.12,0,0,1,58.59,30.15l41.72,58.4A56.1,56.1,0,0,0,200.94,176h11.75l-10.35-10.34a8,8,0,0,1,11.32-11.32ZM143,107a8,8,0,0,0,11.16-1.86l1.2-1.67A56.1,56.1,0,0,1,200.94,80h11.75L202.34,90.34a8,8,0,0,0,11.32,11.32l24-24a8,8,0,0,0,0-11.32l-24-24a8,8,0,0,0-11.32,11.32L212.69,64H200.94a72.12,72.12,0,0,0-58.59,30.15l-1.2,1.67A8,8,0,0,0,143,107Zm-30,42a8,8,0,0,0-11.16,1.86l-1.2,1.67A56.1,56.1,0,0,1,55.06,176H32a8,8,0,0,0,0,16H55.06a72.12,72.12,0,0,0,58.59-30.15l1.2-1.67A8,8,0,0,0,113,149Z"/></svg></button></div></div>
          <div class="two">
            <div class="f"><label class="lab" for="dmSat">Saturation <output data-for="dmSat"></output></label><input type="range" id="dmSat" min="0" max="200" step="1" data-k="dmSat"></div>
            <div class="f"><label class="lab" for="dmCon">Contrast <output data-for="dmCon"></output></label><input type="range" id="dmCon" min="50" max="200" step="1" data-k="dmCon"></div>
          </div>
          <div class="f"><span class="lab" id="dmBgL">Background</span><div class="color" data-color="dmBg" data-label="dmBgL"></div></div>
        </div>
      </div>
    </div>

    <!-- Halftone -->
    <div class="tabp" role="tabpanel" id="p-half" aria-labelledby="t-half" hidden>
      <div class="acc">
        <button type="button" class="ph" aria-expanded="false" aria-controls="a-screen">Screen<svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg></button>
        <div class="pb" id="a-screen" hidden>
          <div class="f"><label class="lab" for="htCells">Dots across <output data-for="htCells"></output></label><input type="range" id="htCells" min="16" max="180" step="1" data-k="htCells"></div>
          <div class="f"><label class="lab" for="htAngle">Screen angle <output data-for="htAngle"></output></label><input type="range" id="htAngle" min="0" max="90" step="1" data-k="htAngle"></div>
          <fieldset class="seg"><legend>Dot shape</legend>
            <label><input type="radio" name="htShape" value="dot" data-k="htShape"><span>Dot</span></label>
            <label><input type="radio" name="htShape" value="square" data-k="htShape"><span>Square</span></label>
            <label><input type="radio" name="htShape" value="line" data-k="htShape"><span>Line</span></label>
          </fieldset>
          <div class="f"><label class="lab" for="htGain">Dot gain <output data-for="htGain"></output></label><input type="range" id="htGain" min="40" max="160" step="1" data-k="htGain"></div>
        </div>
      </div>
      <div class="acc">
        <button type="button" class="ph" aria-expanded="false" aria-controls="a-tone">Tone<svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg></button>
        <div class="pb" id="a-tone" hidden>
          <div class="two">
            <div class="f"><label class="lab" for="htCon">Contrast <output data-for="htCon"></output></label><input type="range" id="htCon" min="50" max="250" step="1" data-k="htCon"></div>
            <div class="f"><label class="lab" for="htLight">Lightness <output data-for="htLight"></output></label><input type="range" id="htLight" min="-50" max="50" step="1" data-k="htLight"></div>
          </div>
          <label class="chk"><input type="checkbox" data-k="htInvert">Invert</label>
        </div>
      </div>
      <div class="acc">
        <button type="button" class="ph" aria-expanded="false" aria-controls="a-htcolor">Color<svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg></button>
        <div class="pb" id="a-htcolor" hidden>
          <fieldset class="seg"><legend>Ink</legend>
            <label><input type="radio" name="htMode" value="rgb" data-k="htMode"><span>RGB</span></label>
            <label><input type="radio" name="htMode" value="ink" data-k="htMode"><span>One ink</span></label>
            <label><input type="radio" name="htMode" value="image" data-k="htMode"><span>Image</span></label>
            <label><input type="radio" name="htMode" value="cmyk" data-k="htMode"><span>CMYK</span></label>
          </fieldset>
          <div class="f ht-ink"><span class="lab" id="htInkL">Ink color</span><div class="color" data-color="htInk" data-label="htInkL"></div></div>
          <div class="f ht-paper"><span class="lab" id="htPaperL">Paper color</span><div class="color" data-color="htPaper" data-label="htPaperL"></div></div>
        </div>
      </div>
    </div>

    <!-- Text -->
    <div class="tabp" role="tabpanel" id="p-text" aria-labelledby="t-text" hidden>
      <div class="layers">
        <div class="chips" id="chips" role="group" aria-label="Text layers"></div>
        <button type="button" class="icob" id="lAdd" aria-label="Add a line of text" title="Add text"><svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/></svg></button>
        <button type="button" class="icob" id="lDup" aria-label="Duplicate this text" title="Duplicate"><svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M216,32H88a8,8,0,0,0-8,8V80H40a8,8,0,0,0-8,8V216a8,8,0,0,0,8,8H168a8,8,0,0,0,8-8V176h40a8,8,0,0,0,8-8V40A8,8,0,0,0,216,32ZM160,208H48V96H160Zm48-48H176V88a8,8,0,0,0-8-8H96V48H208Z"/></svg></button>
        <button type="button" class="icob" id="lDel" aria-label="Delete this text" title="Delete"><svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM96,40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8v8H96Zm96,168H64V64H192ZM112,104v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0v64a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Z"/></svg></button>
      </div>
      <div class="f"><label class="lab" for="ltext">Text</label><textarea id="ltext" rows="2" data-l="text" placeholder="Type something"></textarea></div>
      <div class="acc">
        <button type="button" class="ph" aria-expanded="false" aria-controls="a-type">Type<svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg></button>
        <div class="pb" id="a-type" hidden>
          <div class="two">
            <div class="f"><label class="lab" for="font">Font</label>
              <select id="font" data-l="font">
                <optgroup label="Sans serif"><option>Inter</option><option>Rubik</option><option>Space Grotesk</option><option>DM Sans</option><option>Archivo Black</option><option>Bebas Neue</option><option>Anton</option></optgroup>
                <optgroup label="Serif"><option>Young Serif</option><option>Playfair Display</option><option>DM Serif Display</option></optgroup>
                <optgroup label="Mono"><option>Space Mono</option></optgroup>
              </select></div>
            <div class="f"><label class="lab" for="weight">Weight</label><select id="weight" data-l="weight"></select></div>
          </div>
          <div class="f"><label class="lab" for="size">Size <output data-for="size"></output></label><input type="range" id="size" min="2" max="100" step="0.5" data-l="size"></div>
          <div class="f"><span class="lab" id="colorL">Fill color</span><div class="color" data-lcolor="color" data-label="colorL"></div></div>
          <div class="f"><label class="lab" for="op">Opacity <output data-for="op"></output></label><input type="range" id="op" min="0" max="100" step="1" data-l="op"></div>
          <fieldset class="seg"><legend>Text style</legend>
            <label><input type="radio" name="mode" value="solid" data-l="mode"><span>Solid</span></label>
            <label><input type="radio" name="mode" value="dots" data-l="mode"><span>Made of dots</span></label>
          </fieldset>
          <label class="chk"><input type="checkbox" data-l="upper">All caps</label>
        </div>
      </div>
      <div class="acc">
        <button type="button" class="ph" aria-expanded="false" aria-controls="a-char">Character<svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg></button>
        <div class="pb" id="a-char" hidden>
          <fieldset class="seg"><legend>Align</legend>
            <label><input type="radio" name="align" value="left" data-l="align"><span>Left</span></label>
            <label><input type="radio" name="align" value="center" data-l="align"><span>Center</span></label>
            <label><input type="radio" name="align" value="right" data-l="align"><span>Right</span></label>
          </fieldset>
          <div class="two">
            <div class="f"><label class="lab" for="track">Tracking <output data-for="track"></output></label><input type="range" id="track" min="-20" max="100" step="1" data-l="track"></div>
            <div class="f"><label class="lab" for="lead">Leading <output data-for="lead"></output></label><input type="range" id="lead" min="60" max="200" step="5" data-l="lead"></div>
            <div class="f"><label class="lab" for="hs">Horizontal scale <output data-for="hs"></output></label><input type="range" id="hs" min="30" max="250" step="1" data-l="hs"></div>
            <div class="f"><label class="lab" for="vs">Vertical scale <output data-for="vs"></output></label><input type="range" id="vs" min="30" max="250" step="1" data-l="vs"></div>
            <div class="f"><label class="lab" for="rot">Rotate <output data-for="rot"></output></label><input type="range" id="rot" min="-180" max="180" step="1" data-l="rot"></div>
            <div class="f"><label class="lab" for="skew">Skew <output data-for="skew"></output></label><input type="range" id="skew" min="-45" max="45" step="1" data-l="skew"></div>
            <div class="f"><label class="lab" for="shift">Baseline shift <output data-for="shift"></output></label><input type="range" id="shift" min="-100" max="100" step="1" data-l="shift"></div>
          </div>
          <div class="two">
            <div class="f"><label class="lab" for="tx">Across <output data-for="tx"></output></label><input type="range" id="tx" min="0" max="100" step="0.5" data-l="tx"></div>
            <div class="f"><label class="lab" for="ty">Down <output data-for="ty"></output></label><input type="range" id="ty" min="0" max="100" step="0.5" data-l="ty"></div>
          </div>
        </div>
      </div>
      <div class="acc">
        <button type="button" class="ph" aria-expanded="false" aria-controls="a-path">Type on a path<svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg></button>
        <div class="pb" id="a-path" hidden>
          <div class="f"><label class="lab" for="path">Path</label>
            <select id="path" data-l="path"><option value="none">None</option><option value="arc">Arc</option><option value="circle">Circle</option><option value="wave">Wave</option><option value="custom">Drawn path</option></select></div>
          <button type="button" class="btn" id="drawPath" aria-pressed="false"><svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M227.32,73.37,182.63,28.69a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H216a8,8,0,0,0,0-16H115.32l112-112A16,16,0,0,0,227.32,73.37ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.69,147.32,64l24-24L216,84.69Z"/></svg><span>Draw a path on the image</span></button>
          <div class="f p-arc"><label class="lab" for="bend">Bend <output data-for="bend"></output></label><input type="range" id="bend" min="-100" max="100" step="1" data-l="bend"></div>
          <div class="f p-circle"><label class="lab" for="radius">Radius <output data-for="radius"></output></label><input type="range" id="radius" min="5" max="60" step="0.5" data-l="radius"></div>
          <div class="two p-wave">
            <div class="f"><label class="lab" for="waveA">Wave height <output data-for="waveA"></output></label><input type="range" id="waveA" min="0" max="30" step="0.5" data-l="waveA"></div>
            <div class="f"><label class="lab" for="waveF">Waves <output data-for="waveF"></output></label><input type="range" id="waveF" min="0.5" max="8" step="0.5" data-l="waveF"></div>
          </div>
          <div class="f p-any"><label class="lab" for="start">Start <output data-for="start"></output></label><input type="range" id="start" min="-50" max="50" step="0.5" data-l="start"></div>
          <div class="two p-any">
            <div class="f"><label class="lab" for="effect">Effect</label>
              <select id="effect" data-l="effect"><option value="rainbow">Rainbow</option><option value="skew">Skew</option><option value="ribbon">3D Ribbon</option><option value="stair">Stair Step</option></select></div>
            <div class="f"><label class="lab" for="pathAlign">Align to path</label>
              <select id="pathAlign" data-l="pathAlign"><option value="baseline">Baseline</option><option value="center">Center</option><option value="ascender">Ascender</option><option value="descender">Descender</option></select></div>
          </div>
          <label class="chk p-any"><input type="checkbox" data-l="flip">Flip to the other side</label>
        </div>
      </div>
      <div class="acc">
        <button type="button" class="ph" aria-expanded="false" aria-controls="a-app">Appearance<svg class="ico" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg></button>
        <div class="pb" id="a-app" hidden>
          <label class="chk"><input type="checkbox" data-l="fill">Fill</label>
          <div class="f"><label class="lab" for="strokeW">Stroke <output data-for="strokeW"></output></label><input type="range" id="strokeW" min="0" max="30" step="0.5" data-l="strokeW"></div>
          <div class="f"><span class="lab" id="strokeL">Stroke color</span><div class="color" data-lcolor="strokeC" data-label="strokeL"></div></div>
          <div class="f"><label class="lab" for="shadow">Drop shadow <output data-for="shadow"></output></label><input type="range" id="shadow" min="0" max="100" step="1" data-l="shadow"></div>
          <div class="f"><label class="lab" for="blend">Blend mode</label>
            <select id="blend" data-l="blend"><option value="source-over">Normal</option><option value="multiply">Multiply</option><option value="screen">Screen</option><option value="overlay">Overlay</option><option value="soft-light">Soft light</option><option value="difference">Difference</option><option value="color-dodge">Color dodge</option></select></div>
        </div>
      </div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="foot">Photos stay on your device. Nothing is uploaded.</p>
  </section>
</main>

function colorGet(box) { return box.dataset.color ? S[box.dataset.color] : AL()[box.dataset.lcolor]; }
function buildColor(box) {
  var lab = box.dataset.label;
  var inp = document.createElement("input"); inp.type = "color"; inp.setAttribute("aria-labelledby", lab);
  inp.addEventListener("input", function () { setColor(box, inp.value); });
  box.appendChild(inp);
  var pick = document.createElement("button"); pick.type = "button"; pick.className = "icob pick"; pick.setAttribute("aria-pressed", "false");
  pick.setAttribute("aria-label", "Pick " + document.getElementById(lab).textContent.toLowerCase() + " from the image"); pick.title = "Pick from image";
  pick.appendChild($("#icoPick").content.cloneNode(true));
  pick.addEventListener("click", function () {
    pickKey = pickKey === box ? null : box;
    document.querySelectorAll(".pick").forEach(function (b) { b.setAttribute("aria-pressed", b === pick && pickKey ? "true" : "false"); });
    cv.classList.toggle("picking", !!pickKey);
    if (pickKey) setDraw(false);
    draw();
  });
  box.appendChild(pick);
  SWATCHES.forEach(function (c) {
    var b = document.createElement("button"); b.type = "button"; b.className = "sw"; b.style.background = c;
    b.dataset.c = c; b.setAttribute("aria-label", "Color " + c); b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () { setColor(box, c); });
    box.appendChild(b);
  });
}
function syncColor(box) {
  var v = colorGet(box);
  box.querySelector("input").value = v;
  box.querySelectorAll(".sw").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.c === v.toLowerCase() ? "true" : "false"); });
}
function setColor(box, v) {
  v = v.toLowerCase();
  if (box.dataset.color) S[box.dataset.color] = v; else AL()[box.dataset.lcolor] = v;
  syncColor(box); saveSettings(); schedule();
}
document.querySelectorAll("[data-color],[data-lcolor]").forEach(buildColor);

/* accordions: all closed to start */
document.querySelectorAll(".ph").forEach(function (b) {
  b.addEventListener("click", function () {
    var open = b.getAttribute("aria-expanded") !== "true";
    b.setAttribute("aria-expanded", open); document.getElementById(b.getAttribute("aria-controls")).hidden = !open;
  });
});

/* ---------- text layers ---------- */
function renderChips() {
  var box = $("#chips"); box.innerHTML = "";
  S.layers.forEach(function (l, i) {
    var b = document.createElement("button"); b.type = "button"; b.className = "chip";
    b.textContent = (l.text.trim().split("\n")[0] || "Empty text").slice(0, 24);
    b.setAttribute("aria-pressed", i === S.active ? "true" : "false");
    b.setAttribute("aria-label", "Text " + (i + 1) + ": " + b.textContent);
    b.addEventListener("click", function () { select(i); });
    box.appendChild(b);
  });
  $("#lDel").disabled = S.layers.length < 2 && !AL().text;
  $("#lAdd").disabled = $("#lDup").disabled = S.layers.length >= 12;
}
function select(i) { S.active = i; syncLayer(); saveSettings(); schedule(); }
$("#lAdd").addEventListener("click", function () {
  var prev = AL();
  S.layers.push(newLayer({ text: "New text", font: prev.font, weight: prev.weight, color: prev.color, size: Math.min(prev.size, 9),
    ty: prev.ty > 50 ? Math.max(8, prev.ty - 14) : Math.min(92, prev.ty + 14) }));
  select(S.layers.length - 1);
  var t = $("#ltext"); t.focus(); t.select();
});
$("#lDup").addEventListener("click", function () {
  var c = JSON.parse(JSON.stringify(AL(), function (k, v) { return k.charAt(0) === "_" ? undefined : v; }));
  c.tx = Math.min(100, c.tx + 3); c.ty = Math.min(100, c.ty + 3);
  S.layers.splice(S.active + 1, 0, newLayer(c)); select(S.active + 1);
});
$("#lDel").addEventListener("click", function () {
  if (S.layers.length < 2) { S.layers[0].text = ""; select(0); return; }
  S.layers.splice(S.active, 1); select(Math.max(0, S.active - 1));
});

/* draw a path for the chosen text */
function setDraw(on) {
  drawMode = on; stroke = null;
  $("#drawPath").setAttribute("aria-pressed", on);
  if (on && pickKey) { pickKey = null; document.querySelectorAll(".pick").forEach(function (b) { b.setAttribute("aria-pressed", "false"); }); cv.classList.remove("picking"); }
  draw();
}
$("#drawPath").addEventListener("click", function () { setDraw(!drawMode); });
function finishPath() {
  var p = stroke; stroke = null; setDraw(false);
  if (!p || p.length < 4) return;
  /* smooth, then thin to at most 200 points */
  var sm = p.map(function (q, i) {
    var a = p[Math.max(0, i - 2)], b = p[Math.min(p.length - 1, i + 2)];
    return [(a[0] + q[0] * 2 + b[0]) / 4, (a[1] + q[1] * 2 + b[1]) / 4];
  });
  var step = Math.max(1, Math.ceil(sm.length / 200)), th = sm.filter(function (q, i) { return i % step === 0 || i === sm.length - 1; });
  var L = AL(), o = th[0];
  L.tx = Math.round(o[0] * 1000) / 10; L.ty = Math.round(o[1] * 1000) / 10;
  L.pts = th.map(function (q) { return [q[0] - o[0], q[1] - o[1]]; });
  L.path = "custom"; L.rot = 0; L.align = "left"; L.start = 0;
  syncLayer(); saveSettings(); schedule();
}

/* ---------- canvas gestures ---------- */
/* drag moves the text under the finger (a tap does not), two fingers size and turn it, double tap toggles full width */
var pts = new Map(), down = null, dragging = false, pinch = null, lastTap = 0;
function fr(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; }
function hit(p) {
  var pad = 0.03;
  for (var i = S.layers.length - 1; i >= 0; i--) {
    var b = S.layers[i]._box;
    if (b && p[0] >= b[0] - pad && p[0] <= b[2] + pad && p[1] >= b[1] - pad && p[1] <= b[3] + pad) return i;
  }
  return -1;
}
function toggleBig() { big = !big; fit(); }
cv.addEventListener("pointerdown", function (e) {
  var p = fr(e);
  if (pickKey) {
    var px = clamp(Math.floor(p[0] * src.width), 0, src.width - 1), py = clamp(Math.floor(p[1] * src.height), 0, src.height - 1);
    var c = sctx.getImageData(px, py, 1, 1).data, box = pickKey;
    pickKey = null;
    document.querySelectorAll(".pick").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
    cv.classList.remove("picking");
    setColor(box, toHex(c[0], c[1], c[2])); draw();
    return;
  }
  cv.setPointerCapture(e.pointerId);
  if (drawMode) { stroke = [p]; e.preventDefault(); return; }
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) {
    var a = Array.from(pts.values()), L = AL();
    pinch = { d: Math.hypot(a[1][0] - a[0][0], a[1][1] - a[0][1]), a: Math.atan2(a[1][1] - a[0][1], a[1][0] - a[0][0]), size: L.size, rot: L.rot };
    dragging = false; lastTap = 0;
    e.preventDefault();
    return;
  }
  var i = hit(p);
  if (i >= 0 && i !== S.active) select(i);
  var L2 = AL();
  down = { x: e.clientX, y: e.clientY, tx: L2.tx, ty: L2.ty, on: i >= 0 };
  dragging = false;
  if (i >= 0) e.preventDefault();
});
cv.addEventListener("pointermove", function (e) {
  if (drawMode && stroke) { stroke.push(fr(e)); draw(); return; }
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  var L = AL();
  if (pinch && pts.size === 2) {
    var a = Array.from(pts.values());
    var d = Math.hypot(a[1][0] - a[0][0], a[1][1] - a[0][1]), an = Math.atan2(a[1][1] - a[0][1], a[1][0] - a[0][0]);
    L.size = Math.round(clamp(pinch.size * d / pinch.d, 2, 100) * 2) / 2;
    L.rot = Math.round(((pinch.rot + (an - pinch.a) * 180 / Math.PI + 540) % 360) - 180);
    $("#size").value = L.size; $("#rot").value = L.rot; out("size", L.size); out("rot", L.rot);
    schedule(); return;
  }
  if (!down || !down.on) return;
  if (!dragging && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) dragging = true;
  if (dragging) {
    var r = cv.getBoundingClientRect();
    L.tx = Math.round(clamp(down.tx + (e.clientX - down.x) / r.width * 100, 0, 100) * 2) / 2;
    L.ty = Math.round(clamp(down.ty + (e.clientY - down.y) / r.height * 100, 0, 100) * 2) / 2;
    $("#tx").value = L.tx; $("#ty").value = L.ty; out("tx", L.tx); out("ty", L.ty);
    schedule();
  }
});
function up(e) {
  if (drawMode && stroke) { if (e.type === "pointerup") finishPath(); else { stroke = null; draw(); } return; }
  pts.delete(e.pointerId);
  if (pinch) { if (pts.size < 2) { pinch = null; down = null; saveSettings(); } return; }
  if (!down) return;
  var was = dragging; down = null; dragging = false;
  if (was) { saveSettings(); lastTap = 0; return; }
  if (e.type !== "pointerup") return;
  var now = performance.now();
  if (now - lastTap < 350) { lastTap = 0; toggleBig(); } else lastTap = now;
}
cv.addEventListener("pointerup", up);
cv.addEventListener("pointercancel", up);
cv.addEventListener("dblclick", function (e) { e.preventDefault(); });

/* ---------- buttons ---------- */
$("#addImg").addEventListener("click", function () { $("#fileIn").click(); });
$("#takePhoto").addEventListener("click", openCamera);
$("#fileIn").addEventListener("change", function (e) { loadFile(e.target.files[0]); e.target.value = ""; });
$("#camIn").addEventListener("change", function (e) { loadFile(e.target.files[0]); e.target.value = ""; });
$("#play").addEventListener("click", play);
$("#saveOpen").addEventListener("click", function () { openModal("#saveModal", "#savePng"); });
$("#saveClose").addEventListener("click", function () { closeModal("#saveModal"); });
$("#savePng").addEventListener("click", savePng);
$("#saveSvg").addEventListener("click", saveSvg);
$("#share").addEventListener("click", share);
$("#saveVideo").addEventListener("click", saveVideo);
$("#shuffle").addEventListener("click", function () { S.seed = (Math.random() * 1e6) | 0; saveSettings(); schedule(); });
$("#reset").addEventListener("click", function () {
  S = Object.assign({}, DEF, { layers: [newLayer()] }); sync(); setTab("dot"); saveSettings(); allFonts().then(schedule);
  closeModal("#saveModal"); say("Settings reset.");
});
$("#snap").addEventListener("click", snap);
$("#camCancel").addEventListener("click", closeCamera);
$("#flip").addEventListener("click", function () { facing = facing === "user" ? "environment" : "user"; startStream().catch(function () {}); });
trap("#camModal", closeCamera);
trap("#saveModal", function () { closeModal("#saveModal"); });

/* ---------- start ---------- */
try {
  var probe = new File([new Blob(["x"], { type: "image/png" })], "x.png", { type: "image/png" });
  $("#share").hidden = !(navigator.canShare && navigator.canShare({ files: [probe] }));
} catch (e) {}
sync();
setTab(S.look);
if (window.ResizeObserver) new ResizeObserver(function () { fit(); }).observe(stage);
window.addEventListener("resize", fit);
demo();
allFonts().then(schedule);
})();
</script>
