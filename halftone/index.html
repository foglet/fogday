<style>
:root{--paper:#ffffff;--ink:#1d1d1d;--muted:#5e5e5e;--felt:#1f5c4a;--felt-d:#164536;--red:#b8352b;--line:#dcdcdc;--card:#ffffff;--well:#efefef;--field:#ffffff;--onfelt:#ffffff;--stagebg:#efefef;color-scheme:light;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}

.topr{display:flex;align-items:center;gap:2px}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:6px;margin:0;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:8px}
.theme-toggle svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle .icon-sun{display:none}
.theme-toggle:hover .icon-moon path{fill:currentColor}
:root[data-theme="dark"] .theme-toggle .icon-moon{display:none}
:root[data-theme="dark"] .theme-toggle .icon-sun{display:block}
:root[data-theme="dark"] .theme-toggle:hover{color:#ffe680}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.35 "Rubik",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.ico{width:16px;height:16px;flex:0 0 16px;display:block}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1180px;margin:0 auto;
  padding:calc(6px + var(--sat)) calc(2.5vw + var(--sar) - 4px) 2px calc(2.5vw + var(--sal))}

.wrap{max-width:1180px;margin:0 auto;padding:4px calc(2.5vw + var(--sar)) calc(24px + var(--sab)) calc(2.5vw + var(--sal));display:grid;grid-template-columns:minmax(0,1fr);gap:8px}

@media (min-width:900px){.top{padding-left:16px;padding-right:12px}.wrap{padding-left:16px;padding-right:16px;gap:16px;grid-template-columns:minmax(0,1fr) 380px;align-items:start}.stagecol{top:12px;padding-top:0}body.big .stagecol{position:sticky}}
.stage{display:flex;justify-content:center}
#cv{display:block;border-radius:12px;background:var(--stagebg);box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 28px rgba(29,38,34,.12);touch-action:manipulation}

.tools{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:6px auto 0;max-width:100%}

.stage.drop #cv{outline:3px dashed var(--felt);outline-offset:4px}
.looks{display:flex;flex-wrap:wrap;gap:6px}
.looks::-webkit-scrollbar{display:none}
.ph.mod::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--felt);margin-left:8px;margin-right:auto}

/* touch screens: 44 px tap targets */
@media (pointer:coarse){
  .btn,.icob,.chip,select,.ph,.linkb{min-height:44px;height:44px}
  .icob{width:44px;flex-basis:44px}
  .pill,.seg{height:44px}.seg span{min-height:38px}
  .color .sw{width:34px;height:34px}.color input[type=color]{height:44px;width:48px}
  .chk{min-height:44px}
  input[type=range]{height:36px}
  .preset{width:40px;height:40px;right:44px;padding:10px}.acc>.ph>.ico{top:14px}
}
.ctlcol{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.actions{display:flex;gap:6px}
.actions .btn{flex:1 1 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;height:32px;padding:0 10px;border-radius:8px;font-size:13px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;min-width:0;white-space:nowrap}
.btn span{overflow:hidden;text-overflow:ellipsis}
.actions .btn{padding:0 6px}
.btn:hover{border-color:var(--felt)}
.btn.primary{background:var(--felt);border-color:var(--felt);color:var(--onfelt)}
.btn.primary:hover{background:var(--felt-d)}
.btn[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--onfelt)}
.btn[disabled]{opacity:.5;cursor:default}
@media (max-width:360px){.actions .btn span{display:none}}
/* pill slider: Dot matrix, Halftone, Text share one switch; the green pill slides to the chosen one */
.tabrow{display:flex;gap:6px;align-items:center}.tabrow .pill{flex:1;min-width:0}
.pill{position:relative;display:grid;grid-template-columns:repeat(3,1fr);height:32px;border-radius:999px;background:var(--well);padding:2px}
.pill .knob{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/3);border-radius:999px;background:var(--felt);transform:translateX(calc(var(--i,0) * 100%));transition:transform .25s cubic-bezier(.3,0,.2,1)}
.pill [role=tab]{position:relative;z-index:1;border:0;background:none;border-radius:999px;font-weight:500;font-size:13px;white-space:nowrap;padding:0 2px;min-width:0;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.pill [role=tab][aria-selected=true]{color:var(--onfelt);background:var(--felt);transition:background 0s .25s}
.pill [role=tab].cur::after{content:"";flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.tabp{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.acc{background:var(--card);border:1px solid var(--line);border-radius:10px;position:relative}
.acc>.ph{padding-right:80px}.acc>.ph>.ico{position:absolute;right:12px;top:8px}
.preset{position:absolute;top:2px;right:34px;width:28px;height:28px;padding:5px;border:0;background:none;color:var(--muted);border-radius:6px;cursor:pointer}
.preset:hover{color:var(--ink);background:var(--well)}.preset .ico{width:18px;height:18px}
.acc>.ph[aria-expanded="false"]~.preset{display:none}
.ph{display:flex;align-items:center;justify-content:flex-start;width:100%;min-height:32px;padding:0 12px;border:0;background:none;cursor:pointer;font:400 15px/1.2 "Young Serif",Georgia,serif;text-align:left;border-radius:10px}
.ph .ico{color:var(--muted);transition:transform .2s}
.ph[aria-expanded="false"] .ico{transform:rotate(-90deg)}
.ph[aria-expanded="true"]{box-shadow:inset 0 -1px 0 var(--line);border-radius:10px 10px 0 0;margin-bottom:8px}
.pb{padding:0 12px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.f{display:grid;gap:0}
.f>.lab{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.f>.lab output{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:26px;margin:0;accent-color:var(--felt);background:transparent}
select,textarea{width:100%;min-height:32px;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--field);font-size:13px}
textarea{resize:vertical;height:auto;padding:6px 8px;min-height:52px;line-height:1.3}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--card);gap:2px;margin:0;min-width:0;height:32px}
.seg legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg label{flex:1 1 0;min-width:0;position:relative;display:flex}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{flex:1;display:flex;align-items:center;justify-content:center;min-height:26px;padding:0 4px;border-radius:7px;text-align:center;font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.seg input:checked+span{background:var(--felt);color:var(--onfelt)}
.seg input:focus-visible+span{outline:3px solid var(--red);outline-offset:1px}
.color{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px}
.color input[type=color]{width:40px;height:32px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer}
.color .sw{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.color .sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--felt)}
.icob{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:0 0 32px;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer;padding:0}
.icob[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--onfelt)}
.icob[disabled]{opacity:.4;cursor:default}
.chk{display:flex;align-items:center;gap:8px;min-height:32px;cursor:pointer;font-size:13px}
.chk input{width:18px;height:18px;accent-color:var(--felt)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row .btn{flex:1 1 auto}
/* text layers */
.chips{display:flex;gap:4px;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
.chip{flex:0 0 auto;max-width:130px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--field);cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip[aria-pressed="true"]{background:var(--felt);border-color:var(--felt);color:var(--onfelt)}
.status{min-height:18px;margin:0;font-size:13px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin:4px 0 0}
body:not([data-ht="ink"]) .ht-ink,body[data-ht="rgb"] .ht-paper{display:none!important}
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,26,24,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 24px 64px rgba(0,0,0,.35);max-width:640px;width:100%;display:grid;gap:8px}
.sheet h2{margin:0;font:400 18px/1.2 "Young Serif",Georgia,serif;display:flex;justify-content:space-between;align-items:center}
.sheet video{width:100%;border-radius:10px;background:#000;max-height:60vh;object-fit:contain}
#saveModal .sheet{max-width:380px}
@media (max-width:420px){.pill [role=tab]{font-size:12px;gap:3px}}
@media (prefers-reduced-motion:reduce){.ph .ico,.pill .knob{transition:none}}
/* ===== Affinity-style skin: charcoal panels, flat grey buttons, cyan persona switch, text tabs, inset value fields ===== */
:root{--paper:#e9e9e9;--bar:#dedede;--card:#f4f4f4;--well:#cfcfcf;--field:#ffffff;--btn:#d6d6d6;--btnh:#cbcbcb;--sel:#ffffff;
  --ink:#1c1c1c;--muted:#5a5a5a;--line:#c6c6c6;--sep:#c2c2c2;--felt:#2fb4d3;--felt-d:#25a0bd;--onfelt:#0e0e0e;--accent:#2fb4d3;--stagebg:#d9d9d9}
:root[data-theme="dark"]{--paper:#2b2b2b;--bar:#2f2f2f;--card:#333333;--well:#1d1d1d;--field:#1a1a1a;--btn:#5a5a5a;--btnh:#666666;--sel:#4b4b4b;
  --ink:#ececec;--muted:#bdbdbd;--line:#1f1f1f;--sep:#1c1c1c;--felt:#5bc9e1;--felt-d:#4bb8d0;--onfelt:#0e0e0e;--accent:#5bc9e1;--stagebg:#232323}
html,body{font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif}
h1,.ph,.sheet h2{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif}
h1{font-weight:600;font-size:17px;letter-spacing:0}
.top{background:var(--bar);max-width:none;border-bottom:1px solid var(--sep);padding-top:calc(6px + var(--sat));padding-bottom:6px}
.wrap{padding-top:10px}
#cv{border-radius:4px;box-shadow:0 0 0 1px var(--sep),0 10px 30px rgba(0,0,0,.25)}
.stagecol{background:var(--paper)}
/* flat grey buttons, like Document Setup… */
.btn{background:var(--btn);border:0;border-radius:6px;font-weight:500}
.btn:hover{background:var(--btnh);border:0}
.btn.primary{background:var(--btn);color:var(--ink)}
.btn.primary:hover{background:var(--btnh)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--onfelt)}
.icob{background:transparent;border:0;border-radius:6px;color:var(--ink)}
.icob:hover{background:var(--btn)}
.icob[aria-pressed="true"]{background:var(--sel);color:var(--ink)}
/* persona switch: dark capsule, cyan pill on the chosen look */
.pill{height:40px;border-radius:14px;background:var(--well);padding:4px}
.pill .knob{top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:11px;background:var(--accent)}
.pill [role=tab]{font-size:14px;font-weight:600;color:var(--muted);border-radius:11px;gap:7px}
.pill [role=tab] .ico{width:18px;height:18px;flex-basis:18px}
.pill [role=tab][aria-selected=true]{color:var(--onfelt)}
.tabrow #tabReset{width:40px;height:40px;flex-basis:40px;background:var(--well)}
/* one panel per tab with text tabs across the top (Color · Swatches · Stroke …) */
.panel{background:var(--card);border:1px solid var(--sep);border-radius:8px;overflow:hidden}
.ptabs{display:flex;align-items:center;gap:2px;padding:6px 6px 6px 10px;border-bottom:1px solid var(--sep);background:var(--bar)}
.ptabs .grip{width:4px;height:20px;border-radius:2px;background:var(--btn);margin-right:8px;flex:0 0 4px}
.ptab{border:0;background:none;color:var(--muted);font-size:14px;font-weight:500;padding:4px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;position:relative}
.ptab:hover{color:var(--ink)}
.ptab[aria-selected=true]{background:var(--sel);color:var(--ink);font-weight:600}
.ptab.mod::after{content:"";position:absolute;top:4px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.ptabs .pr{margin-left:auto;width:28px;height:26px;flex:0 0 28px;border:1px solid var(--muted);border-radius:6px;background:none;color:var(--ink);padding:3px;cursor:pointer;opacity:.85}
.ptabs .pr:hover{opacity:1;background:var(--btn)}
.panel .acc{border:0;border-radius:0;background:none}
.panel .acc>.ph,.panel .acc>.preset{display:none}
.panel .pb{padding:12px 12px 12px}
/* "Opacity: [100 %]" — values in dark inset boxes */
.f>.lab{align-items:center;font-size:13px;color:var(--ink)}
.f>.lab output{background:var(--field);border-radius:5px;padding:3px 8px;min-width:58px;text-align:right;color:var(--ink);font-size:13px}
input[type=range]{accent-color:var(--accent)}
select,.icob.pick{background:var(--field)}
select{border:0;border-radius:5px}
.seg{background:var(--well);border:0;border-radius:8px}
.seg input:checked+span{background:var(--sel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.chip{background:var(--btn);border:0;border-radius:6px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--onfelt)}
.chk input{accent-color:var(--accent)}
.color input[type=color]{background:var(--field);border:0}
.sheet{background:var(--card);border:1px solid var(--sep)}
@media (pointer:coarse){.pill{height:48px}.tabrow #tabReset{width:48px;height:48px}.ptab{padding:8px 12px}}
@media (max-width:420px){.pill [role=tab] .ico{display:none}.ptab{font-size:13px;padding:4px 8px}}
</style>
</head>

    draw(ease(clamp(t / dur, 0, 1)));
    playing = requestAnimationFrame(frame);
  })(t0);
});
$("#bigBtn").addEventListener("click", toggleBig);

/* ---------- drop or paste a photo ---------- */
var dropN = 0;
document.addEventListener("dragenter", function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, "Files") >= 0) { dropN++; stage.classList.add("drop"); } });
document.addEventListener("dragleave", function () { if (--dropN <= 0) { dropN = 0; stage.classList.remove("drop"); } });
document.addEventListener("dragover", function (e) { e.preventDefault(); });
document.addEventListener("drop", function (e) {
  e.preventDefault(); dropN = 0; stage.classList.remove("drop");
  var f = e.dataTransfer && e.dataTransfer.files[0];
  if (f && /^image\//.test(f.type)) loadFile(f); else if (f) say("That file is not an image.");
});
document.addEventListener("paste", function (e) {
  var items = (e.clipboardData && e.clipboardData.items) || [];
  for (var i = 0; i < items.length; i++) if (/^image\//.test(items[i].type)) { loadFile(items[i].getAsFile()); e.preventDefault(); return; }
});

/* panels: each tab's sections become one panel with text tabs across the top, like Affinity's Color · Swatches · Stroke.
   The reset icon at the right of the tab strip resets the section that is showing. */
document.querySelectorAll(".tabp").forEach(function (tp) {
  var accs = Array.prototype.slice.call(tp.querySelectorAll(".acc"));
  if (!accs.length) return;
  var panel = document.createElement("div"); panel.className = "panel";
  var bar = document.createElement("div"); bar.className = "ptabs"; bar.setAttribute("role", "tablist");
  var grip = document.createElement("span"); grip.className = "grip"; grip.setAttribute("aria-hidden", "true"); bar.appendChild(grip);
  accs[0].before(panel); panel.appendChild(bar);
  var cur = 0, btns = [];
  var pr = document.createElement("button"); pr.type = "button"; pr.className = "pr";
  pr.appendChild($("#icoReset").content.cloneNode(true));
  pr.addEventListener("click", function () { resetPanel(accs[cur].querySelector(".pb")); });
  function show(i) {
    cur = i;
    accs.forEach(function (acc, k) {
      acc.hidden = k !== i;
      var ph = acc.querySelector(".ph"), pb = acc.querySelector(".pb");
      ph.setAttribute("aria-expanded", k === i ? "true" : "false"); pb.hidden = k !== i;
      btns[k].setAttribute("aria-selected", k === i ? "true" : "false"); btns[k].tabIndex = k === i ? 0 : -1;
    });
    var name = btns[i].textContent;
    pr.setAttribute("aria-label", "Reset " + name); pr.title = "Reset " + name;
  }
  accs.forEach(function (acc, i) {
    var ph = acc.querySelector(".ph"), pb = acc.querySelector(".pb");
    var b = document.createElement("button"); b.type = "button"; b.className = "ptab"; b.setAttribute("role", "tab");
    b.textContent = ph.firstChild.textContent.trim(); b.id = "pt-" + pb.id; b.setAttribute("aria-controls", pb.id);
    pb.setAttribute("role", "tabpanel"); pb.setAttribute("aria-labelledby", b.id);
    acc.dataset.tabBtn = b.id;
    b.addEventListener("click", function () { show(i); });
    b.addEventListener("keydown", function (e) {
      var d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0; if (!d) return;
      e.preventDefault(); var n = (i + d + accs.length) % accs.length; show(n); btns[n].focus();
    });
    btns.push(b); bar.appendChild(b); panel.appendChild(acc);
  });
  bar.appendChild(pr);
  show(0);
});

} catch (e) {}

window.addEventListener("resize", fit);
demo();
})();
