<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf8f1">
<title>Tone Pairs | fogday</title>
<meta name="description" content="Practice Mandarin tones, one two-character word at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&family=Noto+Serif+SC:wght@500&family=Noto+Sans+SC:wght@500&family=Zhi+Mang+Xing&family=Liu+Jian+Mao+Cao&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"zhcy kai";src:url(/zhcy/fonts/lxgw-wenkai-zhcy.woff2) format("woff2");font-display:swap}
@font-face{font-family:"zhcy ou";src:url(/zhcy/fonts/ar-pl-ukai-cn-zhcy.woff2) format("woff2");font-display:swap}
:root{color-scheme:light;--paper:#fbf8f1;--ink:#1d2421;--muted:#5f6b66;--green:#1f5c4a;--tint:#e6f0ea;--line:#d9d3c4;--red:#e34234}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:1rem/1.5 Rubik,system-ui,sans-serif}button{font:inherit;color:inherit}a{color:inherit;text-decoration:none}.wrap{width:100%;max-width:34rem;margin:auto;padding:0 16px}.top{min-height:52px;display:flex;align-items:center}.brand{display:flex;align-items:center;gap:8px;flex:1}.seal{width:34px;height:34px;border-radius:8px;background:var(--red);color:#fffdf7;display:grid;place-items:center;font:500 1.25rem 'Noto Serif SC',serif}.brand b{font-size:1.125rem;text-transform:uppercase;letter-spacing:.06em}.brand small{color:var(--muted);font-size:1rem}.projects{color:var(--muted);padding:10px}.projects svg,.icon svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}main{flex:1;display:flex;flex-direction:column}.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0}.progress{text-align:center;color:var(--muted);font-size:.875rem;margin:0 0 22px}.words{display:flex;flex-direction:column;align-items:center;justify-content:center}.character-pinyin{color:var(--green);font:.875rem/1.5 Rubik,system-ui,sans-serif;margin-top:4px}.character-zhuyin{color:var(--green);font:1.125rem/1.5 system-ui,sans-serif;margin-top:4px}.meaning{font-size:1rem;color:var(--ink);text-align:center;margin-top:8px}.character:focus{outline:none;box-shadow:none}.char-column{display:flex;flex-direction:column;align-items:center;min-width:1.15em}.character{display:flex;justify-content:center;align-items:flex-start;border:0;background:transparent;color:var(--ink);font-family:"Songti SC","Noto Serif SC",serif;font-size:clamp(5rem,23vw,8rem);line-height:1.2;padding:12px;cursor:pointer;border-radius:14px}.word{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:12px;width:100%;padding:9px 4px;border:0;background:transparent;text-align:left;border-radius:10px;cursor:pointer}.word:hover{background:#f3efe4}.emoji{font-size:1.4rem;text-align:center}.hanzi{font-family:'Songti SC','Noto Serif SC',serif;font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.2}.pinyin{color:var(--green);font-size:1rem;text-align:right}.controls{display:flex;align-items:center;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));color:var(--muted)}.icon{min-width:44px;min-height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:10px;cursor:pointer}.icon:hover{background:#f3efe4;color:var(--ink)}.icon:disabled{opacity:.3;cursor:default}.play{color:var(--green)}.play svg{padding:5px;width:32px;height:32px;background:var(--tint);border-radius:50%}.hint{font-size:.875rem;text-align:center;margin:20px 0 0;color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}@media(max-width:380px){.pinyin{font-size:.875rem}.word{gap:8px}.brand small{display:none}}
</style>
</head>
<body>
<header class="wrap top"><a class="brand" href="/zh20/" aria-label="Tone Pairs, home"><span class="seal">二</span><span><b>Tone Pairs</b> <small>声调组合</small></span></a><a class="projects" href="/works/" aria-label="Projects"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a></header>
<main class="wrap"><section class="stage" aria-label="Mandarin tone-pair practice"><div class="words" id="words"></div></section><nav class="controls" aria-label="Word controls"></nav><p class="sr" id="status" role="status"></p></main>
<script>
const combos=[[["✈️","飞机","fēijī"],["🇨🇳","中国","Zhōngguó"],["🛬","机场","jīchǎng"],["💡","知道","zhīdào"],["👩","妈妈","māma"]],[["⏰","时间","shíjiān"],["🏦","银行","yínháng"],["📖","词典","cídiǎn"],["⌛","迟到","chídào"],["❓","什么","shénme"]],[["📱","手机","shǒujī"],["🗣️","语言","yǔyán"],["☂️","雨伞","yǔsǎn"],["🌸","美丽","měilì"],["👫","我们","wǒmen"]],[["🎤","唱歌","chànggē"],["🗺️","地图","dìtú"],["💻","电脑","diànnǎo"],["😴","睡觉","shuìjiào"],["🙏","谢谢","xièxie"]]];
const zhuyin=['ㄈㄟ ㄐㄧ','ㄓㄨㄥ ㄍㄨㄛˊ','ㄐㄧ ㄔㄤˇ','ㄓ ㄉㄠˋ','ㄇㄚ ˙ㄇㄚ','ㄕˊ ㄐㄧㄢ','ㄧㄣˊ ㄏㄤˊ','ㄘˊ ㄉㄧㄢˇ','ㄔˊ ㄉㄠˋ','ㄕㄣˊ ˙ㄇㄜ','ㄕㄡˇ ㄐㄧ','ㄩˇ ㄧㄢˊ','ㄩˇ ㄙㄢˇ','ㄇㄟˇ ㄌㄧˋ','ㄨㄛˇ ˙ㄇㄣ','ㄔㄤˋ ㄍㄜ','ㄉㄧˋ ㄊㄨˊ','ㄉㄧㄢˋ ㄋㄠˇ','ㄕㄨㄟˋ ㄐㄧㄠˋ','ㄒㄧㄝˋ ˙ㄒㄧㄝ'];
const syllables=[['fēi','jī'],['Zhōng','guó'],['jī','chǎng'],['zhī','dào'],['mā','ma'],['shí','jiān'],['yín','háng'],['cí','diǎn'],['chí','dào'],['shén','me'],['shǒu','jī'],['yǔ','yán'],['yǔ','sǎn'],['měi','lì'],['wǒ','men'],['chàng','gē'],['dì','tú'],['diàn','nǎo'],['shuì','jiào'],['xiè','xie']];
const meanings=['airplane','China','airport','know','mom','time','bank','dictionary','late','what','mobile phone','language','umbrella','beautiful','we','sing','map','computer','sleep','thank you'];
const extra=[['今天','jīntiān','ㄐㄧㄣ ㄊㄧㄢ',['jīn','tiān'],'today'],['今年','jīnnián','ㄐㄧㄣ ㄋㄧㄢˊ',['jīn','nián'],'this year'],['開水','kāishuǐ','ㄎㄞ ㄕㄨㄟˇ',['kāi','shuǐ'],'boiled water'],['工作','gōngzuò','ㄍㄨㄥ ㄗㄨㄛˋ',['gōng','zuò'],'work'],['桌子','zhuōzi','ㄓㄨㄛ ˙ㄗ',['zhuō','zi'],'table'],['明天','míngtiān','ㄇㄧㄥˊ ㄊㄧㄢ',['míng','tiān'],'tomorrow'],['銀行','yínháng','ㄧㄣˊ ㄏㄤˊ',['yín','háng'],'bank'],['牛奶','niúnǎi','ㄋㄧㄡˊ ㄋㄞˇ',['niú','nǎi'],'milk'],['學校','xuéxiào','ㄒㄩㄝˊ ㄒㄧㄠˋ',['xué','xiào'],'school'],['孩子','háizi','ㄏㄞˊ ˙ㄗ',['hái','zi'],'child'],['老師','lǎoshī','ㄌㄠˇ ㄕ',['lǎo','shī'],'teacher'],['美國','měiguó','ㄇㄟˇ ㄍㄨㄛˊ',['měi','guó'],'United States'],['水果','shuǐguǒ','ㄕㄨㄟˇ ㄍㄨㄛˇ',['shuǐ','guǒ'],'fruit'],['比賽','bǐsài','ㄅㄧˇ ㄙㄞˋ',['bǐ','sài'],'competition'],['椅子','yǐzi','ㄧˇ ˙ㄗ',['yǐ','zi'],'chair'],['上班','shàngbān','ㄕㄤˋ ㄅㄢ',['shàng','bān'],'go to work'],['問題','wèntí','ㄨㄣˋ ㄊㄧˊ',['wèn','tí'],'question, problem'],['報紙','bàozhǐ','ㄅㄠˋ ㄓˇ',['bào','zhǐ'],'newspaper'],['再見','zàijiàn','ㄗㄞˋ ㄐㄧㄢˋ',['zài','jiàn'],'goodbye'],['弟弟','dìdi','ㄉㄧˋ ˙ㄉㄧ',['dì','di'],'younger brother']];
const characters=combos.flatMap(group=>group.map(([,word,pinyin])=>[word,pinyin])).map((item,i)=>[...item,zhuyin[i],syllables[i],meanings[i]]).concat(extra);
const fonts=["'Songti SC','Noto Serif SC',serif","'PingFang SC','Noto Sans SC',sans-serif","'Kaiti SC','STKaiti','zhcy kai',serif","'FZOuYangXunKaiShuS','zhcy ou',serif","'Zhi Mang Xing',serif","'Liu Jian Mao Cao',serif"];
let lastFont=-1;function randomFont(){if(fonts.length<2)return 0;let i;do{i=Math.floor(Math.random()*fonts.length)}while(i===lastFont);lastFont=i;return i}
let current=0;const words=document.querySelector('#words'),status=document.querySelector('#status');
function speak(text){if(!('speechSynthesis' in window)){status.textContent='Pronunciation is not available in this browser.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.8;const voices=speechSynthesis.getVoices().filter(v=>/^(zh|cmn)([-_]|$)/i.test(v.lang));if(voices.length)u.voice=voices[Math.floor(Math.random()*voices.length)];u.onerror=()=>status.textContent='Could not play pronunciation.';speechSynthesis.speak(u)}
function render(){if('speechSynthesis' in window)speechSynthesis.cancel();const b=document.createElement('button');b.type='button';b.className='character';b.style.fontFamily=fonts[randomFont()];b.lang='zh-Hans';b.setAttribute('aria-label','Play '+characters[current][0]+', '+characters[current][1]);b.addEventListener('click',()=>speak(characters[current][0]));const zh=characters[current][2].split(' ');Array.from(characters[current][0]).forEach((char,i)=>{const col=document.createElement('span');col.className='char-column';const glyph=document.createElement('span');glyph.className='glyph';glyph.textContent=char;const z=document.createElement('span');z.className='character-zhuyin';z.lang='zh-Bopo';z.textContent=zh[i];const p=document.createElement('span');p.className='character-pinyin';p.lang='zh-Latn-pinyin';p.textContent=characters[current][3][i];col.append(glyph,z,p);b.append(col)});const meaning=document.createElement('div');meaning.className='meaning';meaning.textContent='('+characters[current][4]+')';words.replaceChildren(b,meaning);status.textContent=''}
function move(delta,animate=false){const n=current+delta;if(n<0||n>=characters.length)return;const old=words.querySelector('.character');if(animate&&old&&!matchMedia('(prefers-reduced-motion: reduce)').matches){old.animate([{transform:'translateX(0)',opacity:1},{transform:'translateX('+(-delta*140)+'px) rotate('+(-delta*5)+'deg)',opacity:0}],{duration:180,easing:'ease-in',fill:'forwards'}).finished.then(()=>{current=n;render();const next=words.querySelector('.character');next.animate([{transform:'translateX('+(delta*90)+'px)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:450,easing:'cubic-bezier(.22,.61,.36,1)'});speak(characters[current][0])})}else{current=n;render();if(animate)speak(characters[current][0])}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});let startX=null;words.addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});words.addEventListener('touchend',e=>{if(startX!==null){const d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>50)move(d<0?1:-1,true);startX=null}},{passive:true});render();
</script>
</body>
</html>
