<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf8f1">
<title>20 Words | fogday</title>
<meta name="description" content="Practice Mandarin tones, one two-character word at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#fbf8f1;--ink:#1d2421;--muted:#5f6b66;--green:#1f5c4a;--tint:#e6f0ea;--line:#d9d3c4;--red:#e34234}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:1rem/1.5 Rubik,system-ui,sans-serif}button{font:inherit;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:3px}a{color:inherit;text-decoration:none}.wrap{width:100%;max-width:34rem;margin:auto;padding:0 16px}.top{min-height:52px;display:flex;align-items:center}.brand{display:flex;align-items:center;gap:8px;flex:1}.seal{width:34px;height:34px;border-radius:8px;background:var(--red);color:#fffdf7;display:grid;place-items:center;font:500 1.25rem 'Noto Serif SC',serif}.brand b{font-size:1.125rem;text-transform:uppercase;letter-spacing:.06em}.brand small{color:var(--muted);font-size:1rem}.projects{color:var(--muted);padding:10px}.projects svg,.icon svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}main{flex:1;display:flex;flex-direction:column}.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0}.progress{text-align:center;color:var(--muted);font-size:.875rem;margin:0 0 22px}.words{display:flex;flex-direction:column;align-items:center;justify-content:center}.character-pinyin{color:var(--green);font-size:1.125rem;margin-top:4px}.character{border:0;background:transparent;color:var(--ink);font-family:"Songti SC","Noto Serif SC",serif;font-size:clamp(5rem,23vw,8rem);line-height:1.2;padding:12px;cursor:pointer;border-radius:14px}.character:hover{background:#f3efe4}.word{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:12px;width:100%;padding:9px 4px;border:0;background:transparent;text-align:left;border-radius:10px;cursor:pointer}.word:hover{background:#f3efe4}.emoji{font-size:1.4rem;text-align:center}.hanzi{font-family:'Songti SC','Noto Serif SC',serif;font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.2}.pinyin{color:var(--green);font-size:1rem;text-align:right}.controls{display:flex;align-items:center;justify-content:space-between;padding:8px 0 calc(8px + env(safe-area-inset-bottom));color:var(--muted)}.icon{min-width:44px;min-height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:10px;cursor:pointer}.icon:hover{background:#f3efe4;color:var(--ink)}.icon:disabled{opacity:.3;cursor:default}.play{color:var(--green)}.play svg{padding:5px;width:32px;height:32px;background:var(--tint);border-radius:50%}.hint{font-size:.875rem;text-align:center;margin:20px 0 0;color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}@media(max-width:380px){.pinyin{font-size:.875rem}.word{gap:8px}.brand small{display:none}}
</style>
</head>
<body>
<header class="wrap top"><a class="brand" href="/zh20/" aria-label="20 Words, home"><span class="seal">二</span><span><b>20 Words</b> <small>二十词</small></span></a><a class="projects" href="/works/" aria-label="Projects"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a></header>
<main class="wrap"><section class="stage" aria-label="Mandarin tone-pair practice"><p class="progress" id="progress" aria-live="polite"></p><div class="words" id="words"></div><p class="hint">Tap the word to hear its pronunciation</p></section><nav class="controls" aria-label="Word controls"><button class="icon" id="prev" aria-label="Previous word"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><button class="icon play" id="play" aria-label="Play this word"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button><button class="icon" id="next" aria-label="Next word"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></nav><p class="sr" id="status" role="status"></p></main>
<script>
const combos=[[["✈️","飞机","fēijī"],["🇨🇳","中国","Zhōngguó"],["🛬","机场","jīchǎng"],["💡","知道","zhīdào"],["👩","妈妈","māma"]],[["⏰","时间","shíjiān"],["🏦","银行","yínháng"],["📖","词典","cídiǎn"],["⌛","迟到","chídào"],["❓","什么","shénme"]],[["📱","手机","shǒujī"],["🗣️","语言","yǔyán"],["☂️","雨伞","yǔsǎn"],["🌸","美丽","měilì"],["👫","我们","wǒmen"]],[["🎤","唱歌","chànggē"],["🗺️","地图","dìtú"],["💻","电脑","diànnǎo"],["😴","睡觉","shuìjiào"],["🙏","谢谢","xièxie"]]];
const characters=combos.flatMap(group=>group.map(([,word,pinyin])=>[word,pinyin]));
let current=0;const words=document.querySelector('#words'),progress=document.querySelector('#progress'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),status=document.querySelector('#status');
function speak(text){if(!('speechSynthesis' in window)){status.textContent='Pronunciation is not available in this browser.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.8;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^zh[-_]CN$/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang))||null;u.onerror=()=>status.textContent='Could not play pronunciation.';speechSynthesis.speak(u)}
function render(){if('speechSynthesis' in window)speechSynthesis.cancel();progress.textContent='Word '+(current+1)+' of '+characters.length;const b=document.createElement('button');b.type='button';b.className='character';b.lang='zh-Hans';b.textContent=characters[current][0];b.setAttribute('aria-label','Play '+characters[current][0]+', '+characters[current][1]);b.addEventListener('click',()=>speak(characters[current][0]));const p=document.createElement('div');p.className='character-pinyin';p.lang='zh-Latn-pinyin';p.textContent=characters[current][1];words.replaceChildren(b,p);prev.disabled=current===0;next.disabled=current===characters.length-1;status.textContent=''}
prev.addEventListener('click',()=>{if(current>0){current--;render()}});next.addEventListener('click',()=>{if(current<characters.length-1){current++;render()}});document.querySelector('#play').addEventListener('click',()=>speak(characters[current][0]));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&!prev.disabled)prev.click();if(e.key==='ArrowRight'&&!next.disabled)next.click()});render();
</script>
</body>
</html>
