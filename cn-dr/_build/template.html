<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf8f1">
<meta name="description" content="Practical Chinese Made Easy. Every Mandarin Insights lesson by Dr. Jia, sorted by level and topic.">
<title>Mandarin Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* All UI icons are from Lucide 1.73 (lucide.dev, ISC licence). */
/* Tokens. Direction: UX/UI Agent Skills "Warm Soft-SaaS" archetype, anchored on the
   library's `lingo` system (Nunito, rounded, tactile 3D button edge), then themed to match
   fogday.com/mahjong. */
:root{
  /* Colours and fonts from fogday.com/mahjong: felt, bone, paper, ink, tile, red; Young Serif + Rubik. Light only, as there. */
  color-scheme:light;
  --paper:#fbf8f1; --surface:#fffdf7; --surface-2:#f3efe4; --surface-3:#e9e3d4;
  --ink:#1d2421; --ink-2:#5f6b66; --ink-3:#5f6b66; --line:#d9d3c4; --line-strong:#c9c0aa;
  --primary:#1f5c4a; --primary-hover:#1a4f40; --primary-press:#154236; --primary-edge:#123a2f;
  --on-primary:#fffdf7; --primary-tint:#e6f0ea; --primary-ink:#1f5c4a;
  --accent:#b8352b;
  --done:#1f7a5c; --done-tint:#e6f0ea; --on-done:#fffdf7;
  --scrim:rgba(29,36,33,.5);
  --focus:#1f5c4a;
  --display:"Young Serif","Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC","SimSun",Georgia,"Times New Roman",serif;
  --font:"Rubik","PingFang SC","Hiragino Sans GB","Heiti SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-cap:.75rem; --fs-sm:.875rem; --fs-body:1rem; --fs-h3:1.25rem; --fs-h2:1.5rem; --fs-display:2.5rem;
  --lh-tight:1.15; --lh-body:1.5;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --edge:3px; /* lingo's tactile bottom border */
  --tap:44px; --bar-h:64px;
  --dur-fast:120ms; --dur:200ms; --ease:cubic-bezier(.2,.8,.2,1);
  --shadow-sheet:0 -8px 32px rgba(42,36,32,.18);
  --ring-w:3px;
  --shadow-card:0 1px 2px rgba(42,36,32,.06);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--fs-body);line-height:var(--lh-body);
  padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom) + var(--s5))}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
a{color:var(--primary-ink)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:var(--ring-w) solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
.wrap{width:100%;max-width:40rem;margin:0 auto;padding:0 var(--s4)}
p,li,h1,h2,h3,dd{overflow-wrap:anywhere}

/* Header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:var(--s3);min-height:56px}
.brand{display:flex;align-items:center;gap:var(--s2);min-width:0;flex:1;min-height:var(--tap);color:inherit;text-decoration:none}
.brand:hover b,.brand:active b{text-decoration:underline;text-underline-offset:3px}
.seal{flex:none;width:32px;height:32px;border-radius:8px;font-family:var(--display);background:var(--accent);color:var(--on-primary);display:grid;place-items:center;font-weight:700;font-size:1.05rem;line-height:1}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-family:var(--display);font-weight:400;font-size:var(--fs-body);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{display:block;font-size:var(--fs-cap);color:var(--ink-3);font-weight:700}

/* Buttons: eight states */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:0 var(--s4);border-radius:var(--r-md);
  border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:var(--fs-sm);
  cursor:pointer;text-decoration:none;transition:transform var(--dur-fast) var(--ease),background-color var(--dur-fast),border-color var(--dur-fast);white-space:normal;text-align:center}
@media (hover:hover){.btn:hover{background:var(--surface-2)}}
.btn:active{transform:translateY(1px)}
.btn.primary{border-width:2px;border-bottom-width:calc(2px + var(--edge))}
.btn.primary:active{transform:translateY(2px);border-bottom-width:4px}
.btn[aria-disabled="true"],.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn[aria-busy="true"]{cursor:progress;opacity:.75}
.btn.primary{background:var(--primary);border-color:var(--primary-edge);color:var(--on-primary)}
@media (hover:hover){.btn.primary:hover{background:var(--primary-hover)}}
.btn.primary:active{background:var(--primary-press)}
.btn[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--on-done)}
.btn.ghost{border-color:transparent;background:transparent;border-bottom-width:2px}
@media (hover:hover){.btn.ghost:hover{background:var(--surface-2)}}
.icon-btn{width:var(--tap);padding:0;flex:none}
.btn svg,.tab svg,.row svg{width:20px;height:20px;flex:none}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Level switch (segmented) */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s1);padding:var(--s1);background:var(--surface-2);border-radius:var(--r-md);margin:var(--s3) 0 var(--s3)}
.seg button{min-height:var(--tap);border:0;border-radius:calc(var(--r-md) - 4px);background:transparent;font-weight:600;font-size:var(--fs-sm);color:var(--ink-2);cursor:pointer;padding:0 var(--s1);
  transition:background-color var(--dur-fast)}
@media (hover:hover){.seg button:hover{background:var(--surface-3);color:var(--ink)}}
.seg button:active{transform:scale(.98)}
.seg button{text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 0 var(--line-strong),0 0 0 1px var(--line)}
.seg small{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:var(--fs-cap);color:var(--ink-3)}

/* Page heading */
.kicker{font-size:var(--fs-cap);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:var(--s5) 0 var(--s1)}
h1.display{font-size:var(--fs-display);line-height:var(--lh-tight);font-family:var(--display);font-weight:400;margin:0;letter-spacing:0;max-width:18ch}
.lede{color:var(--ink-2);margin:var(--s2) 0 0;max-width:46ch}

/* Sections */
.sec{margin-top:var(--s5)}
.sec-note{color:var(--ink-2);font-size:var(--fs-sm);margin:var(--s2) 0 var(--s3);max-width:65ch}
.sub{font-size:var(--fs-sm);font-weight:700;color:var(--ink-2);margin:var(--s5) 0 var(--s1);text-transform:uppercase;letter-spacing:.06em}
.list{list-style:none;margin:0;padding:0}
.list li+li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:var(--s3);width:100%;padding:var(--s3) var(--s1);background:none;border:0;text-align:left;cursor:pointer;border-radius:var(--r-sm);min-height:var(--tap)}
@media (hover:hover){.row:hover{background:var(--surface-2)}}
.row:active{background:var(--surface-3)}
.row .t{font-weight:600;font-size:.9375rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.nolead{grid-template-columns:minmax(0,1fr) auto}
.row.cur{background:var(--primary-tint)}
.row .m.tag-cur{color:var(--primary-ink)}
.row .m.tag-skip{color:var(--accent)}
.row .m.tag-seen{color:var(--ink-2);font-weight:600}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.two button{text-transform:none;letter-spacing:0;font-size:var(--fs-sm)}
.seg.two button[aria-pressed="true"]{background:var(--surface);color:var(--primary-ink);box-shadow:0 1px 0 var(--line-strong),0 0 0 1px var(--line)}
.row .ord{width:44px;height:44px;font-size:1.125rem}
.row:has(.ord){grid-template-columns:44px minmax(0,1fr) auto}
.pg-start{width:100%;margin-bottom:var(--s3)}
.meter{margin:0 0 var(--s3)}
.meter .bar{height:8px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden}
.meter .bar span{display:block;height:100%;background:var(--done);border-radius:inherit}
.meter p{margin:var(--s1) 0 0;font-size:var(--fs-sm);color:var(--ink-2);font-weight:600}
.pick{display:flex;align-items:center;gap:var(--s1);margin-top:var(--s1)}
.pick svg{width:18px;height:18px;transition:transform var(--dur) var(--ease)}
.pick[aria-expanded="true"] svg{transform:rotate(90deg)}
.row .m{font-size:var(--fs-cap);color:var(--ink-3);font-weight:700;margin-top:2px;display:flex;flex-wrap:wrap;gap:0 var(--s2)}
.tag{color:var(--accent);font-weight:700}
.state{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent}
.row[data-done="true"] .state{background:var(--done);border-color:var(--done);color:var(--on-done)}
.row[data-done="true"] .state svg{width:16px;height:16px;stroke-width:3}
.ord{width:56px;height:56px;border-radius:var(--r-sm);background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:var(--fs-h3);color:var(--ink-2);line-height:1}
.ord>span{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1}
.ord small{display:block;margin:0;font-size:.625rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:center}
.more{margin-top:var(--s2);width:100%}

/* Section rows: flat list, each row opens its own page */
.series{display:block;margin-top:var(--s3);border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:var(--s3);align-items:center;width:100%;min-height:64px;padding:var(--s3) var(--s1);
  background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);text-align:left;cursor:pointer;font:inherit}
@media (hover:hover){.srow:hover{background:var(--surface-2)}}
.srow:active{background:var(--surface-3)}
.srow:focus-visible{outline:var(--ring-w) solid var(--focus);outline-offset:-2px}
.srow b{display:block;font-family:var(--display);font-weight:400;font-size:1.0625rem;line-height:1.25}
.srow .sub2{display:block;font-size:var(--fs-sm);color:var(--ink-2);margin-top:2px}
.srow.feat b{color:var(--primary-ink)}
.srow .cnt{font-size:var(--fs-sm);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.srow .cnt.on{color:var(--done);font-weight:600}
.srow .chev{width:20px;height:20px;color:var(--ink-3)}
.page-h{margin:var(--s5) 0 0;color:var(--ink);font-size:1.0625rem;font-family:var(--display);font-weight:400;line-height:1.25}
.back{display:inline-flex;align-items:center;gap:var(--s1);min-height:var(--tap);margin:var(--s3) 0 0 calc(-1 * var(--s2));padding:0 var(--s2);border:0;background:none;color:var(--primary-ink);font:inherit;font-weight:600;font-size:var(--fs-sm);cursor:pointer;border-radius:var(--r-sm)}
.back svg{width:20px;height:20px}
@media (hover:hover){.back:hover{background:var(--surface-2)}}
.back:focus-visible{outline:var(--ring-w) solid var(--focus);outline-offset:2px}
h1.pg-h{font-size:1.75rem;line-height:1.2;font-family:var(--display);font-weight:400;margin:var(--s2) 0 0;outline:none}
.pg{margin-top:var(--s3)}
.pg .tile:first-child{margin-top:0}
.ring{width:48px;height:48px}
.ring circle{stroke-width:5}
.ring .bg{stroke:var(--surface-3)} .ring .fg{stroke:var(--done)}
.ring text{fill:var(--ink);stroke:none;font-size:13px;font-weight:700;font-family:var(--font)}
.ring text.sm{font-size:10.5px}

/* Drill picker: Drill 1, Drill 2 ... laid out in a row that wraps */
.dgrid{list-style:none;margin:0;padding:var(--s2) 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--s2)}
.dtile{display:flex;align-items:center;justify-content:center;gap:var(--s1);width:100%;min-height:var(--tap);padding:0 var(--s2);border-radius:var(--r-md);
  border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:var(--fs-sm);cursor:pointer;white-space:nowrap}
@media (hover:hover){.dtile:hover{background:var(--surface-2)}}
.dtile:active{transform:translateY(1px)}
.dtile svg{width:16px;height:16px;stroke-width:3;display:none}
.dtile[data-done="true"]{background:var(--done);border-color:var(--primary-edge);color:var(--on-done)}
.dtile[data-done="true"] svg{display:block}

/* Practice + materials */
.bio{margin-top:var(--s3);max-width:60ch}
.bio p{margin:0 0 var(--s3);color:var(--ink-2)}
.bio p:first-child{color:var(--ink);font-size:1.0625rem}
.offers{list-style:none;margin:var(--s2) 0 0;padding:0;border-top:1px solid var(--line)}
.offer{padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.offer h3{margin:0 0 var(--s1);font-size:1.0625rem;line-height:1.25;font-family:var(--display);font-weight:400}
.offer p{margin:0 0 var(--s3);color:var(--ink-2);font-size:var(--fs-sm);max-width:60ch}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);margin-top:var(--s3)}
.tile h3{margin:0 0 var(--s1);font-size:var(--fs-h3);line-height:1.25;font-family:var(--display);font-weight:400}
.tile p{margin:0 0 var(--s3);color:var(--ink-2);font-size:var(--fs-sm);max-width:65ch}
.tile .acts{display:flex;gap:var(--s2);flex-wrap:wrap}
.tile.feature{border-color:var(--primary);background:var(--primary-tint)}
.follow{list-style:none;margin:var(--s3) 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
.follow a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);min-height:72px;padding:var(--s2) var(--s1);border-radius:var(--r-lg);background:var(--surface);border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-size:var(--fs-cap);font-weight:600;text-align:center}
.follow svg{width:26px;height:26px;fill:none;stroke:var(--primary);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.follow a:hover{border-color:var(--line-strong)}}
.follow a:active{transform:scale(.97)}
.follow a:focus-visible{outline:var(--ring-w) solid var(--focus);outline-offset:2px}
.empty{padding:var(--s5) var(--s4);text-align:center;color:var(--ink-2);background:var(--surface);border:1.5px dashed var(--line-strong);border-radius:var(--r-lg);margin-top:var(--s3)}
.empty b{display:block;color:var(--ink);font-size:var(--fs-body)}
.foot{margin-top:var(--s8);padding:var(--s5) 0;border-top:1px solid var(--line);font-size:var(--fs-cap);color:var(--ink-3)}
.foot p{margin:0 0 var(--s2);max-width:65ch}

/* Home path card */
.path{margin-top:var(--s4);background:var(--primary-tint);border:1.5px solid var(--primary);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--shadow-card)}
.path .day{font-size:var(--fs-cap);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-ink);margin:0}
.path h2{margin:var(--s1) 0 0;font-family:var(--display);font-weight:400;font-size:1.25rem;line-height:1.3}
.path .btn{width:100%;margin-top:var(--s4)}
.path .hint{margin:var(--s3) 0 0;font-size:var(--fs-sm);color:var(--ink-2)}
.links{display:grid;gap:var(--s2);margin-top:var(--s4)}
.dots{list-style:none;margin:var(--s4) 0 0;padding:0;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px}
.dot{width:100%;min-height:28px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;border-radius:var(--r-sm)}
.dot::before,.legend .k{content:"";display:block;box-sizing:border-box;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink-3);background:var(--surface)}
.dot[data-state="done"]::before,.legend .k.done{background:var(--primary);border-color:var(--primary)}
.dot[data-state="skip"]::before,.legend .k.skip{border:2px dashed var(--accent);background:none}
.dot[data-state="cur"]::before,.legend .k.cur{width:16px;height:16px;border:3px solid var(--primary);background:var(--surface)}
@media (hover:hover){.dot:hover::before{transform:scale(1.2)}}
.dot:focus-visible{outline:var(--ring-w) solid var(--focus);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s2);margin:var(--s2) 0 0;font-size:var(--fs-cap);color:var(--ink-2)}
.legend .k{display:inline-block;vertical-align:middle;margin-right:2px}
.legend .k.cur{width:12px;height:12px;border-width:2.5px}
.path .phr{display:block;margin-top:var(--s2)}
.path .list{margin-top:var(--s1)}

/* Search */
.search{display:flex;gap:var(--s2);align-items:center;margin-top:var(--s4)}
.search input{flex:1;min-width:0;min-height:var(--tap);border-radius:var(--r-md);border:2px solid var(--line-strong);background:var(--surface);color:var(--ink);font:inherit;padding:0 var(--s3)}
.search input:hover{border-color:var(--ink-3)}
.search input:focus-visible{outline:var(--ring-w) solid var(--focus);outline-offset:1px;border-color:var(--focus)}

/* Bottom tab bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bar .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 var(--s1)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--bar-h);border:0;background:none;cursor:pointer;color:var(--ink-3);font-weight:600;font-size:var(--fs-cap);border-radius:var(--r-sm);padding:var(--s1) 0}
@media (hover:hover){.tab:hover{color:var(--ink)}}
.tab:active{transform:scale(.96)}
.tab[aria-selected="true"]{color:var(--primary-ink)}
.tab svg{width:20px;height:20px;padding:4px 18px;box-sizing:content-box;border-radius:var(--r-pill);transition:background-color var(--dur-fast)}
.tab[aria-selected="true"] svg{stroke-width:2.5;background:var(--primary-tint)}
.tab:focus-visible{outline:var(--ring-w) solid var(--focus);outline-offset:-2px}
/* Wide screens: the four sections sit in the header instead of a phone-style bar */
@media (min-width:64rem){
  body{padding-bottom:var(--s6)}
  .top .wrap{max-width:64rem;justify-content:space-between}
  .top .brand{flex:0 1 auto}
  .bar{top:0;bottom:auto;left:50%;right:auto;transform:translateX(-50%);z-index:25;background:none;border:0;padding:0}
  .bar .wrap{display:flex;gap:var(--s1);max-width:none;padding:0}
  .tab{flex-direction:row;gap:var(--s2);min-height:56px;padding:0 var(--s3);font-size:var(--fs-sm)}
  .tab svg{padding:4px 8px}
}

/* Player sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:none}
.sheet-wrap[data-open="true"]{display:block}
.scrim{position:absolute;inset:0;background:var(--scrim);cursor:pointer}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:96dvh;overflow:auto;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-sheet);
  padding:var(--s2) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));animation:up var(--dur) var(--ease)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:var(--r-pill);background:var(--line-strong);margin:0 auto var(--s2)}
.sheet-h{display:flex;align-items:flex-start;gap:var(--s2)}
.sheet-h h2{flex:1;margin:var(--s2) 0 0;font-size:1.125rem;line-height:1.3;font-family:var(--display);font-weight:400}
.player{position:relative;margin:var(--s3) auto;background:#000;border-radius:var(--r-md);overflow:hidden;width:100%}
.player.short{aspect-ratio:9/16;max-height:62dvh;width:auto;max-width:100%}
.player.long{aspect-ratio:16/9}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .loading{position:absolute;inset:0;display:grid;place-items:center;color:#F3ECE2;font-weight:600;font-size:var(--fs-sm)}
.sheet-tt{flex:1;min-width:0}
.sheet-tt .kicker{margin:var(--s2) 0 0}
.sheet-tt h2{margin-top:var(--s1)}
.sheet .acts{display:grid;gap:var(--s1)}
.sheet .acts .btn.primary{width:100%}
.linkbtn{min-height:var(--tap);border:0;background:none;color:var(--ink-2);font:inherit;font-size:var(--fs-sm);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;border-radius:var(--r-sm)}
@media (hover:hover){.linkbtn:hover{color:var(--ink)}}
.linkbtn:focus-visible{outline:var(--ring-w) solid var(--focus);outline-offset:2px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:40rem){
  :root{--fs-display:3rem}
  .sheet{left:50%;right:auto;width:36rem;transform:translateX(-50%);bottom:var(--s4);border-radius:var(--r-lg);animation:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" id="home" href="./" aria-label="Mandarin Insights, Practical Chinese Made Easy. Home"><div class="seal" aria-hidden="true">贾</div><div class="brand-txt"><b>Mandarin Insights</b><span>Practical Chinese Made Easy</span></div></a>
    <button class="btn ghost icon-btn" id="searchBtn" aria-label="Search lessons"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></button>
  </div>
</header>

<main class="wrap" id="main" tabindex="-1"></main>

<nav class="bar" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home</button>
    <button class="tab" role="tab" data-tab="learn" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></svg>Library</button>
    <button class="tab" role="tab" data-tab="practice" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>Practice</button>
    <button class="tab" role="tab" data-tab="materials" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>About</button>
  </div>
</nav>

<div class="sheet-wrap" id="sheetWrap" data-open="false">
  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheet">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-h">
      <div class="sheet-tt"><p class="kicker" id="sheetKicker"></p><h2 id="sheetTitle"></h2></div>
      <a class="btn ghost icon-btn" id="ytLink" target="_blank" rel="noopener" aria-label="Watch on YouTube, opens a new tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a>
      <button class="btn ghost icon-btn" id="closeBtn" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="player" id="player"></div>
    <div class="acts">
      <button class="btn primary" id="nextBtn"><span>Next lesson</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg></button>
      <button class="linkbtn" id="altBtn"></button>
    </div>
  </div>
</div>

<script>
const DATA = /*DATA*/;
const MAT = /*MATERIALS*/;

/* ---------- state ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('cn-dr:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('cn-dr:'+k, JSON.stringify(v)); }catch(e){} }
};
let done = store.get('done', {});           // id -> timestamp
let seen = store.get('seen', {});           // id -> timestamp, set whenever a lesson is opened
const OLD_TAB = {series:'learn', search:'learn'};
let S = { tab: (t => OLD_TAB[t] || t)(store.get('tab','home')), level: store.get('level','beginner'), sub:'all', open:{}, acc:{}, q:'', phr:false, pick:false, stack:[], phrSort: store.get('phrSort','date') };
const ITEMS = DATA.items;
const byId = Object.fromEntries(ITEMS.map(r => [r.id, r]));
const SER = Object.fromEntries(DATA.series.map(s => [s.id, s]));

const LEVELS = [
  {id:'beginner', name:'Beginner', note:'HSK 1 to 2'},
  {id:'intermediate', name:'Intermediate', note:'HSK 3 to 4'},
  {id:'advanced', name:'Advanced', note:'HSK 5+'}
];
const SECTIONS = [
  {id:'series', name:'Lesson Series', note:'Runs of lessons to watch in order.'},
  {id:'pron', name:'Pronunciation', note:'Tones, tricky sounds and what pinyin spelling hides.'},
  {id:'grammar', name:'Grammar & Patterns', note:'Sentence patterns, particles and word order.'},
  {id:'vocab', name:'Vocabulary & Word Building', note:'Word families and how Chinese words are put together.'},
  {id:'phrases', name:'Everyday Phrases', note:'Numbered oldest first, or grouped by situation.'},
  {id:'culture', name:'Culture, Idioms & Slang', note:'Idioms, slang, etiquette and festivals.'},
];
const TOPIC_ORDER = ['Greetings & goodbyes','Essential phrases',"When you don't understand",'Politeness, thanks & apologies','Conversation & small talk','Feelings & reactions',
  'Travel & getting around','Eating out','Shopping & money','Home & daily life','Phone calls','Emergencies & help',
  'Tones','Sounds','Pinyin spelling rules','Tone ear training','Homophone listening','Listening challenges','HSK quizzes',
  'Idioms (成语)','Slang & internet speak','Culture & etiquette','Holidays & festivals'];
const LIMIT = 5;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url = r => r.k==='long' ? `https://www.youtube.com/watch?v=${r.id}` : `https://www.youtube.com/shorts/${r.id}`;
const viewsNum = v => { if(!v) return 0; const m = /([\d.]+)\s*([KM]?)/.exec(v); return m ? parseFloat(m[1])*(m[2]==='K'?1e3:m[2]==='M'?1e6:1) : 0; };
const isDone = id => !!done[id];
const ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
function seriesItems(sid){ return ITEMS.filter(r => r.ser===sid).sort((a,b)=>a.ord-b.ord); }
function seriesLevel(sid){ const c={}; seriesItems(sid).forEach(r=>c[r.lv]=(c[r.lv]||0)+1); return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]; }
function meta(r, opts={}){
  const bits = [];
  if(r.lab && r.lab.length) bits.push(`<span class="tag">${esc(r.lab.join(' · '))}</span>`);
  bits.push(r.k==='long' ? `Lesson · ${esc(r.d)}` : 'Short');
  if(r.v) bits.push(`${esc(r.v)} views`);
  if(opts.level) bits.push(LEVELS.find(l=>l.id===r.lv).name);
  return bits.map(b=>`<span>${b}</span>`).join('');
}
const T = r => r.t.replace(/\s*\((?:Day\s?)?\d+\/\d+\)/, '');   // "(Day 2/30)" and "(1/30)" are dropped from titles
function row(r, ctx, opts={}){
  const lead = opts.ord!=null
    ? `<span class="ord" aria-hidden="true"><span><small>${esc(opts.ordLabel||'Part')}</small>${opts.ord}</span></span>`
    : '';   // no thumbnails: they were all the same face and cost one image request per row
  const label = `${opts.ord!=null?`${opts.ordLabel||'Part'} ${opts.ord}: `:''}${T(r)}${isDone(r.id)?', done':opts.tag?`, ${opts.tag.toLowerCase()}`:''}`;
  const m = opts.tag && !isDone(r.id) ? `<span class="m tag-${opts.tagCls || (opts.cur?'cur':'skip')}">${esc(opts.tag)}</span>` : r.k==='long' ? `<span class="m">Full lesson · ${esc(r.d)}</span>` : '';   // listings show titles, plus Up next or Skipped on a path
  return `<li><button class="row${opts.cur?' cur':''}${opts.ord==null?' nolead':''}" data-id="${r.id}" data-ctx="${esc(ctx)}" data-done="${isDone(r.id)}" aria-label="${esc(label)}">${lead}
    <span><span class="t">${esc(T(r))}</span>${m}</span><span class="state" aria-hidden="true">${ICON_CHECK}</span></button></li>`;
}
function ring(n, total){
  const C = 2*Math.PI*20, f = total ? n/total : 0, txt = `${n}/${total}`;
  return `<svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle class="bg" cx="24" cy="24" r="20"/><circle class="fg" cx="24" cy="24" r="20" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}" transform="rotate(-90 24 24)"/><text x="24" y="28" text-anchor="middle"${txt.length>5?' class="sm"':''}>${txt}</text></svg>`;
}
// Numbered picker laid out in a row that wraps: Drill 1, Drill 2 ... / Part 1, Part 2 ... / Day 1, Day 2 ...
function drillGrid(ctx, items, label='Drill', num=(r,i)=>i+1){
  CTX[ctx] = items.map(r=>r.id);
  return `<ul class="dgrid">${items.map((r,i)=>{ const tag=`${label} ${num(r,i)}`, base=`${tag}: ${T(r)}`;
    return `<li><button class="dtile" data-id="${r.id}" data-ctx="${esc(ctx)}" data-done="${isDone(r.id)}" data-label="${esc(base)}" aria-label="${esc(base+(isDone(r.id)?', done':''))}">${tag}${ICON_CHECK}</button></li>`; }).join('')}</ul>`;
}
// Every card on every tab is an accordion like Practice. ACC holds the items and panel for cards that are not series or drill types.
const ACC = {};
function accItems(key){
  if(key.startsWith('ser:')) return seriesItems(key.slice(4));
  if(key.startsWith('drill:')) return drillPool(key.slice(6));
  return (ACC[key] && ACC[key].items) || [];
}
// Series page: Continue button, then a numbered list with titles.
function seriesPanel(sid){
  const key = 'ser:'+sid, it = seriesItems(sid), isPath = sid===PATH, lab = isPath ? 'Day' : 'Part';
  const num = (r,i) => isPath ? r.ord : i+1;
  let next, max = 0;
  if(isPath){ const ps = pathState(); next = ps.next; max = ps.max; } else next = it.find(r=>!isDone(r.id));
  const n = it.filter(r=>isDone(r.id)).length;
  CTX[key] = it.map(r=>r.id);
  const btn = next ? `<button class="btn primary pg-start" id="pgStart" data-play="${next.id}" data-ctx="${key}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg><span>${n||(isPath&&max)?'Continue':'Start'}: ${lab} ${num(next, it.indexOf(next))}</span></button>`
    : `<p class="sec-note"><b>All ${it.length} done.</b> Tap any ${lab.toLowerCase()} to watch it again.</p>`;
  return btn + `<ul class="list">${it.map((r,i)=>{ const cur = r===next, skip = isPath && !isDone(r.id) && !cur && r.ord < max;
    return row(r, key, {ord:num(r,i), ordLabel:lab, cur, tag: cur ? 'Up next' : skip ? 'Skipped' : ''}); }).join('')}</ul>`;
}
// Drill page: progress, one Start button (unfinished first, shuffled), and an optional numbered list.
function drillPanel(kind){
  const key = 'drill:'+kind, pool = drillPool(kind), n = pool.filter(r=>isDone(r.id)).length, left = pool.length - n;
  CTX[key] = pool.map(r=>r.id);
  const open = !!S.pick;
  return `<div class="meter"><div class="bar" aria-hidden="true"><span style="width:${pool.length?Math.round(100*n/pool.length):0}%"></span></div><p>${n} of ${pool.length} done</p></div>
    <button class="btn primary pg-start" id="pgStart" data-drill="${esc(kind)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg><span>${left ? `Start: ${left} drill${left===1?'':'s'} left` : `Start again: all ${pool.length}, shuffled`}</span></button>
    <button class="linkbtn pick" data-pick aria-expanded="${open}" aria-controls="pickList">Pick one<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    <ul class="list" id="pickList"${open?'':' hidden'}>${pool.map((r,i)=>row(r, key, {ord:i+1, ordLabel:'Drill'})).join('')}</ul>`;
}
// Everyday Phrases: by number (oldest first, with Continue and a watched count) or grouped by situation.
const isSeen = id => !!seen[id] || isDone(id);
function phrasesPanel(its){
  const lv = S.level, key = 'phr:'+lv, byDate = S.phrSort !== 'topic';
  const seg = `<div class="seg two" role="group" aria-label="Order">${[['date','By number'],['topic','By situation']].map(([v,l])=>`<button data-phrsort="${v}" aria-pressed="${(v==='date')===byDate}">${l}</button>`).join('')}</div>`;
  if(!byDate) return seg + grouped('lv:phrases', its);
  const nums = its.filter(r=>r.no).sort((a,b)=>a.no-b.no), rest = its.filter(r=>!r.no);   // full lessons have no number
  const all = nums.concat(rest), w = all.filter(r=>isSeen(r.id)).length, at = store.get('phrAt:'+lv, 0);
  const next = nums.find(r=>r.no>at && !isSeen(r.id)) || nums.find(r=>!isSeen(r.id));
  CTX[key] = all.map(r=>r.id);
  return seg + `<div class="meter"><div class="bar" aria-hidden="true"><span style="width:${Math.round(100*w/all.length)}%"></span></div><p>${w} of ${all.length} watched</p></div>
    ${next ? `<button class="btn primary pg-start" id="pgStart" data-play="${next.id}" data-ctx="${key}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg><span>${w?'Continue':'Start'}: No. ${next.no}</span></button>` : ''}
    <ul class="list">${nums.map(r=>row(r, key, {ord:r.no, ordLabel:'No.', cur:r===next, tag: r===next ? 'Up next' : (!isDone(r.id) && seen[r.id]) ? 'Watched' : '', tagCls: r===next ? 'cur' : 'seen'})).join('')}</ul>
    ${rest.length ? `<h3 class="sub">Full lessons</h3><ul class="list">${rest.map(r=>row(r, key)).join('')}</ul>` : ''}`;
}
function accPanel(key){
  if(key.startsWith('ser:')) return seriesPanel(key.slice(4));
  if(key.startsWith('drill:')) return drillPanel(key.slice(6));
  return ACC[key] ? ACC[key].panel() : '';
}
function card(key, name, sub, items, panel, o={}){
  ACC[key] = {items, panel};
  const n = items.filter(r=>isDone(r.id)).length;
  return acc(key, name, sub, n, o.ring===false ? 0 : items.length, o.feat);
}
// Each section is a row that opens its own page. PAGES holds the title and blurb for the page header.
const PAGES = {};
const unitOf = key => key.startsWith('drill:') ? 'drills' : 'lessons';
// Review holds only finished lessons, so it shows a plain count
function cntText(key, n, total){ return !total ? '' : (n && key!=='pr:review') ? `${n} of ${total}` : `${total} ${total===1 ? unitOf(key).slice(0,-1) : unitOf(key)}`; }
function acc(key, name, sub, n, total, feat){
  PAGES[key] = {name, sub};
  const c = cntText(key, n, total), on = n>0 && key!=='pr:review';
  return `<button class="srow${feat?' feat':''}" data-push="${esc(key)}" data-total="${total}" aria-label="${esc(name)}${c?`, ${c}${on?' done':''}`:''}"><span><b>${esc(name)}</b><span class="sub2">${esc(sub)}</span></span><span class="cnt${on?' on':''}">${esc(c)}</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>`;
}
function scard(sid){
  const s = SER[sid], it = seriesItems(sid), n = it.filter(r=>isDone(r.id)).length;
  return acc('ser:'+sid, s.name, s.blurb, n, it.length);
}
// context lists drive "Next lesson"
const CTX = {};
function list(key, items, opts={}){
  CTX[key] = items.map(r=>r.id);
  const open = S.open[key] || items.length <= LIMIT+1 || S.stack.length>0;
  const shown = open ? items : items.slice(0, LIMIT);
  let h = `<ul class="list" id="l-${key}">${shown.map(r=>row(r,key,opts)).join('')}</ul>`;
  if(items.length > LIMIT+1 && !S.stack.length) h += `<button class="btn more" data-more="${esc(key)}" aria-expanded="${open}" aria-controls="l-${key}">${open?'Show fewer':`Show all ${items.length}`}<svg viewBox="0 0 24 24" aria-hidden="true" style="transform:rotate(${open?180:0}deg)"><path d="m6 9 6 6 6-6"/></svg></button>`;
  return h;
}
function grouped(key, items, opts={}){
  const groups = {};
  items.forEach(r => (groups[r.top] = groups[r.top] || []).push(r));
  const names = Object.keys(groups).sort((a,b)=>(TOPIC_ORDER.indexOf(a)+99)%999-(TOPIC_ORDER.indexOf(b)+99)%999);
  if(names.length===1) return list(key, items, opts);
  return names.map(n => `<h3 class="sub">${esc(n)}${groups[n].length>1?` <span style="font-weight:700">· ${groups[n].length}</span>`:''}</h3>${list(key+':'+n, groups[n], opts)}`).join('');
}

/* ---------- views ---------- */
function learnHead(){ const L = LEVELS.find(l=>l.id===S.level);
  return `<h1 class="page-h">Library</h1>`; }
function viewLearn(bodyOnly){
  let items = ITEMS.filter(r => r.lv===S.level);
  if(!bodyOnly) return `<div id="learnHead">${learnHead()}</div>
    <div class="seg" role="tablist" aria-label="Level">${LEVELS.map(l=>`<button role="tab" data-level="${l.id}" aria-selected="${l.id===S.level}">${l.name}<small>${l.note}</small></button>`).join('')}</div>
    <div id="learnBody">${viewLearn(true)}</div>`;
  let h = '';

  const cards = [];
  SECTIONS.forEach(def => {
    if(def.id==='series'){
      const sids = DATA.series.map(x=>x.id).filter(sid => seriesLevel(sid)===S.level);
      if(!sids.length) return;
      cards.push(card('lv:series', def.name, def.note, sids.flatMap(seriesItems), () => `<div class="series">${sids.map(scard).join('')}</div>`));
      return;
    }
    const its = items.filter(r => r.sec===def.id);
    if(!its.length) return;
    let panel;
    if(def.id==='drills') panel = () => { const g={}; its.forEach(r=>(g[r.top]=g[r.top]||[]).push(r));
      return Object.keys(g).sort((a,b)=>TOPIC_ORDER.indexOf(a)-TOPIC_ORDER.indexOf(b)).map(n=>`<h3 class="sub">${esc(n)}</h3>${drillGrid('lvdrill:'+n, g[n])}`).join(''); };
    else if(def.id==='phrases') panel = () => phrasesPanel(its);
    else panel = () => ['pron','culture'].includes(def.id) ? grouped(`lv:${def.id}`, its) : list(`lv:${def.id}`, its);
    cards.push(card('lv:'+def.id, def.name, def.note || `${its.length} lessons`, its, panel));
  });
  return h + `<div class="series">${cards.join('')}</div>`;
}
function updateLevel(){
  $('#learnHead').innerHTML = learnHead(); $('#learnBody').innerHTML = viewLearn(true);
  document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.level===S.level))); rove();
}
function viewPractice(){
  const drills = ITEMS.filter(r=>r.sec==='drills');
  const topics = ['Tone ear training','Homophone listening','Listening challenges','HSK quizzes'];
  const blurbs = {'Tone ear training':'She says one word. Name the tone before she reveals it.','Homophone listening':'Same syllables, different tones and meanings. Hear the difference.','Listening challenges':'Real-speed questions. Answer out loud before the reveal.','HSK quizzes':'Exam-style questions at HSK 1 and 2.'};
  const watched = Object.entries(done).sort((a,b)=>a[1]-b[1]).map(([id])=>byId[id]).filter(Boolean);
  const dayMs = 864e5, now = Date.now();
  const due = watched.filter(r => now - done[r.id] > dayMs);
  CTX['review'] = (due.length?due:watched).map(r=>r.id);
  return `<p class="kicker">Repetition training</p><h1 class="display">Practice</h1>
    <p class="lede">Open a drill type and pick a drill. Say each answer aloud, then let her confirm it.</p>
    <div class="series">${drillCard('all','Mixed drill session','Shuffled across all four types.',true)}${topics.map(t=>drillCard(t,t,blurbs[t])).join('')}</div>
    <h2 class="sub">Review</h2><div class="series">${card('pr:review','Review what you watched','Lessons you marked done more than a day ago, oldest first.', due.length?due:watched,
      () => watched.length ? list('review', due.length?due:watched, {level:true}) : `<div class="empty"><b>Nothing to review yet</b>Mark a lesson done in the player and it will come back here tomorrow.</div>`)}</div>` + foot();
}
// Lucide icons (lucide.dev, ISC licence): circle-play for YouTube, camera for Instagram, music for TikTok, globe for her site. Placeholders until brand icons are supplied.
const FOLLOW_ICON = {
  'YouTube':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9.003a1 1 0 0 1 1.517-.859l4.997 2.997a1 1 0 0 1 0 1.718l-4.997 2.997A1 1 0 0 1 9 14.996z"/><circle cx="12" cy="12" r="10"/></svg>',
  'Instagram':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg>',
  'TikTok':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16V3a1 1 0 0 0-1.28-.96l-10 2.917a1 1 0 0 0-.72.96V19"/><circle cx="18" cy="16" r="3"/><circle cx="6" cy="19" r="3"/></svg>',
  web:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>'
};
function offer(c){
  return `<li class="offer"><h3>${esc(c.name)}</h3><p>${esc(c.desc)}</p><a class="btn${c.feature?' primary':''}" href="${c.url}" target="_blank" rel="noopener">${esc(c.cta)}</a></li>`;
}
function viewMaterials(){
  return `<p class="kicker">About</p><h1 class="display">Dr. Jia</h1>
    <div class="bio">${MAT.bio.map(t=>`<p>${esc(t)}</p>`).join('')}</div>
    <h2 class="sub">Classes with Dr. Jia</h2><ul class="offers">${MAT.courses.map(offer).join('')}</ul>
    <h2 class="sub">Free guides</h2><ul class="offers">${MAT.free.map(offer).join('')}</ul>
    <h2 class="sub">Follow</h2><ul class="follow">${MAT.follow.map(f=>`<li><a href="${f.url}" target="_blank" rel="noopener" aria-label="${esc(f.label ? `${f.label}, ${f.name}` : f.name)}, opens a new tab">${FOLLOW_ICON[f.name]||FOLLOW_ICON.web}<span>${esc(f.label||f.name)}</span></a></li>`).join('')}</ul>` + foot();
}
const PATH = 'survival30';
// Continue goes to the last day opened if it is not done yet, else the next undone day after it, else the first gap.
function pathState(){
  const it = seriesItems(PATH), n = it.filter(r=>isDone(r.id)).length;
  const at = store.get('pathAt', 0), max = store.get('pathMax', 0);
  const atItem = it.find(r=>r.ord===at);
  const next = (atItem && !isDone(atItem.id)) ? atItem : (it.find(r=>r.ord>at && !isDone(r.id)) || it.find(r=>!isDone(r.id)) || null);
  return {it, n, next, max, started: n>0 || max>0};
}
function dotState(r, next, max){ return isDone(r.id) ? 'done' : r===next ? 'cur' : r.ord < max ? 'skip' : 'todo'; }
const DOT_WORD = {done:'done', cur:'up next', skip:'skipped', todo:'not started'};
function dots(it, next, max){
  return `<ol class="dots" aria-label="${it.length} days">${it.map(r=>{ const st=dotState(r,next,max);
    return `<li><button class="dot" data-id="${r.id}" data-ctx="ser:${PATH}" data-state="${st}"${st==='cur'?' aria-current="step"':''} aria-label="${esc(`Day ${r.ord}: ${T(r)}, ${DOT_WORD[st]}`)}"></button></li>`; }).join('')}</ol>
    <p class="legend" aria-hidden="true"><span class="k done"></span>Done <span class="k skip"></span>Skipped <span class="k cur"></span>Up next</p>`;
}
function milestone(n){ return n>=21 ? 'Three weeks of phrases done.' : n>=14 ? 'Two weeks of phrases done.' : n>=7 ? 'One week of phrases done.' : ''; }
function phrases(it){
  const got = it.filter(r=>isDone(r.id)); if(!got.length) return '';
  const open = !!S.phr;
  return `<button class="linkbtn phr" data-phr aria-expanded="${open}" aria-controls="phrList">Phrases learned: ${got.length}</button>
    <ul class="list" id="phrList"${open?'':' hidden'}>${got.map(r=>row(r,'ser:'+PATH)).join('')}</ul>`;
}
function homeCard(){
  const {it, n, next, max, started} = pathState(), s = SER[PATH];
  const ms = milestone(n);
  if(!next) return `<div class="path" id="pathCard"><p class="day">All ${it.length} days done</p><h2>You finished ${esc(s.name)}</h2>${dots(it,null,max)}
    <button class="btn primary" data-goto="learn">Find your next lessons in the Library</button>${phrases(it)}</div>`;
  return `<div class="path" id="pathCard"><p class="day">Day ${next.ord} of ${it.length}</p><h2>${esc(T(next))}</h2>${dots(it,next,max)}
    <button class="btn primary" id="pathBtn" data-play="${next.id}" data-ctx="ser:${PATH}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg><span>${started?'Continue':'Start'}: Day ${next.ord}</span></button>
    ${phrases(it)}<p class="hint">${ms ? `<b>${ms}</b>` : 'Mark each day done to move ahead. Tap a dot to jump to any day.'}</p></div>`;
}
function updateHome(){ const c = $('#pathCard'); if(c) c.outerHTML = homeCard(); }
function viewHome(){
  const s = SER[PATH];
  return `<p class="kicker">Start here</p><h1 class="display">${esc(s.name)}</h1>
    <p class="lede">New to Mandarin? Watch one short lesson a day, in Dr. Jia's order.</p>
    ${homeCard()}
    <div class="series">${(()=>{ const tips = ITEMS.filter(r=>r.sec==='tips');
      return card('home:tips','How to study','Short talks from Dr. Jia on why learning stalls and what to do instead.', tips, ()=>list('tips', tips)); })()}</div>
    <div class="links">
      <button class="btn" data-goto="learn">Browse all ${ITEMS.length} lessons</button>
      <button class="btn" data-goto="practice">Practice and review</button>
    </div>` + foot();
}
function viewSearch(){
  const q = S.q.trim().toLowerCase();
  const num = /^(?:#|no\.?\s*)?(\d+)$/.exec(q);
  const res = !q ? [] : num ? ITEMS.filter(r => r.no === +num[1]) : ITEMS.filter(r => r.t.toLowerCase().includes(q) || (r.top||'').toLowerCase().includes(q)).sort((a,b)=>viewsNum(b.v)-viewsNum(a.v));
  CTX['search'] = res.map(r=>r.id);
  return `<p class="kicker">Search</p><h1 class="display">Find a lesson</h1>
    <form class="search" role="search" id="searchForm"><label class="vh" for="q">Search all ${ITEMS.length} lessons</label><input id="q" type="search" placeholder="Try 了, tones, bill, or No. 42" value="${esc(S.q)}" autocomplete="off" enterkeyhint="search"><button class="btn" type="button" data-tab-go="learn">Cancel</button></form>
    <p class="sec-note" aria-live="polite">${q ? `${res.length} result${res.length===1?'':'s'}, most viewed first` : `Searches titles and topics across all ${ITEMS.length} lessons.`}</p>
    ${q && !res.length ? `<div class="empty"><b>No lessons match "${esc(S.q)}"</b>Try a shorter word, pinyin, or the English meaning.</div>` : `<ul class="list">${res.map(r=>row(r,'search', r.no ? {ord:r.no, ordLabel:'No.'} : {})).join('')}</ul>`}`;
}
function foot(){
  return `<footer class="foot"><p>© Mandarin Insights by Dr. Hanyu Jia.</p></footer>`;
}

/* ---------- pages ---------- */
const TAB_NAME = {home:'Home', learn:'Library', practice:'Practice', materials:'About', search:'Search'};
function tabView(){ return S.tab==='search' ? viewSearch() : S.tab==='home' ? viewHome() : S.tab==='practice' ? viewPractice() : S.tab==='materials' ? viewMaterials() : viewLearn(); }
function viewPage(){
  if(!PAGES[S.stack[0]]) tabView();                                   // registers this tab's rows
  for(let i=1;i<S.stack.length;i++) if(!PAGES[S.stack[i]]) accPanel(S.stack[i-1]); // nested rows register when the parent page renders
  const key = S.stack[S.stack.length-1], pg = PAGES[key] || {name:'', sub:''};
  const parent = S.stack.length>1 ? (PAGES[S.stack[S.stack.length-2]]||{}).name : TAB_NAME[S.tab];
  return `<button class="back" data-back><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>${esc(parent)}</button>
    <h1 class="pg-h" id="pgH" tabindex="-1">${esc(pg.name)}</h1>${pg.sub?`<p class="lede">${esc(pg.sub)}</p>`:''}
    <div class="pg">${accPanel(key)}</div>` + foot();
}
function push(key){
  try{ history.replaceState(Object.assign({}, history.state, {y: window.scrollY}), ''); }catch(e){}
  S.stack = S.stack.concat(key); S.pick = false;
  try{ history.pushState({tab:S.tab, stack:S.stack, y:0}, ''); }catch(e){}
  window.scrollTo(0,0); render(false); $('#pgH').focus({preventScroll:true});
}
function focusRow(k){ const b = k && document.querySelector(`[data-push="${CSS.escape(k)}"]`); if(b) b.focus({preventScroll:true}); }
function back(){
  if(history.state && history.state.stack && history.state.stack.length) return history.back();
  const k = S.stack[S.stack.length-1]; S.stack = S.stack.slice(0,-1); render(false); focusRow(k);
}
window.addEventListener('popstate', e => {
  const st = e.state || {tab:S.tab, stack:[]}, was = S.stack;
  if($('#sheetWrap').dataset.open==='true') closePlayer();
  S.tab = st.tab || S.tab; S.stack = st.stack || [];
  render(false); window.scrollTo(0, st.y||0);
  if(S.stack.length < was.length) focusRow(was[S.stack.length]); else if(S.stack.length) $('#pgH').focus({preventScroll:true});
});

/* ---------- render ---------- */
function render(focusMain){
  const v = S.stack.length ? viewPage() : tabView();
  $('#main').innerHTML = v;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab===S.tab)));
  rove();
  if(S.tab==='search'){ const i=$('#q'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }
  else if(focusMain){ $('#main').focus({preventScroll:true}); }
}
function go(tab){ S.tab=tab; S.stack=[]; try{ history.replaceState({tab, stack:[], y:0}, ''); }catch(e){} if(tab!=='search') store.set('tab',tab); window.scrollTo(0,0); render(true); }

/* ---------- player ---------- */
let cur = null, queue = null, qi = 0, lastFocus = null, drillName = '', pathMode = false;
function openPlayer(id, ctx, keepQueue){
  const r = byId[id]; if(!r) return;
  cur = r;
  if(keepQueue){ qi = queue.indexOf(id); }
  else {
    if(ctx && !CTX[ctx] && ctx.startsWith('ser:')) CTX[ctx] = seriesItems(ctx.slice(4)).map(x=>x.id);
    if(ctx && CTX[ctx]){ queue = CTX[ctx].slice(); qi = queue.indexOf(id); } else { queue=[id]; qi=0; }
    pathMode = ctx === 'ser:'+PATH;
  }
  seen[r.id] = Date.now(); store.set('seen', seen);
  if(ctx && ctx.startsWith('phr:')) store.set('phrAt:'+ctx.slice(4), r.no||0);
  if(pathMode){ store.set('pathAt', r.ord); store.set('pathMax', Math.max(store.get('pathMax',0), r.ord)); }
  if($('#sheetWrap').dataset.open!=='true') lastFocus = document.activeElement;
  $('#sheetTitle').textContent = T(r);
  const p = $('#player'); p.className = 'player ' + (r.k==='long'?'long':'short');
  p.innerHTML = `<div class="loading" role="status">Loading video</div><iframe title="${esc(T(r))}" src="https://www.youtube-nocookie.com/embed/${r.id}?autoplay=1&playsinline=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="eager"></iframe>`;
  p.querySelector('iframe').addEventListener('load', () => { const l=p.querySelector('.loading'); if(l) l.remove(); }, {once:true});
  $('#ytLink').href = url(r);
  $('#sheetKicker').textContent = drillName ? `${drillName}: ${qi+1} of ${queue.length}`
    : pathMode ? `Day ${r.ord} of ${queue.length}`
    : [r.lab&&r.lab.join(', '), LEVELS.find(l=>l.id===r.lv).name, r.top].filter(Boolean).join(' · ');
  syncActs();
  $('#sheetWrap').dataset.open = 'true';
  document.body.style.overflow = 'hidden';
  $('#closeBtn').focus();
}
function closePlayer(){
  $('#player').innerHTML = ''; $('#sheetWrap').dataset.open = 'false'; document.body.style.overflow = ''; drillName='';
  const lf = lastFocus, inCard = lf && lf.closest && lf.closest('#pathCard');
  const sel = lf ? (lf.id ? '#'+lf.id : (lf.dataset && lf.dataset.id) ? `${inCard?'#pathCard ':''}.${lf.classList[0]}[data-id="${lf.dataset.id}"]` : null) : null;
  refreshProgress(); updateHome();
  if(S.stack.length){ const y = window.scrollY; $('#main').innerHTML = viewPage(); window.scrollTo(0, y); }
  const t = (lf && document.body.contains(lf)) ? lf : (sel && document.querySelector(sel)) || document.querySelector(`[data-id="${cur&&cur.id}"]`) || document.querySelector('#pathCard .btn');
  if(t) t.focus();
}
function refreshProgress(){
  // update done marks without rebuilding the page, so focus can return to the trigger
  document.querySelectorAll('.row[data-id]').forEach(b=>{ const d=isDone(b.dataset.id); b.dataset.done=String(d); const r=byId[b.dataset.id]; if(r) b.setAttribute('aria-label', T(r)+(d?', done':'')); });
  document.querySelectorAll('.dtile[data-id]').forEach(b=>{ const d=isDone(b.dataset.id); b.dataset.done=String(d); b.setAttribute('aria-label', b.dataset.label+(d?', done':'')); });
  document.querySelectorAll('.srow[data-push]').forEach(c=>{ const tot=+c.dataset.total; if(!tot) return;
    const k=c.dataset.push, n=accItems(k).filter(r=>isDone(r.id)).length, t=cntText(k,n,tot), sp=c.querySelector('.cnt');
    const on = n>0 && k!=='pr:review'; sp.textContent=t; sp.classList.toggle('on', on); c.setAttribute('aria-label', `${PAGES[k].name}, ${t}${on?' done':''}`); });
}
const hasNext = () => queue && qi > -1 && qi < queue.length-1;
const nextName = () => pathMode ? `Day ${byId[queue[qi+1]].ord}` : 'lesson';
// One primary action: mark done (if not yet) and move on. A text link covers skipping, undoing, or marking a drill.
function syncActs(){
  const d = isDone(cur.id), nx = hasNext(), b = $('#nextBtn'), a = $('#altBtn');
  let label;
  if(drillName) label = nx ? 'Next drill' : 'End of drills';
  else if(nx) label = (d ? '' : 'Done · ') + (pathMode ? `Next: ${nextName()}` : 'Next lesson');
  else label = (d ? '' : 'Done · ') + (pathMode ? 'Finish' : 'Close');
  b.querySelector('span').textContent = label;
  const off = drillName && !nx; b.disabled = off; b.setAttribute('aria-disabled', String(off));
  if(drillName) a.textContent = d ? 'Mark not done' : 'Mark done';
  else if(d) a.textContent = 'Mark not done';
  else a.textContent = nx ? `Skip to ${pathMode ? nextName() : 'next lesson'} without marking done` : '';
  a.hidden = !a.textContent;
}
function markDone(v){ if(v) done[cur.id]=Date.now(); else delete done[cur.id]; store.set('done',done); }
function primaryAct(){
  if(drillName){ if(hasNext()) openPlayer(queue[qi+1], null, true); return; }
  if(!isDone(cur.id)) markDone(true);
  if(hasNext()) return openPlayer(queue[qi+1], null, true);
  const wasPath = pathMode; closePlayer();
  if(wasPath && S.tab!=='home') go('home');
}
function altAct(){
  if(drillName || isDone(cur.id)){ markDone(!isDone(cur.id)); syncActs(); $(isDone(cur.id)||drillName ? '#altBtn' : '#nextBtn').focus(); return; }
  if(hasNext()) openPlayer(queue[qi+1], null, true);
}
function drillPool(kind){
  let pool = ITEMS.filter(r=>r.sec==='drills');
  if(kind==='level') pool = pool.filter(r=>r.lv===S.level);
  else if(kind!=='all') pool = pool.filter(r=>r.top===kind);
  return pool;
}
function drillCard(kind, label, blurb, feat){
  const pool = drillPool(kind), n = pool.filter(r=>isDone(r.id)).length;
  return acc('drill:'+kind, label, blurb, n, pool.length, feat);
}
function startDrill(kind){
  const shuffle = a => a.map(r=>[Math.random(),r]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
  const all = drillPool(kind), left = all.filter(r=>!isDone(r.id));
  const pool = left.length ? shuffle(left).concat(shuffle(all.filter(r=>isDone(r.id)))) : shuffle(all);
  CTX['drill'] = pool.map(r=>r.id);
  drillName = kind==='all' ? 'Mixed session' : kind==='level' ? `${LEVELS.find(l=>l.id===S.level).name} drills` : kind;
  openPlayer(pool[0].id, 'drill');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if(!t) return;
  if(t.id==='home'){ e.preventDefault(); return go('home'); }
  if(t.dataset.push){ return push(t.dataset.push); }
  if(t.dataset.drill){ return startDrill(t.dataset.drill); }
  if(t.dataset.phrsort){ S.phrSort=t.dataset.phrsort; store.set('phrSort',S.phrSort); $('#main').innerHTML=viewPage(); const b=document.querySelector(`[data-phrsort="${S.phrSort}"]`); b&&b.focus(); return; }
  if(t.dataset.pick!==undefined){ S.pick=!S.pick; t.setAttribute('aria-expanded', String(S.pick)); $('#pickList').hidden=!S.pick; return; }
  if(t.dataset.back!==undefined){ return back(); }
  if(t.matches('.tab')) return go(t.dataset.tab);
  if(t.dataset.tabGo) return go(t.dataset.tabGo);
  if(t.dataset.level){ S.level=t.dataset.level; S.sub='all'; store.set('level',S.level); updateLevel(); t.focus(); return; }
  if(t.dataset.more){ const k=t.dataset.more; S.open[k]=!S.open[k]; render(false); const b=document.querySelector(`[data-more="${CSS.escape(k)}"]`); b&&b.focus(); return; }
  if(t.dataset.goto) return go(t.dataset.goto);
  if(t.dataset.play){ drillName=''; return openPlayer(t.dataset.play, t.dataset.ctx); }
  if(t.dataset.phr!==undefined){ S.phr=!S.phr; t.setAttribute('aria-expanded', String(S.phr)); $('#phrList').hidden=!S.phr; return; }
  if(t.matches('.row, .dtile, .dot') && t.dataset.id){ const c=t.dataset.ctx||'';
    drillName = c.startsWith('drill:') ? (c==='drill:all'?'Mixed session':c.slice(6)) : c.startsWith('lvdrill:') ? c.slice(8) : '';
    return openPlayer(t.dataset.id, c); }
});
$('#searchBtn').addEventListener('click', () => { S.tab='search'; S.stack=[]; render(false); });
$('#main').addEventListener('input', e => { if(e.target.id==='q'){ S.q = e.target.value; const pos=e.target.selectionStart; render(false); const i=$('#q'); i.setSelectionRange(pos,pos); } });
$('#main').addEventListener('submit', e => { e.preventDefault(); const i=$('#q'); i&&i.blur(); });
$('#closeBtn').addEventListener('click', closePlayer);
$('#scrim').addEventListener('click', closePlayer);
$('#nextBtn').addEventListener('click', primaryAct);
$('#altBtn').addEventListener('click', altAct);
function rove(){ document.querySelectorAll('[role="tablist"]').forEach(l=>{ l.querySelectorAll('[role="tab"]').forEach(t=>t.tabIndex = t.getAttribute('aria-selected')==='true'?0:-1); }); }
document.addEventListener('keydown', e => {
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if(tab && ['ArrowRight','ArrowLeft','ArrowDown','ArrowUp','Home','End'].includes(e.key)){
    const tabs=[...tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]')]; let i=tabs.indexOf(tab);
    i = e.key==='Home'?0 : e.key==='End'?tabs.length-1 : (i + (['ArrowRight','ArrowDown'].includes(e.key)?1:-1) + tabs.length) % tabs.length;
    e.preventDefault(); const sel = tabs[i].dataset.level ? `[data-level="${tabs[i].dataset.level}"]` : `.tab[data-tab="${tabs[i].dataset.tab}"]`;
    tabs[i].click(); const n=document.querySelector(sel); if(n && document.activeElement!==n) n.focus(); return;
  }
  if($('#sheetWrap').dataset.open!=='true') return;
  if(e.key==='Escape'){ e.preventDefault(); closePlayer(); }
  if(e.key==='Tab'){ const f=[...$('#sheet').querySelectorAll('button:not([disabled]):not([hidden]),a[href],iframe')]; const a=f[0], z=f[f.length-1];
    if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); } else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); } }
});
document.addEventListener('focusin',e=>{ const sh=$('#sheet'); if(sh && !sh.hidden && sh.offsetParent!==null && !sh.contains(e.target)){ const f=sh.querySelector('button:not([disabled]),a[href]'); if(f) f.focus(); } });
try{ history.replaceState({tab:S.tab, stack:[], y:0}, ''); }catch(e){}
render(false);
</script>
</body>
</html>
