<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page.title }} · Fogday Studios</title>
<meta name="description" content="{{ page.description }}">
{% include head.html %}
{% if page.theme %}<script>/* This map only works in one theme ({{ page.theme }}): lock it, without touching the visitor's saved choice */
document.documentElement.dataset.theme = '{{ page.theme }}'; document.documentElement.dataset.themeLocked = '';</script>{% endif %}
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.css">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.js" defer></script>
<style>
  /* Header on top, map fills the rest of the window. No footer: it would cover Mapbox's required attribution. */
  html { scrollbar-gutter: auto; } /* map pages never scroll, so don't reserve scrollbar space */
  body.map-page { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  body.map-page main { flex: 1; position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; }
  html[data-theme-locked] .theme-toggle { visibility: hidden; } /* hidden but keeps its space, so the header doesn't shift between pages */
  /* Map name in the header, in place of the wordmark: same slab face and fixed light-blue gradient as the Works title.
     Tapping it opens the map menu. */
  .map-switch { position: relative; min-width: 0; margin-bottom: 13px; }  /* bottom lines up with the icons, like the wordmark */
  .map-switch summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-width: 0;
    padding: 8px 0; margin: -8px 0;  /* taller tap target, same position */
    -webkit-tap-highlight-color: transparent;
  }
  .map-switch summary::-webkit-details-marker { display: none; }
  .map-switch summary:focus-visible { outline: 2px solid var(--title-1); outline-offset: 4px; border-radius: 2px; }
  .map-heading {
    font-family: var(--font-logo); font-weight: 400; font-size: clamp(1.15rem, 4.6vw, 1.5rem);
    line-height: 1; letter-spacing: .03em; text-transform: uppercase; margin: 0; min-width: 0;
    text-box: trim-both cap alphabetic;
    background-image: linear-gradient(to right, var(--title-1), var(--title-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    padding: .2em .1em; margin: -.2em -.1em;  /* room so the gradient doesn't clip letter edges */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;  /* very long names shorten instead of wrapping */
  }
  .map-chevron { flex: none; color: var(--title-2); transition: transform .2s ease; }
  .map-switch[open] .map-chevron { transform: rotate(180deg); }
  .map-switch summary:hover .map-heading { opacity: .8; }

  /* The menu */
  .map-menu {
    position: absolute; z-index: 30; top: calc(100% + 14px); left: -8px;
    min-width: 220px; max-width: calc(100vw - 16px); max-height: calc(100dvh - 120px); overflow-y: auto;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 12px 32px rgb(0 0 0 / .28); padding: 6px;
    animation: map-menu-in .16s ease-out;
  }
  @keyframes map-menu-in { from { opacity: 0; transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .map-menu { animation: none; } .map-chevron { transition: none; } }
  .map-menu ul { list-style: none; margin: 0; padding: 0; }
  .map-menu a {
    display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 6px;
    font: 500 1rem/1.2 var(--font-ui); color: var(--ink); text-decoration: none; white-space: nowrap;
  }
  .map-menu a:hover, .map-menu a:focus-visible { background: color-mix(in srgb, var(--ink) 8%, transparent); outline: none; }
  .map-menu a[aria-current="page"] { font-weight: 700; color: var(--title-1); }
  .map-menu a[aria-current="page"]::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-left: -2px; margin-right: 2px; }  /* dot = you are here */
  .map-menu .ext { color: var(--muted); font-weight: 400; }
  .map-menu .all { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
  .map-menu .all a { color: var(--muted); font-size: .9rem; }
  header .wrap { flex-wrap: nowrap; }
  body.map-page header { position: relative; z-index: 40; }  /* the open menu sits above the city row, legend and map controls */

  /* Panels floating over the map, in the site's colors (follow light/dark mode) */
  .map-places button, .map-legend {
    background: color-mix(in srgb, var(--bg) 84%, transparent);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: var(--ink); border: 1px solid var(--line);
    font: 500 .9rem/1.2 var(--font-ui);
  }

  /* City picker: one row across the top on every screen size.
     If the cities don't fit, the row scrolls sideways (swipe, trackpad or mouse wheel)
     and the edge with more cities fades out as a hint. */
  /* Outer strip: positions the row and draws the edge fades. Kept separate from the
     scrolling row because iPhone Safari won't swipe a row that has a mask on it. */
  .map-places-wrap {
    --fl: 0px; --fr: 0px;  /* fade widths, set by the script below */
    position: absolute; z-index: 2; top: 12px; left: 0;
    width: fit-content; max-width: 100%;  /* only as wide as the cities, so the rest of the strip still drags the map */
    -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent);
            mask-image: linear-gradient(to right, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent);
  }
  .map-places {
    display: flex; gap: 8px; padding: 0 12px; scroll-padding-inline: 12px;
    overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity; scrollbar-width: none; overscroll-behavior-x: contain;
    touch-action: pan-x;  /* a finger swipe on the row scrolls the cities, not the map */
  }
  .map-places::-webkit-scrollbar { display: none; }
  .map-places button {
    flex: none; min-height: 40px; padding: 0 16px; border-radius: 999px;
    white-space: nowrap; cursor: pointer; scroll-snap-align: start;
    transition: background-color .15s ease, color .15s ease;
  }
  .map-places button:hover { color: var(--accent); }
  /* Selected city: solid "morning fog" white (the light-mode page color) with dark text, in both themes */
  .map-places button[aria-pressed="true"] { background: #edf1f2; color: #1c2830; border-color: #edf1f2; font-weight: 700; }
  .map-places button[aria-pressed="true"]:hover { color: #1c2830; }
  /* Reserve each button's bold width up front, so selecting a city doesn't nudge its neighbors */
  .map-places button { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; }
  .map-places button::after { content: attr(data-name); font-weight: 700; height: 0; overflow: hidden; visibility: hidden; }
  .map-places button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  @media (min-width: 760px) {
    .map-places-wrap { top: 16px; }
    .map-places { padding: 0 16px; scroll-padding-inline: 16px; }
    .map-places button { min-height: 36px; }
  }

  /* Legend: collapsible card, bottom left above the Mapbox logo */
  .map-legend {
    position: absolute; z-index: 2; left: 12px; bottom: 40px;
    max-width: calc(100% - 24px); border-radius: 8px; padding: 0;
    max-height: calc(100% - 112px); overflow-y: auto;  /* never taller than the space under the city row (matters on landscape phones) */
  }
  .map-legend summary {
    list-style: none; cursor: pointer; padding: 10px 14px; min-height: 40px;
    font-weight: 600; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase;
  }
  .map-legend summary::-webkit-details-marker { display: none; }
  .map-legend summary::after { content: " +"; color: var(--muted); }
  .map-legend[open] summary::after { content: " –"; }
  .map-legend ul { list-style: none; margin: 0; padding: 0 14px 12px; display: grid; gap: 6px; font-size: .85rem; }
  .map-legend li { display: flex; align-items: center; gap: 10px; }
  .map-legend .line { flex: none; width: 28px; height: 4px; border-radius: 2px; background: var(--c); }
  .map-legend .line.dashed { background: repeating-linear-gradient(to right, var(--c) 0 6px, transparent 6px 10px); }
</style>
</head>
<body class="map-page wide">
{% assign header_title = page.header_title | default: page.title %}
{% include header.html current="maps" title=header_title %}
<main>
  <div id="map" role="region" aria-label="{{ page.title }} map"></div>
  {% if page.places %}
  <div class="map-places-wrap">
  <nav class="map-places" aria-label="Fly to a city">
    {% for p in page.places %}<button type="button" data-name="{{ p.name }}" data-center="{{ p.center | jsonify }}" data-zoom="{{ p.zoom | default: 10 }}">{{ p.name }}</button>
    {% endfor %}
  </nav>
  </div>
  {% endif %}
  {{ content }}
</main>
<script>
/* Map settings come from each page's front matter:
   title, mapbox_style, center, zoom — optional: bounds, places (city buttons), access_token. */
document.addEventListener('DOMContentLoaded', function () {
  mapboxgl.accessToken = '{{ page.access_token | default: "pk.eyJ1IjoiZm9nZmlzaCIsImEiOiJOeXZlMF9FIn0.I3vP7TOUVxyKTaW27p_IqA" }}';
  var map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/fogfish/{{ page.mapbox_style }}',
    center: {{ page.center | jsonify }},   /* [longitude, latitude] */
    zoom: {{ page.zoom }}{% if page.bounds %},
    maxBounds: {{ page.bounds | jsonify }}{% endif %}
  });
  /* Zoom + compass: top right, or bottom right when city buttons run across the top */
  var wide = window.matchMedia('(min-width: 760px)').matches;
  var roomy = window.matchMedia('(min-width: 760px) and (min-height: 600px)').matches;  /* big enough to show the legend open */
  map.addControl(new mapboxgl.NavigationControl(), '{% if page.places %}bottom-right{% else %}top-right{% endif %}');

  /* City buttons: fly there (or jump, for visitors who prefer reduced motion) */
  var buttons = document.querySelectorAll('.map-places button');
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)');
  Array.prototype.forEach.call(buttons, function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(buttons, function (x) { x.removeAttribute('aria-pressed'); });
      b.setAttribute('aria-pressed', 'true');
      b.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: calm.matches ? 'auto' : 'smooth' });
      var view = { center: JSON.parse(b.dataset.center), zoom: +b.dataset.zoom, bearing: 0 };
      if (calm.matches) map.jumpTo(view);
      else map.flyTo(Object.assign(view, { speed: 2.4, curve: 1.42 }));
    });
  });

  /* City row: fade whichever edge has more cities past it; mouse wheel scrolls it sideways */
  var row = document.querySelector('.map-places');
  if (row) {
    var edges = function () {
      var more = row.scrollWidth - row.clientWidth;
      row.parentNode.style.setProperty('--fl', row.scrollLeft > 2 ? '28px' : '0px');
      row.parentNode.style.setProperty('--fr', row.scrollLeft < more - 2 ? '28px' : '0px');
    };
    row.addEventListener('scroll', edges, { passive: true });
    if (window.ResizeObserver) new ResizeObserver(edges).observe(row);
    window.addEventListener('resize', edges);
    edges();
    /* Backup for phones: if a sideways finger swipe doesn't scroll the row by itself
       (some iPhone Safari versions), move it with the finger. Does nothing when normal swiping works. */
    var t = null;
    row.addEventListener('scroll', function () { if (t && t.mode !== 'manual') t.native = true; }, { passive: true });
    row.addEventListener('touchstart', function (e) {
      var p = e.touches[0];
      t = { x: p.clientX, y: p.clientY, left: row.scrollLeft, mode: null, native: false };
    }, { passive: true });
    row.addEventListener('touchmove', function (e) {
      if (!t) return;
      var p = e.touches[0], dx = t.x - p.clientX, dy = t.y - p.clientY;
      if (!t.mode) {
        if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) t.mode = 'native';         /* up/down: not ours */
        else if (Math.abs(dx) > 30) t.mode = t.native ? 'native' : 'manual';            /* 30px sideways and still no scroll → take over */
      }
      if (t.mode === 'manual') { row.scrollLeft = t.left + dx; if (e.cancelable) e.preventDefault(); }
    }, { passive: false });
    row.addEventListener('touchend', function () { t = null; }, { passive: true });
    row.addEventListener('touchcancel', function () { t = null; }, { passive: true });

    row.addEventListener('wheel', function (e) {
      if (row.scrollWidth > row.clientWidth && Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
        row.scrollLeft += e.deltaY;
        e.preventDefault();
      }
    }, { passive: false });
  }

  /* Map menu: close on a tap outside it or the Escape key */
  var sw = document.querySelector('.map-switch');
  if (sw) {
    document.addEventListener('click', function (e) { if (sw.open && !sw.contains(e.target)) sw.open = false; });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && sw.open) { sw.open = false; sw.querySelector('summary').focus(); }
    });
  }

  /* Legend starts open on larger screens, closed on phones */
  var legend = document.querySelector('.map-legend');
  if (legend && roomy) legend.open = true;
});
</script>
</body>
</html>
