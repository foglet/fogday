# Refreshes treesf/trees.csv (the DataSF Street Tree List) and treesf/neighborhoods.geojson (DataSF Analysis
# Neighborhoods, the 41 areas the tree list names), then builds treesf/trees.json, the cleaned file the page reads
# (.github/scripts/treesf-build.js).
# The list changes slowly, so it runs every three months (Jan, Apr, Jul, Oct 1, 6:17 AM Pacific standard time).
# It also runs when this file changes, which makes the first copy, and on demand from the Actions tab.
name: Refresh SF street trees

on:
  schedule:
    - cron: "17 14 1 1,4,7,10 *"   # UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/treesf-refresh.yml", ".github/scripts/treesf-build.js"]

permissions:
  contents: write

concurrency:
  group: treesf-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download the Street Tree List
        run: |
          cols="treeid,species,description,planteddate,latitude,longitude,legalstatus,mapdbh,analysis_neighborhood,planttype"
          # Ordered by tree id so each refresh's git diff shows only real changes
          curl --fail --silent --show-error --location --retry 4 --retry-delay 20 --max-time 600 --compressed \
            --get "https://data.sf.gov/resource/tkzw-k3nq.csv" \
            --data-urlencode "\$select=${cols}" \
            --data-urlencode "\$where=latitude IS NOT NULL" \
            --data-urlencode "\$order=treeid" \
            --data-urlencode "\$limit=1000000" \
            -o /tmp/trees.csv

      - name: Check it before replacing the copy
        run: |
          head -1 /tmp/trees.csv
          head -1 /tmp/trees.csv | grep -q '^"treeid","species","description","planteddate","latitude","longitude"' \
            || { echo "::error::Unexpected header; columns may have been renamed"; exit 1; }
          rows=$(( $(wc -l < /tmp/trees.csv) - 1 ))
          echo "rows=$rows"
          # About 138,800 trees in Oct 2026. A much smaller file means a broken download, not a real change.
          [ "$rows" -ge 100000 ] || { echo "::error::Only $rows rows; keeping the current copy"; exit 1; }
          size=$(stat -c %s /tmp/trees.csv)
          echo "bytes=$size"
          [ "$size" -lt 90000000 ] || { echo "::error::File is ${size} bytes, near GitHub's 100 MB limit"; exit 1; }
          mv /tmp/trees.csv treesf/trees.csv

      - name: Download the neighborhood boundaries
        run: |
          curl --fail --silent --show-error --location --retry 4 --retry-delay 20 --max-time 300 --compressed \
            --get "https://data.sf.gov/resource/j2bu-swwd.geojson" \
            --data-urlencode "\$select=nhood,the_geom" \
            --data-urlencode "\$order=nhood" \
            --data-urlencode "\$limit=100" \
            -o /tmp/neighborhoods.geojson
          n=$(jq '[.features[] | select(.geometry != null and .properties.nhood != null)] | length' /tmp/neighborhoods.geojson)
          echo "neighborhoods=$n"
          # 41 analysis neighborhoods; anything far off means a broken download
          [ "$n" -ge 35 ] || { echo "::error::Only $n neighborhoods; keeping the current copy"; exit 1; }
          jq -c . /tmp/neighborhoods.geojson > treesf/neighborhoods.geojson

      - name: Download the park sections
        run: |
          # DataSF Park Sections: Rec and Park's sections of Golden Gate Park and McLaren Park (9 in Nov 2026)
          curl --fail --silent --show-error --location --retry 4 --retry-delay 20 --max-time 300 --compressed \
            --get "https://data.sf.gov/resource/8du2-b837.geojson" \
            --data-urlencode "\$select=map_label,tma_property_name,shape" \
            --data-urlencode "\$order=tma_property_name" \
            --data-urlencode "\$limit=100" \
            -o /tmp/park-sections.geojson
          n=$(jq '[.features[] | select(.geometry != null)] | length' /tmp/park-sections.geojson)
          echo "park_sections=$n"
          [ "$n" -ge 5 ] || { echo "::error::Only $n park sections; keeping the current copy"; exit 1; }
          jq -c . /tmp/park-sections.geojson > treesf/park-sections.geojson

      - name: Download the Dogpatch boundary
        run: |
          # DataSF SF Find Neighborhoods (Planning's 117 named neighborhoods): Dogpatch only, which the 41 analysis
          # neighborhoods fold into Potrero Hill
          curl --fail --silent --show-error --location --retry 4 --retry-delay 20 --max-time 300 --compressed \
            --get "https://data.sfgov.org/resource/gfpk-269f.json" \
            --data-urlencode "\$limit=500" \
            -o /tmp/find-neighborhoods.json
          jq -c '.[0] | with_entries(.value |= (if type == "object" then (.type // "object") else . end))' /tmp/find-neighborhoods.json
          # The row whose name (whichever text field) is Dogpatch; its geometry field (the one with coordinates)
          jq -c '{type: "FeatureCollection", features: [.[]
                  | select([.[] | strings | ascii_downcase] | index("dogpatch"))
                  | {type: "Feature", properties: {name: "Dogpatch"},
                     geometry: ([.[] | objects | select(has("coordinates"))][0])}
                  | select(.geometry != null)]}' \
            /tmp/find-neighborhoods.json > /tmp/dogpatch.geojson
          n=$(jq '.features | length' /tmp/dogpatch.geojson)
          echo "dogpatch=$n"
          [ "$n" -ge 1 ] || { echo "::error::No Dogpatch boundary; keeping the current copy"; exit 1; }
          mv /tmp/dogpatch.geojson treesf/dogpatch.geojson

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build trees.json for the page
        run: node .github/scripts/treesf-build.js

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add treesf/trees.csv treesf/neighborhoods.geojson treesf/park-sections.geojson treesf/dogpatch.geojson treesf/trees.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "SF Street Trees: refresh tree list, neighborhoods, park sections and Dogpatch from DataSF ($(date -u +%Y-%m-%d))"
          git push
