<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>About · Fogday Studios</title>
<meta name="description" content="About Fogday Studios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patua+One&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one narrow column under a quiet header; slab wordmark. Pages: /index-v003.html, /data/index-v003.html, /about/index-v003.html. */
:root {
  --bg: #edf1f2;        /* morning fog */
  --surface: #f8fafa;
  --ink: #1c2830;       /* bay water at dusk */
  --muted: #5b6a73;
  --line: #cfd8dc;
  --accent: #1f5f6b;    /* deep bay teal */
  --hot: #ff5500;       /* nav hover */
  --font-logo: "Patua One", "Rockwell", "Roboto Slab", Georgia, serif;
  --font-ui: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: 1.75rem;
  --step-3: clamp(2.4rem, 7vw, 3.6rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10181d; --surface: #172229; --ink: #e2e8ea; --muted: #94a3ab;
    --line: #2a3840; --accent: #7fc2cc; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10181d; --surface: #172229; --ink: #e2e8ea; --muted: #94a3ab;
  --line: #2a3840; --accent: #7fc2cc; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 var(--step-0)/1.6 var(--font-ui);
  padding-inline: 20px;
}
.wrap { max-width: 44rem; margin-inline: auto; }

/* Header */
header { border-bottom: 1px solid var(--line); }
header .wrap {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 12px 24px; padding-block: 22px;
}
.logo {
    font-family: var(--font-logo); font-weight: 400;
  font-size: 1.9rem; line-height: 1; letter-spacing: 0.01em;
  color: var(--ink); text-decoration: none;
}

nav { display: flex; gap: 22px; }
nav a {
  font-family: var(--font-ui); font-weight: 500; font-size: .875rem;
  text-transform: uppercase; letter-spacing: .12em;
  color: var(--muted); text-decoration: none;
  padding-block: 6px;
}
nav a:hover { color: var(--hot); }
nav a[aria-current="page"] { color: var(--ink); }
nav a[aria-current="page"]:hover { color: var(--hot); }
.logo { transition: color .15s ease; }
.logo:hover { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

/* Content */
main .wrap { padding-block: 56px 72px; display: grid; gap: 48px; }
h1, h2 { font-family: var(--font-logo); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: var(--step-3); }
h2 { font-size: var(--step-2); }
p { margin: 0; max-width: 62ch; }
.lede { font-size: var(--step-1); color: var(--muted); }
.stack { display: grid; gap: 16px; }
.eyebrow {
  font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--accent);
}

a.text { color: var(--accent); text-underline-offset: 3px; }

footer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--bg); border-top: 1px solid var(--line);
  padding-inline: 20px; padding-bottom: env(safe-area-inset-bottom, 0px);
}
main { padding-bottom: 64px; } /* room for the fixed footer */
footer .wrap { padding-block: 14px; font-size: .85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }

.logo { font-size: 1.55rem; letter-spacing: 0.04em; }
.braille { color: var(--muted); text-decoration: none; letter-spacing: .08em; font-size: 1rem; }
.braille:hover { color: var(--accent); }

/* Data gallery: one column of full, uncropped images */
.gallery { list-style: none; margin: 0; padding: 0; display: grid; gap: 40px; }
.gallery li { min-width: 0; }
.gallery img { display: block; width: 100%; height: auto; }
.gallery a { display: block; }
.caption { margin-top: 10px; font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.contact { display: grid; gap: 6px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="../index-v003.html" aria-label="Fogday Studios home">
      FOGDAY STUDIOS
    </a>
    <nav aria-label="Main">
      <a href="../data/index-v003.html">Projects</a>
    </nav>
  </div>
</header>

<main>
  <section class="wrap">
    <ul class="gallery">
      <li>
        <img src="https://s3.us-west-1.amazonaws.com/fogday.ai/fogday/slo-35°25'40.6%22N+120°45'16.6%22W.jpeg" alt="home">
        <p class="caption">35°25'40.6"N 120°45'16.6"W</p>
      </li>
    </ul>
    <div class="contact">
      <p>fogfish [at] duck [dot] com</p>
      <p><a class="text" href="https://www.instagram.com/fogfish/" target="_blank" rel="noopener">@fogfish instagram</a></p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© FOGDAY™ <a class="braille" href="https://fogday.com/about" aria-label="About">⠏⠊⠝⠛</a></span>
  </div>
</footer>
</body>
</html>
